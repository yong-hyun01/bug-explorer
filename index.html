media.org/wiki/File:Tenebrionidae_-_Phaleria_bimaculata.JPG", "lang": "commons", "sci": ""}, "coast_tiger": {"title": "Cicindela", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/1/1f/Cicindela_sexguttata.JPG/500px-Cicindela_sexguttata.JPG", "extract": "Cicindela, is a genus of generally brightly colored and metallic tiger beetles, often with some sort of patterning of ivory or cream-colored markings. They are most abundant and diverse in habitats very often near bodies of water with sandy or occasionally clay soils; they can be found along rivers, sea and lake shores, sand dunes, around dry lakebeds, on clay banks, or woodland paths.", "url": "https://en.wikipedia.org/wiki/Cicindela", "lang": "en", "sci": "Common tiger beetles"}, "sea_slater": {"title": "갯강구", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/2/24/Ligia_exotica_s1.jpg/500px-Ligia_exotica_s1.jpg", "extract": "갯강구는 갯강구과에 속하는 동물이다. 학명은 Ligia exotica이다.", "url": "https://ko.wikipedia.org/wiki/%EA%B0%AF%EA%B0%95%EA%B5%AC", "lang": "ko", "sci": ""}, "beach_flea": {"title": "Talitridae", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/8/8b/Talitrus_saltator_2a.jpg/500px-Talitrus_saltator_2a.jpg", "extract": "Talitridae is a family of amphipods. Terrestrial species are often referred to as landhoppers and beach dwellers are called sandhoppers or sand fleas. The name sand flea is misleading, though, because these talitrid amphipods are not siphonapterans, do not bite people, and are not limited to sandy beaches.", "url": "https://en.wikipedia.org/wiki/Talitridae", "lang": "en", "sci": "Family of amphipoda"}, "mud_crab": {"title": "Macrophthalmus japonicus", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/3/36/Yamatoosagani_07h9903c.jpg/500px-Yamatoosagani_07h9903c.jpg", "extract": "Macrophthalmus japonicus, the Japanese mud crab, is a species of sentinel crab in the family Macrophthalmidae native to Asia. The taxon was described by Wilhem de Haan in 1835.", "url": "https://en.wikipedia.org/wiki/Macrophthalmus_japonicus", "lang": "en", "sci": "Species of crab"}, "fiddler_crab": {"title": "Fiddler crab", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/0/0b/Fiddler_crab.jpg/500px-Fiddler_crab.jpg", "extract": "The fiddler crab or calling crab is any of the hundred species of semiterrestrial marine crabs in the family Ocypodidae. These crabs are well known for their extreme sexual dimorphism, where the male crabs have a major claw significantly larger than their minor claw, whilst females' claws are both the same size. The name fiddler crab comes from the appearance of their small and large claw together, looking similar to a fiddle.", "url": "https://en.wikipedia.org/wiki/Fiddler_crab", "lang": "en", "sci": "Genus of crabs"}, "hermit_crab": {"title": "소라게", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/8/8e/Calliactis_and_Dardanus_001.JPG/500px-Calliactis_and_Dardanus_001.JPG", "extract": "소라게 또는 집게(Hermit crab)는 십각목, 소라게상과 또는 참집게상과(Paguroidea) 중에서 주로 고둥의 패각을 직접 짊어지고 생활하는 갑각류를 가리키는 명칭이다. 새우와 게와 동일한 십각목이지만, 조개 등에 몸을 맞추기 위해 체형을 변형시키고 있다.", "url": "https://ko.wikipedia.org/wiki/%EC%86%8C%EB%9D%BC%EA%B2%8C", "lang": "ko", "sci": ""}, "lugworm": {"title": "Blow lugworm", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/e/e7/Arenicola_marina_2010.JPG/500px-Arenicola_marina_2010.JPG", "extract": "The blow lugworm, also known as sandworm, is a large species of marine worm. Its coiled castings are a familiar sight on a beach at low tide but the animal itself is rarely seen except by those who, from curiosity or to use as fishing bait, dig the worm out of the sand.", "url": "https://en.wikipedia.org/wiki/Blow_lugworm", "lang": "en", "sci": "Species of annelid worm"}, "barnacle": {"title": "따개비", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/e/e8/Balanus_glandula01.jpg/500px-Balanus_glandula01.jpg", "extract": "따개비(Balanidae Leach, 1817)는 따개비과에 속하는 동물이다.", "url": "https://ko.wikipedia.org/wiki/%EB%94%B0%EA%B0%9C%EB%B9%84", "lang": "ko", "sci": ""}, "starfish": {"title": "불가사리류", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/a/a3/NSRW_Starfish2.png/500px-NSRW_Starfish2.png", "extract": "불가사리류(문화어: 삼바리)는 극피동물문 불가사리강을 이루는 해양무척추동물들을 두루 일컫는 말이다. 불가사리강은 현대목(Phanerozonia)·유극목(Spinulosa)·차극목(Forcipulata)으로 나뉜다.", "url": "https://ko.wikipedia.org/wiki/%EB%B6%88%EA%B0%80%EC%82%AC%EB%A6%AC%EB%A5%98", "lang": "ko", "sci": "극피동물문 불가사리강을 이루는 해양무척추동물들의 총칭"}, "mt_swallow": {"title": "산제비나비", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/c/cd/Papilio_maackii-ja-wiki.jpg/500px-Papilio_maackii-ja-wiki.jpg", "extract": "산제비나비(학명: Papilio maackii)는 호랑나비과에 속하는 나비이다.", "url": "https://ko.wikipedia.org/wiki/%EC%82%B0%EC%A0%9C%EB%B9%84%EB%82%98%EB%B9%84", "lang": "ko", "sci": "호랑나비과의 나비"}, "blue_band": {"title": "청띠제비나비", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/0/0d/Common_bluebottle%2C_Keitakuen%2C_Osaka.jpg/500px-Common_bluebottle%2C_Keitakuen%2C_Osaka.jpg", "extract": "청띠제비나비(Graphium sarpedon)는 호랑나비과에 속하는 나비이다.", "url": "https://ko.wikipedia.org/wiki/%EC%B2%AD%EB%9D%A0%EC%A0%9C%EB%B9%84%EB%82%98%EB%B9%84", "lang": "ko", "sci": "호랑나비과의 나비"}, "red_admiral": {"title": "큰멋쟁이나비", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/1/1b/RN015_Vanessa_indica.jpg/500px-RN015_Vanessa_indica.jpg", "extract": "큰멋쟁이나비(학명: Vanessa indica)는 네발나비과의 나비이다. 애벌레는 모시풀, 거북꼬리를 먹고 사는데, 팔랑나비처럼 집을 지어서 자신을 보호한다. 천적으로는 애벌레를 짓이겨서 고기경단을 만드는 쌍살벌, 큰멋쟁이나비 애벌레를 포함한 나비 애벌레에 기생하여 숙주가 번데기가 되면 뚫고 나오는 좀벌, 맵시벌이 있다.", "url": "https://ko.wikipedia.org/wiki/%ED%81%B0%EB%A9%8B%EC%9F%81%EC%9D%B4%EB%82%98%EB%B9%84", "lang": "ko", "sci": ""}, "silver_frit": {"title": "Silver-washed fritillary", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/d/d1/Argynnis_paphia_Mitterbach_01.jpg/500px-Argynnis_paphia_Mitterbach_01.jpg", "extract": "The silver-washed fritillary is a common and variable butterfly found over much of the Palearctic realm – Algeria, Europe and across the Palearctic to Japan.", "url": "https://en.wikipedia.org/wiki/Silver-washed_fritillary", "lang": "en", "sci": "Species of butterfly"}, "red_ring": {"title": "Hestina assimilis", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/2/20/Hestia_assimilis_2_CRW_5254-16.jpg/500px-Hestia_assimilis_2_CRW_5254-16.jpg", "extract": "Hestina assimilis, the red ring skirt, is a species of butterfly in the family Nymphalidae found in Asia. It is generally of large size, and is named for the row of red submarginal spots on the hindwing of summer-generation adults. The species is saprophagous, with adults feeding on tree sap, rotting fruit and dung rather than nectar.", "url": "https://en.wikipedia.org/wiki/Hestina_assimilis", "lang": "en", "sci": "Species of butterfly"}, "great_purple": {"title": "왕오색나비", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/1/10/Sasakia_charonda_formosana_male_back_20140525.jpg/500px-Sasakia_charonda_formosana_male_back_20140525.jpg", "extract": "왕오색나비(학명: Sasakia charonda)는 네발나비과에 속한 나비이다. 애벌레는 팽나무의 잎을 먹고 자라며 사슴처럼 두 개의 뿔이 나 있다. 어른벌레는 나무의 수액을 먹으며, 애벌레 상태에서 겨울을 난다. 천적으로는 애벌레에 기생하는 맵시벌이 있다. 날개 길이는 수컷이 50mm, 암컷이 65mm 내외이다.", "url": "https://ko.wikipedia.org/wiki/%EC%99%95%EC%98%A4%EC%83%89%EB%82%98%EB%B9%84", "lang": "ko", "sci": ""}, "mt_satyr": {"title": "산굴뚝나비", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/8/88/Nytha_parisatis_ctb.jpg/500px-Nytha_parisatis_ctb.jpg", "extract": "산굴뚝나비는 나비목 네발나비과에 속하는 나비이다. 학명은 Eumenis autonoe이며 2005년 3월 17일 대한민국의 천연기념물 458호로 지정되어 있다. 1989년 특정야생동·식물로 지정되어 보호 받아 왔으며, 관련 법의 개정에 따라 2017년 멸종위기 야생생물 Ⅰ급으로 지정되어 관리되고 있다. 애벌레는 벼과식물을 먹이로 삼는다.", "url": "https://ko.wikipedia.org/wiki/%EC%82%B0%EA%B5%B4%EB%9A%9D%EB%82%98%EB%B9%84", "lang": "ko", "sci": ""}, "golden_ring": {"title": "장수잠자리", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/9/90/Anotogaster_sieboldii_on_wall.jpg/500px-Anotogaster_sieboldii_on_wall.jpg", "extract": "장수잠자리는 잠자리목 장수잠자리과의 곤충으로 한국, 일본, 중국 등 아시아에 분포한다. 크기 90~105mm. 배에 노란색 줄무늬가 있고 겹눈은 녹색이다. 한반도에서 가장 큰 잠자리로 하천이나 개울에 서식하며, 유충기는 3~4년이다.", "url": "https://ko.wikipedia.org/wiki/%EC%9E%A5%EC%88%98%EC%9E%A0%EC%9E%90%EB%A6%AC", "lang": "ko", "sci": ""}, "carabus_red": {"title": "홍단딱정벌레", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/d/d7/Carabidae_-_Carabus_smaragdinus_branickii.jpg/500px-Carabidae_-_Carabus_smaragdinus_branickii.jpg", "extract": "홍단딱정벌레는 딱정벌레류이다. 몸길이는 30~45mm이다. 친척으로 멋쟁이딱정벌레, 멋조롱박딱정벌레 등이 있다. 딱지날개의 색깔은 개체 또는 아종에 따라 녹색에서 적갈색, 구리색, 빨간색까지 다양한 변이를 보이며 드물게 파란색 딱지날개를 가진 변이도 출현한다. 하지만 멋쟁이딱정벌레처럼 보라색 형질은 발현하지 않는다. 몸은 붉은 색이고 광택이 나며 땅을 빠르게 기어 다니며 사냥한다. 유충도 성충처럼 빠르게 기어 다니며 잡아먹는다.", "url": "https://ko.wikipedia.org/wiki/%ED%99%8D%EB%8B%A8%EB%94%B1%EC%A0%95%EB%B2%8C%EB%A0%88", "lang": "ko", "sci": ""}, "carabus_green": {"title": "멋쟁이딱정벌레", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/f/f9/Ground_Beetle_%28Coptolabrus_jankowskii_lii%29_male_%288554331517%29.jpg/500px-Ground_Beetle_%28Coptolabrus_jankowskii_lii%29_male_%288554331517%29.jpg", "extract": "멋쟁이딱정벌레는 식육아목 딱정벌레류에 속한다. 비슷한 종류로는 홍단딱정벌레, 멋조롱박딱정벌레 등이 있다. 홍단딱정벌레와의 차이점은 딱지날개 위의 혹줄이 훨씬 가늘고 길며 높이도 비교적 일정한 점이다. 양코브스키딱정벌레라고도 한다.", "url": "https://ko.wikipedia.org/wiki/%EB%A9%8B%EC%9F%81%EC%9D%B4%EB%94%B1%EC%A0%95%EB%B2%8C%EB%A0%88", "lang": "ko", "sci": ""}, "luna_long": {"title": "Actias artemis", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/e/e1/Actias_artemis_153644961.jpg/500px-Actias_artemis_153644961.jpg", "extract": "Actias artemis is a moth native to Russia, Korea, and China. The species was first described by Otto Vasilievich Bremer and William Grey in 1853. Actias artemis is a close relative and look-alike of Actias luna, the American Luna moth.", "url": "https://en.wikipedia.org/wiki/Actias_artemis", "lang": "en", "sci": "Species of moth"}, "mt_cicada": {"title": "쓰름매미", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/8/82/Meimuna_mongolica.jpg/500px-Meimuna_mongolica.jpg", "extract": "쓰름매미(Meimuna mongolica)는 애매미속에 속하는 매미이다. 몸 빛깔은 짙은 회색이며 녹색 무늬가 나 있다. 몸에는 흰 가루가 덮여 있으며 배 끝에 흰색 무늬가 있다. 암컷은 긴 산란관이 있다.\n'쓰르람 쓰르람'하는 소리로 울며, 한여름에는 높은 가지에 앉아 운다. 주로 7월 하순~8월 하순경에 나타난다. 보통 쓰르라미라고도 부른다.", "url": "https://ko.wikipedia.org/wiki/%EC%93%B0%EB%A6%84%EB%A7%A4%EB%AF%B8", "lang": "ko", "sci": ""}, "hairy_cicada": {"title": "털매미", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/7/7b/Platypleura_kaempferi_in_Mount_Ibuki.JPG/500px-Platypleura_kaempferi_in_Mount_Ibuki.JPG", "extract": "털매미(학명: Platypleura kaempferi)는 매미과의 곤충이다. 몸에 짧은 털이 나 있어 털매미라고 이름이 붙었다. 몸길이는 대략 날개편 길이를 포함하면 35-42mm가량 된다. 몸 전체적으로 나무들과 비슷한 연고동 및 연갈색, 회색 빛을 띄며, 등 판 가운데에는 주황색 또는 녹색의 W자 무늬가 있다. 날개는 위장하기에 좋은 고동색 및 갈색 계통의 색과 반투명 색으로 되어 있으며 뒷날개는 갈색이다. 몸과 날개가 불규칙한 무늬가 많아서 나무껍질에 앉아 있으면 눈에 잘 띄지 않는다. 털매미는 개체변이가 심한 편이다. 6~9월 여름에 활동하기도 하지만 매미 중 유일하게 가을까지 활동하는 매미이다.", "url": "https://ko.wikipedia.org/wiki/%ED%84%B8%EB%A7%A4%EB%AF%B8", "lang": "ko", "sci": ""}, "mt_grasshopper": {"title": "팥중이", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/7/76/Oedaleus_infernalis.jpg/500px-Oedaleus_infernalis.jpg", "extract": "팥중이는 메뚜기과의 곤충이다. 아시아와 오세아니아에 서식한다. 몸길이는 30~50 mm이며, 녹색과 갈색 두 종류가 있다. 콩중이와 비슷하나 앞가슴 쪽 등판에 X자가 있다는 점이 다르다.", "url": "https://ko.wikipedia.org/wiki/%ED%8C%A5%EC%A4%91%EC%9D%B4", "lang": "ko", "sci": ""}, "striped_hopper": {"title": "Mongolotettix japonicus", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/e/e6/Mongolotettix_japonicus.jpg/500px-Mongolotettix_japonicus.jpg", "extract": "Mongolotettix japonicus is a species of slant-faced grasshopper in the family Acrididae. It is found in eastern Asia.", "url": "https://en.wikipedia.org/wiki/Mongolotettix_japonicus", "lang": "en", "sci": "Species of grasshopper"}, "mt_ant": {"title": "홍가슴개미", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/5/50/Camponotus_obscuripes_DSC_0417.jpg/500px-Camponotus_obscuripes_DSC_0417.jpg", "extract": "홍가슴개미(학명: Camponotus obscuripes)는 일본과 러시아의 사할린 섬에만 분포하는 개미다. 한국에 널리 서식하는 한국홍가슴개미(Camponotus atrox)와는 근연종 관계다.", "url": "https://ko.wikipedia.org/wiki/%ED%99%8D%EA%B0%80%EC%8A%B4%EA%B0%9C%EB%AF%B8", "lang": "ko", "sci": ""}, "giant_hornet": {"title": "장수말벌", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/8/8d/20200512-P1100071_Vespa_mandarinia_japonica.jpg/500px-20200512-P1100071_Vespa_mandarinia_japonica.jpg", "extract": "장수말벌(영어: Asian giant hornet, 학명: Vespa mandarinia 베스파 만다리니아[*])은 말벌과의 곤충으로, 지금까지 알려져 있는 종류 중 가장 거대한 말벌이다. 동아시아의 온대-열대기후 지역에 자생한다. 낮은 야산과 삼림을 서식지로 선호하며, 탁 트인 개활지나 너무 높은 산악지역은 피한다. 장수말벌은 땅굴을 파서 그 안에 벌집을 마련하는데, 대개 땅굴은 설치류 따위 다른 동물이 쓰다 버린 것을 재활용한다. 또는 소나무 같은 큰 식물의 뿌리가 썩어서 구멍이 난 공간을 활용하기도 한다. 주식은 다른 곤충, 나무 수액, 과일, 그리고 꽃벌류의 벌집에서 털어온 벌꿀이다. 몸 길이는 35-45 밀리미터, 날개 편 길이는 75 밀리미터, 독침 길이는 6 밀리미터에 달하여 한 번에 많은 양의 독액을 주입한다.", "url": "https://ko.wikipedia.org/wiki/%EC%9E%A5%EC%88%98%EB%A7%90%EB%B2%8C", "lang": "ko", "sci": "말벌과의 곤충"}, "striped_bug": {"title": "Graphosoma", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/6/61/Becho_Bastavales_Galicia_5.jpg/500px-Becho_Bastavales_Galicia_5.jpg", "extract": "Graphosoma is a genus bugs in the family Pentatomidae. They are commonly known as striped shield bugs for their distinctive markings.", "url": "https://en.wikipedia.org/wiki/Graphosoma", "lang": "en", "sci": "Genus of true bugs"}, "orb_spider": {"title": "Araneus ventricosus", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/1/10/Araneus_ventricosus_L._Koch_090701.jpg/500px-Araneus_ventricosus_L._Koch_090701.jpg", "extract": "Araneus ventricosus is a nocturnal orb-weaver spider found in Russia, Korea, Japan, China, and Taiwan that has been involved in numerous research studies and is easily identified by its nocturnal web-building behavior. Araneus ventricosus venom is effective against invertebrate prey, but its venom is ineffective in vertebrates. Its silk has been researched extensively and has several unique properties. For instance, A. ventricosus is able to produce flagelliform silk, and its TuSp1 and AcSp1 genes have been sequenced. The spider also has unique eyes that are affected by their circadian rhythm and imply the existence of an efferent optic nerve within the species' central nervous system.", "url": "https://en.wikipedia.org/wiki/Araneus_ventricosus", "lang": "en", "sci": "Species of spider"}, "millipede": {"title": "노래기강", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/e/e3/Millipede_mating.JPG/500px-Millipede_mating.JPG", "extract": "노래기는 노래기강의 절지동물을 일컫는다. 배각류(倍脚類)라고도 한다. 과거에는 향랑각시(香娘―)라고도 하였다. 몸은 길며, 머리 부분과 몸통 부분으로 나뉜다. 몸의 단면은 원형이나 활 모양의 삼각형 또는 편평한 반원형이다. 몸통 부분의 체절은 거의 모두 두 개씩 겹쳐진 겹체절을 이루고 있으며, 거기에 두 쌍의 발이 나와 있다. 호흡은 기관으로 하며, 기문은 일반적으로 아랫면의 걷는발이 붙어 있는 자리 가까이에 열려 있다. 대부분 땅 속의 부식질을 먹고 생활한다. 36개의 다리를 지닌 종부터 1,000개 이상의 다리를 지닌 종까지 있다. 고생대 실루리아기부터 출현하였으며 전 세계 16개 목, 140개 과에 약 12,000여 종 이상이 기록되어 있으며, 지구상에 약 80,000여 종이 서식하고 있을 것으로 추정하고 있다. 노래기·왕노래기·공노래기·민달팽이노래기·붉은반점노래기 등이 이에 속한다. 또 노래기의 경우는 길이와 다리가 많다는 점에서 전체적인 모양이 거의 지네와 비슷하여 지네로 혼동하기가 쉽다.", "url": "https://ko.wikipedia.org/wiki/%EB%85%B8%EB%9E%98%EA%B8%B0%EA%B0%95", "lang": "ko", "sci": "노래기강에 속하는 절지동물의 총칭"}, "giant_isopod": {"title": "Bathynomus giganteus", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/9/99/Bathynomus_giganteus_as_seen_by_remotely_operated_vehicle_%28ROV%29_Deep_Discoverer_at_a_depth_of_816_meters_at_South_Reed%2C_Gulf_of_Mexico%2C_2017-11-30.webm/500px--Bathynomus_giganteus_as_seen_by_remotely_operated_vehicle_%28ROV%29_Deep_Discoverer_at_a_depth_of_816_meters_at_South_Reed%2C_Gulf_of_Mexico%2C_2017-11-30.webm.jpg", "extract": "Bathynomus giganteus is a species of aquatic crustacean, of the order Isopoda. It is a member of the giant isopods (Bathynomus), and as such it is related—albeit distantly—to shrimps and crabs. It was the first Bathynomus species ever documented and was described in 1879 by French zoologist Alphonse Milne Edwards after the isopod was found in fishermen's nets off the coast of the Dry Tortugas in the Gulf of Mexico.", "url": "https://en.wikipedia.org/wiki/Bathynomus_giganteus", "lang": "en", "sci": "Species of crustacean"}, "sea_spider": {"title": "바다거미목", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/e/e9/Pycnogonida_collage.png/500px-Pycnogonida_collage.png", "extract": "바다거미목(Pantopoda)은 협각아문에 속하는 절지동물 목의 하나이다. 바다거미강(Pycnogonida)의 유일한 목이다. 이 동물들은 모두 해양 저서성으로 보통 태형동물이나 히드라 등의 고착동물 위를 긴 다리로 천천히 걸으며 피식자의 체액을 흡입하는 육식성 동물이다. 일부는 해면동물, 연체동물, 극피동물 등에 기생하는 것도 있다.", "url": "https://ko.wikipedia.org/wiki/%EB%B0%94%EB%8B%A4%EA%B1%B0%EB%AF%B8%EB%AA%A9", "lang": "ko", "sci": ""}, "deep_shrimp": {"title": "Rimicaris exoculata", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/0/03/Rimicaris_exoculata_%28MNHN-IU-2014-22822%29.jpeg/500px-Rimicaris_exoculata_%28MNHN-IU-2014-22822%29.jpeg", "extract": "Rimicaris exoculata, commonly known as the 'blind shrimp', is a species of shrimp. It thrives on active hydrothermal edifices at deep-sea vents of the Mid-Atlantic Ridge. This species belongs to the Alvinocarididae family of shrimp, named after the DSV Alvin, the vessel that collected the original samples described by M. L. Christoffersen in 1986.", "url": "https://en.wikipedia.org/wiki/Rimicaris_exoculata", "lang": "en", "sci": "Species of crustacean"}, "tube_worm": {"title": "Riftia", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/3/33/Campagne_HOT_-_Vers_g%C3%A9ants_%28Riftia_pachyptila%29_%28Ifremer_00530-64223_-_52381%29.jpg/500px-Campagne_HOT_-_Vers_g%C3%A9ants_%28Riftia_pachyptila%29_%28Ifremer_00530-64223_-_52381%29.jpg", "extract": "Riftia is a monotypic genus of polychaete annelid worms in the Siboglinidae family, which contains the sole species Riftia pachyptila, commonly known as the giant tubeworm or giant beardworm.", "url": "https://en.wikipedia.org/wiki/Riftia", "lang": "en", "sci": "Giant tube worm (species of annelid)"}, "jellyfish": {"title": "해파리", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/2/22/Jelly_Monterey.jpg/500px-Jelly_Monterey.jpg", "extract": "해파리는 해파리아문(영어: Medusozoa)에 속하는 무척추동물의 총칭이다. 해파리는 콩보다 작은 것부터 지름이 2m 이상에 이르기까지 종류가 다양한데, 네 개의 목과 약 200여 종이 여기에 속한다. 전 세계에서 출현한다.", "url": "https://ko.wikipedia.org/wiki/%ED%95%B4%ED%8C%8C%EB%A6%AC", "lang": "ko", "sci": "해파리아문에 속하는 무척추동물의 총칭"}, "anglerfish": {"title": "초롱아귀", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/7/7f/Himantolophus_groenlandicus_by_OpenCage.jpg/500px-Himantolophus_groenlandicus_by_OpenCage.jpg", "extract": "초롱아귀(Himantolophus groenlandicus)는 초롱아귀과에 속하는 육식어류이다. 수심 800m 이하의 심해에서 서식한다. 몸은 럭비공처럼 생겼고 뼈 돌기 튀어나와 있다. 머리의 촉수 끝에는 발광체가 있다. 불이 초롱같다고 해서 초롱아귀라고 붙였다. 빛을 보고 온 작은 물고기를 잡아먹는다. 암컷의 길이는 평균 60cm, 수컷의 길이가 평균 4cm이며 암컷이 수컷보다 더 크다. 일반적으로 수컷이 암컷에게 기생하는 아귀류와는 달리 초롱아귀는 수컷이 암컷에게 기생을 하지 않는다. 때문에 번식을 하기 위해 발광체가 달린 촉수로 수컷을 유인한다. 이름이 아귀가 들어가지만 보통 아귀와 매우 다르다. 아귀는 깊지 않은 수심에 서식하기 때문에 잠수하다 발견할 수 있지만 초롱아귀는 어두운 심해에서 서식하기 때문에 발견할 수 없다. 그리고 아귀는 사냥감이 풍부한 곳에서 살기 때문에 잘 먹어서 살이 올라 식용으로 쓰이지만 초롱아귀는 희귀한 물고기라 식용으로 쓰이는 일은 드문 편이다. 대신 심해 생태의 연구나 진화 연구 분야에서 귀중한 심해어이다.", "url": "https://ko.wikipedia.org/wiki/%EC%B4%88%EB%A1%B1%EC%95%84%EA%B7%80", "lang": "ko", "sci": ""}, "giant_squid": {"title": "대왕오징어", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/7/79/Architeuthis_distribution.png/500px-Architeuthis_distribution.png", "extract": "대왕오징어(大王오징어, 영어: giant squid)는 북대서양, 뉴질랜드, 북태평양 등지에서 발견되는 오징어이다. 학명은 Architeuthis dux(Steenstrup, 1857)이다. Architeuthis는 지배하는 오징어라는 뜻이다. 연체동물문의 두족강, 개안아목, 대왕오징어과에 속한다. 대부분의 개체는 길이 5m를 넘지 않는다.", "url": "https://ko.wikipedia.org/wiki/%EB%8C%80%EC%99%95%EC%98%A4%EC%A7%95%EC%96%B4", "lang": "ko", "sci": "북대서양, 뉴질랜드, 북태평양 등지에서 발견되는 오징어"}, "crinoid": {"title": "바다나리", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/d/d2/Crinoid_on_the_reef_of_Batu_Moncho_Island.JPG/500px-Crinoid_on_the_reef_of_Batu_Moncho_Island.JPG", "extract": "바다나리(Sea lilly 또는 feather star)는 바다나리강(Crinoidea)에 속하는 극피동물의 통칭이다. 강의 학명은 백합꽃을 뜻하는 그리스어 단어 \"krinon\"과 형태를 뜻하는 \"eidos\"에서 따왔다. 극피동물 중 가장 원시적인 것으로서 얕은 연안에서도 발견되지만, 9,000m 깊이의 심해에서도 존재한다는 사실이 확인되었다. 다섯 개의 굴곡성이 있는 팔이 종지(술잔) 모양의 몸에서 방사상으로 나와 있으며, 또한 자루가 나와 바닥의 물체에 붙거나 감겨 있다. 전 세계에 약 620종 가량이 알려져 있으며, 바다나리·바다술·갯고사리 등이 여기에 해당한다.", "url": "https://ko.wikipedia.org/wiki/%EB%B0%94%EB%8B%A4%EB%82%98%EB%A6%AC", "lang": "ko", "sci": ""}, "sea_pig": {"title": "Scotoplanes", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/c/c0/Scotoplanes_globosa1.jpg/500px-Scotoplanes_globosa1.jpg", "extract": "Scotoplanes is a genus of deep-sea sea cucumbers in the family Elpidiidae. The species in this genus are commonly known as sea pigs.", "url": "https://en.wikipedia.org/wiki/Scotoplanes", "lang": "en", "sci": "Genus of deep-sea sea cucumbers known as sea pigs"}, "grub": {"title": "Allomyrina dichotoma L3 Larva.JPG", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/7/71/Allomyrina_dichotoma_L3_Larva.JPG/500px-Allomyrina_dichotoma_L3_Larva.JPG", "extract": "", "url": "https://commons.wikimedia.org/wiki/File:Allomyrina_dichotoma_L3_Larva.JPG", "lang": "commons", "sci": ""}, "cicada_nymph": {"title": "Cicada emerging from nymph skin.JPG", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/a/ab/Cicada_emerging_from_nymph_skin.JPG/500px-Cicada_emerging_from_nymph_skin.JPG", "extract": "", "url": "https://commons.wikimedia.org/wiki/File:Cicada_emerging_from_nymph_skin.JPG", "lang": "commons", "sci": ""}, "antlion_larva": {"title": "Myrmeleon bore larva on hand.jpg", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/5/53/Myrmeleon_bore_larva_on_hand.jpg/500px-Myrmeleon_bore_larva_on_hand.jpg", "extract": "", "url": "https://commons.wikimedia.org/wiki/File:Myrmeleon_bore_larva_on_hand.jpg", "lang": "commons", "sci": ""}, "wireworm": {"title": "Coleoptera larvae (ritnaalden).jpg", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/5/52/Coleoptera_larvae_%28ritnaalden%29.jpg/500px-Coleoptera_larvae_%28ritnaalden%29.jpg", "extract": "", "url": "https://commons.wikimedia.org/wiki/File:Coleoptera_larvae_(ritnaalden).jpg", "lang": "commons", "sci": ""}, "springtail": {"title": "톡토기", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/9/99/Orchesella_cincta.jpg/500px-Orchesella_cincta.jpg", "extract": "톡토기는 톡토기아강에 속하는 절지동물이다. 전 세계에 8,500여 종이 존재한다. 뛰어오를 수 있는 도약기라는 기관이 있으나 날개는 없다. 몸길이는 0.5~3mm로 낙엽이나 썩은 나무 밑, 물 위, 모래 등 전 세계 어느 곳에서나 서식한다. 톡토기는 원시적인 육각류로 배부 제1마디 아랫면에 복관(腹管)이라는 관 모양의 돌기가 있고 점액을 가진 신장형 또는 끈 모양의 주머니가 가장자리로부터 드나들 수 있다. 이는 수분 및 삼투압으로 조절하는 기관이다.", "url": "https://ko.wikipedia.org/wiki/%ED%86%A1%ED%86%A0%EA%B8%B0", "lang": "ko", "sci": ""}, "queen_ant": {"title": "여왕개미", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/c/c1/Meat_eater_ant_qeen_excavating_hole.jpg/500px-Meat_eater_ant_qeen_excavating_hole.jpg", "extract": "여왕개미는 개미 군락에서 알을 낳는 암컷을 이르는 말이다. 대부분의 군락에서는 여왕개미가 개미 군락내의 모든 개미들의 어머니이다. 여왕개미와 일개미는 모두 암컷이지만, 여왕개미는 애벌레일 때 일반 애벌레들과는 다른 먹이를 먹어서 여왕으로 성장한다. 대부분의 종에서는 여왕개미가 한 마리뿐이나, 몇몇 종에서는 여왕개미가 수백에 달하기도 한다.", "url": "https://ko.wikipedia.org/wiki/%EC%97%AC%EC%99%95%EA%B0%9C%EB%AF%B8", "lang": "ko", "sci": ""}, "purse_spider": {"title": "Atypus karschi.jpg", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/e/e8/Atypus_karschi.jpg/500px-Atypus_karschi.jpg", "extract": "", "url": "https://commons.wikimedia.org/wiki/File:Atypus_karschi.jpg", "lang": "commons", "sci": ""}, "mole": {"title": "두더지과", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/e/ed/Talpa_europaea_MHNT.jpg/500px-Talpa_europaea_MHNT.jpg", "extract": "두더지과(Talpidae)는 진무맹장목에 속하는 두더지와 땃쥐류, 데스만류 그리고 기타 중간 크기의 작은 식충동물을 포함하고 있는 포유류 분류군이다. 두더지류는 모두 땅을 파고 들어가는 습성을 갖고 있으며, 종류별로 여러 단계가 있다. 두더지는 땅 속 밑에 사는 동물이다. 땃쥐두더지류와 동아시아두더지류는 약간 덜 하며, 그러나 데스만류는 기본적으로 수생동물이지만 겨울잠을 잘 때는 굴을 판다. 반면에 별코두더지는 매우 독특하여, 물과 땅 속 양쪽에 적응하여 발달했다. 두더지류는 북반구와 아시아 남부 지역, 유럽, 북아메리카에 걸쳐 발견되지만, 아일랜드와 멕시코 북부 지역 아래의 아메리카 지역에서는 발견되지 않는다.", "url": "https://ko.wikipedia.org/wiki/%EB%91%90%EB%8D%94%EC%A7%80%EA%B3%BC", "lang": "ko", "sci": "작은 식충성 포유류의 과"}, "burrow_bug": {"title": "Cydnidae", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/9/98/Cydnus_aterrimus_MHNT.jpg/500px-Cydnus_aterrimus_MHNT.jpg", "extract": "Cydnidae are a family of pentatomoid bugs, known by common names including burrowing bugs or burrower bugs. As the common name would suggest, many members of the group live a subterranean lifestyle, burrowing into soil using their head and forelegs, only emerging to mate and then laying their eggs in soil. Other members of the group are not burrowers, and live above the soil layer, often in close association with plants. Several species are known as agricultural pests.", "url": "https://en.wikipedia.org/wiki/Cydnidae", "lang": "en", "sci": "Family of true bug"}, "red_worm": {"title": "줄지렁이", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/0/0b/Redwiggler1.jpg/500px-Redwiggler1.jpg", "extract": "줄지렁이(학명: Eisenia fetida 에이세니아 페티다[*])는 썩어가는 유기물을 섭취하는 지렁이의 일종이다. 썩어가는 채소, 퇴비, 거름을 먹고 산다. 지표서식성이며, 드물게 흙 속에서 발견된다. 이러한 특성으로 붉은지렁이와 닮아있다.", "url": "https://ko.wikipedia.org/wiki/%EC%A4%84%EC%A7%80%EB%A0%81%EC%9D%B4", "lang": "ko", "sci": ""}, "house_centipede": {"title": "그리마", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/0/0e/Scutigera_coleoptrata_MHNT.jpg/500px-Scutigera_coleoptrata_MHNT.jpg", "extract": "그리마(house centipede, 제주어: 돈버렝이)는 그리마과(Scutigeridae, 표준어: 그리맛과)에 속하는 절지동물의 총칭이다. 지네나 노래기와 같은 벌레와 생김새가 유사하며, 저작할 수 있는 턱이 있으나 대체로 사람을 물지는 않는다. 생김새와 움직이는 폼이 사람들의 혐오감을 유발하나, 실질적인 해를 끼치지는 않고 오히려 해충을 잡아먹는 익충이다. 그리마는 기동력이 뛰어나고 민첩한 포식성 절지동물로, 성체 바퀴벌레(Cockroach), 좀벌레, 파리, 빈대 등 실내 유해 해충을 능동적으로 사냥하여 식해한다. 기온이 내려가면 주택 내부에도 침입하는데 추운 집보다 따뜻한 집에서 많이 찾아볼 수 있다 하여 한국에서는 돈벌레 또는 \"쉰발이/신발이\"로 부르기도 한다. 한국에 서식하는 종류로는 집그리마·혹그리마·고려그리마·큰집게그리마 등이 있다. 그리마는 다른 곤충과 그 허물, 알을 주식으로 하며, 가정에서 바퀴벌레와 그 알을 먹기도 하나 주로 주택 밖에서 서식하는 동물이다. 천적으로는 포유류나 도마뱀, 뱀, 새, 두꺼비, 타란툴라 등이 있으며, 이 중 가장 무서운 천적은 자신을 마취시켜 애벌레의 먹이로 삼는 대모벌이 있다.", "url": "https://ko.wikipedia.org/wiki/%EA%B7%B8%EB%A6%AC%EB%A7%88", "lang": "ko", "sci": ""}, "woodlouse": {"title": "Oniscus asellus", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/9/96/Common_Shiny_Woodlouse_%2830538333473%29.jpg/500px-Common_Shiny_Woodlouse_%2830538333473%29.jpg", "extract": "Oniscus asellus, the common woodlouse, is one of the largest and most common species of woodlouse native to the British Isles and Western and Northern Europe, growing to 16 millimetres (0.63 in) long and 6 millimetres (0.24 in) wide. Oniscus asellus was first described by Swedish biologist Carl Linnaeus in his Systema Naturae, and is a very common species, representing in Britain \"the archetypal 'woodlouse' familiar to the general public\". It lives in a great variety of habitats, but favours damp conditions, especially under rotting wood. O. asellus is also a successfully synanthropic species, dwelling in gardens, walls, and inside houses.", "url": "https://en.wikipedia.org/wiki/Oniscus_asellus", "lang": "en", "sci": "Species of woodlouse"}, "silverfish": {"title": "Silverfish", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/8/84/LepismaSaccharina.jpg/500px-LepismaSaccharina.jpg", "extract": "The silverfish is a species of small, primitive, wingless insect in the order Zygentoma. Its common name derives from the insect's silvery light grey colour, combined with the fish-like appearance of its movements. The scientific name indicates that the silverfish's diet consists of carbohydrates such as sugar or starches. While the common name silverfish is used throughout the global literature to refer to various species of Zygentoma, the Entomological Society of America restricts use of the term solely to Lepisma saccharinum.", "url": "https://en.wikipedia.org/wiki/Silverfish", "lang": "en", "sci": "Small land insect in the order Zygentoma"}, "ground_beetle": {"title": "Ground beetle", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/9/95/Carabus_auratus_with_prey.jpg/500px-Carabus_auratus_with_prey.jpg", "extract": "Ground beetles are a large, cosmopolitan family of beetles, known as Carabidae, with more than 40,000 species worldwide, around 2,000 of which are found in North America and 2,700 in Europe. As of 2015, it is one of the 10 most species-rich animal families. They belong to the suborder Adephaga. Members of the family are primarily carnivorous, but some members are herbivorous or omnivorous.", "url": "https://en.wikipedia.org/wiki/Ground_beetle", "lang": "en", "sci": "Family of beetles"}, "scorpion": {"title": "전갈 (종)", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/f/fa/Mesobuthus_martesnii.jpg/500px-Mesobuthus_martesnii.jpg", "extract": "전갈(全蠍)은 전갈목 전갈과에 속하는 절지동물의 일종이다. 극동전갈, 감갈이라고도 한다. 먹잇감이 나타나면 꼬리를 들고, 차분하게 기다린다. 만주 지역과 중국, 일본, 동남아시아 등지에 살며, 한반도에서는 북부 지역에만 살고 있는 것으로 알려져 있다. 남한에 자생하는 서식지는 없고, 북한에서는 황해도 사리원시 정방산에 있는 정방산전갈살이터가 천연기념물 171호로 보호되어 있다.", "url": "https://ko.wikipedia.org/wiki/%EC%A0%84%EA%B0%88_(%EC%A2%85)", "lang": "ko", "sci": ""}, "slug": {"title": "민달팽이", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/d/da/Ambigolimax.jpg/500px-Ambigolimax.jpg", "extract": "민달팽이(영어: slug) 또는 괄태충(括胎蟲)은 복족류에 속하는 생물로, 달팽이 중에 패각이 없는 종류를 통칭한다.", "url": "https://ko.wikipedia.org/wiki/%EB%AF%BC%EB%8B%AC%ED%8C%BD%EC%9D%B4", "lang": "ko", "sci": ""}, "funnel_spider": {"title": "Agelenidae", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/a/a1/Grass_spider_%28Agelenopsis_naevia%29.JPG/500px-Grass_spider_%28Agelenopsis_naevia%29.JPG", "extract": "The Agelenidae are a large family of spiders in the suborder Araneomorphae. Well-known examples include the common \"grass spiders\" of the genus Agelenopsis. The most widely accepted common name for members of the family is funnel weaver.", "url": "https://en.wikipedia.org/wiki/Agelenidae", "lang": "en", "sci": "Family of spiders"}, "rock_cricket": {"title": "Loxoblemmus doenitzi 439327514 (cropped, rotated).jpg", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/1/15/Loxoblemmus_doenitzi_439327514_%28cropped%2C_rotated%29.jpg/500px-Loxoblemmus_doenitzi_439327514_%28cropped%2C_rotated%29.jpg", "extract": "", "url": "https://commons.wikimedia.org/wiki/File:Loxoblemmus_doenitzi_439327514_(cropped,_rotated).jpg", "lang": "commons", "sci": ""}, "stone_centipede": {"title": "Lithobius forficatus", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/7/7a/Brown_Centipede%2C_Berlin%2C_Berlin%2C_Germany_imported_from_iNaturalist_photo_179402948.jpg/500px-Brown_Centipede%2C_Berlin%2C_Berlin%2C_Germany_imported_from_iNaturalist_photo_179402948.jpg", "extract": "Lithobius forficatus, most commonly known as the garden centipede, brown centipede or stone centipede, is a common centipede of the family Lithobiidae. It is found in Europe and North America.", "url": "https://en.wikipedia.org/wiki/Lithobius_forficatus", "lang": "en", "sci": "Species of centipede"}, "pavement_ant": {"title": "주름개미", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/c/c2/Tetramorium_tsushimae_casent0103103_profile_1.jpg/500px-Tetramorium_tsushimae_casent0103103_profile_1.jpg", "extract": "주름개미는 대한민국, 대만, 일본에 분포하는 종으로, 도시나 시골 주변 어디서나 쉽게 발견된다. 유럽의 T. caespitum이 학명으로 사용되었었지만, 여왕개미의 습성과 형태의 차이로 현재는 T. tsushimae로 구분되었다. 일개미의 평균 몸길이는 2~3mm의 크기를 가지고, 여왕개미는 약 7mm이다. 생김새가 짱구개미와 비슷하나, 짱구개미에 비해 크기가 작다. 주름개미는 주변 보도블럭틈, 돌 아래, 벽 틈 등 주변 어디서나 환경만 따른다면 서식할 수 있다. 혼인 비행은 6~7월이며, 여왕개미의 복수 군체 체제가 잘 발달되어있다. 잡식성으로 죽은 곤충, 과자부스러기, 과일 등 무엇이든 잘 먹는다.", "url": "https://ko.wikipedia.org/wiki/%EC%A3%BC%EB%A6%84%EA%B0%9C%EB%AF%B8", "lang": "ko", "sci": ""}, "bronze_chafer": {"title": "Anomala albopilosa", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/f/f5/Anomala_albopilosa_fom_Tama_City%2C_Tokyo.jpg/500px-Anomala_albopilosa_fom_Tama_City%2C_Tokyo.jpg", "extract": "Anomala albopilosa, known by the common names green chafer, white-haired leaf chafer and sugarcane white grub, is a species of chafer beetle in the family Scarabaeidae. It was originally described in the genus Euchlora by Frederick William Hope in 1839. The beetle is native to Japan, Korea, and Taiwan.", "url": "https://en.wikipedia.org/wiki/Anomala_albopilosa", "lang": "en", "sci": "Species of beetle"}, "purple_dor": {"title": "Phelotrupes auratus", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/e/e5/Phelotrupes2.jpg/500px-Phelotrupes2.jpg", "extract": "Phelotrupes auratus is a species of beetle known by the common names Japanese earth-boring dung beetle and golden dung beetle.", "url": "https://en.wikipedia.org/wiki/Phelotrupes_auratus", "lang": "en", "sci": "Species of beetle"}, "pointy_hopper": {"title": "Atractomorpha lata, Burdwan, West Bengal, India 27 10 2012.jpg", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/6/61/Atractomorpha_lata%2C_Burdwan%2C_West_Bengal%2C_India_27_10_2012.jpg/500px-Atractomorpha_lata%2C_Burdwan%2C_West_Bengal%2C_India_27_10_2012.jpg", "extract": "", "url": "https://commons.wikimedia.org/wiki/File:Atractomorpha_lata,_Burdwan,_West_Bengal,_India_27_10_2012.jpg", "lang": "commons", "sci": ""}, "painted_lady": {"title": "Vanessa cardui", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/c/c8/0_Belle-dame_%28Vanessa_cardui%29_-_Echinacea_purpurea_-_Havr%C3%A9_%283%29.jpg/500px-0_Belle-dame_%28Vanessa_cardui%29_-_Echinacea_purpurea_-_Havr%C3%A9_%283%29.jpg", "extract": "Vanessa cardui is the most widespread of all butterfly species. It is commonly called the painted lady, or formerly in North America the cosmopolitan butterfly.", "url": "https://en.wikipedia.org/wiki/Vanessa_cardui", "lang": "en", "sci": "Species of butterfly"}, "leafhopper": {"title": "Nephotettix cincticeps", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/4/40/Nephotettix_cincticeps.jpg/500px-Nephotettix_cincticeps.jpg", "extract": "Nephotettix cincticeps, the rice green leafhopper, is a species of true bug in the family Cicadellidae. It is a vector of virus diseases in rice and also a pest of barnyard millet. It is a key insect vector transmitting rice dwarf virus (RDV) that causes rice dwarf disease.", "url": "https://en.wikipedia.org/wiki/Nephotettix_cincticeps", "lang": "en", "sci": "Species of true bug"}, "leaf_beetle": {"title": "Chrysolina virgata", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/d/d4/Chrysolina_virgata_2021-07-25_Takohikari.jpg/500px-Chrysolina_virgata_2021-07-25_Takohikari.jpg", "extract": "Chrysolina virgata is a species of leaf beetle in the genus Chrysolina.", "url": "https://en.wikipedia.org/wiki/Chrysolina_virgata", "lang": "en", "sci": "Species of beetle"}, "cranefly": {"title": "각다귀", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/5/55/Tipulidae_April_2008-2.jpg/500px-Tipulidae_April_2008-2.jpg", "extract": "각다귀는 각다귀과(Tipulidae) 곤충의 총칭이다. 전 세계에 걸쳐 분포하고 있어 어디서든 흔히 볼 수 있다.", "url": "https://ko.wikipedia.org/wiki/%EA%B0%81%EB%8B%A4%EA%B7%80", "lang": "ko", "sci": "각다귀과 동물의 총칭"}, "oak_longhorn": {"title": "Neocerambyx raddei.png", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/a/ae/Neocerambyx_raddei.png/500px-Neocerambyx_raddei.png", "extract": "", "url": "https://commons.wikimedia.org/wiki/File:Neocerambyx_raddei.png", "lang": "commons", "sci": ""}, "antler_chafer": {"title": "Dicranocephalus adamsi (from projects.biodiversity.be) ID-2263.jpg", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/b/b4/Dicranocephalus_adamsi_%28from_projects.biodiversity.be%29_ID-2263.jpg/500px-Dicranocephalus_adamsi_%28from_projects.biodiversity.be%29_ID-2263.jpg", "extract": "", "url": "https://commons.wikimedia.org/wiki/File:Dicranocephalus_adamsi_(from_projects.biodiversity.be)_ID-2263.jpg", "lang": "commons", "sci": ""}, "ink_butterfly": {"title": "Dichorragia nesimachus", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/4/42/The_Constable%2C_Dichorragia_nesimachus_%2827318534415%29.jpg/500px-The_Constable%2C_Dichorragia_nesimachus_%2827318534415%29.jpg", "extract": "Dichorragia nesimachus, the constable, is a species of nymphalid butterfly found in Asia. The genus was earlier considered to belong to the subfamily Cyrestinae and sometimes the Apaturinae, but is now considered as a sister of the genus Stibochiona in the subfamily Pseudergolinae. Several geographical forms with variations in colour are noted within the wide distribution range extending from India in the west to Japan in the east. In Vietnam, it is thought to show hill topping behaviour and is typically found in dense forest habitats. They may also be found mud puddling with other species.", "url": "https://en.wikipedia.org/wiki/Dichorragia_nesimachus", "lang": "en", "sci": "Species of butterfly"}, "small_mantis": {"title": "Statilia maculata", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/8/8c/Asian_Jumping_Mantis%2C_North_Eastern_Hill_University%2C_Shillong%2C_Meghalaya%2C_India_imported_from_iNaturalist_photo_49671390.jpg/500px-Asian_Jumping_Mantis%2C_North_Eastern_Hill_University%2C_Shillong%2C_Meghalaya%2C_India_imported_from_iNaturalist_photo_49671390.jpg", "extract": "Statilia maculata, common name Asian jumping mantis or \"小蟷螂\", ko-kamakiri or \"좀사마귀\", jom-sa-ma-gui, is a species of mantis native to Asia that can be found in Russia, China, Japan, Korea, and Sri Lanka.", "url": "https://en.wikipedia.org/wiki/Statilia_maculata", "lang": "en", "sci": "Species of praying mantis"}, "small_cicada": {"title": "Sinfonia opalifera", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/4/4b/Meimuna_opalifera_s5.jpg/500px-Meimuna_opalifera_s5.jpg", "extract": "Sinfonia opalifera, known commonly as Walker's cicada or the elongate cicada, is a species of cicada native to China, Japan, Taiwan, and the Korean Peninsula. It emerges in July and is no longer seen by about October. It is also known in Japan as tsuku-tsuku-bōshi (ツクツクボウシ), named after its distinctive call.", "url": "https://en.wikipedia.org/wiki/Sinfonia_opalifera", "lang": "en", "sci": "Species of true bug"}, "ailanthus_moth": {"title": "Samia cynthia", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/e/e8/Samia_cynthia_adult_male_sjh.JPG/500px-Samia_cynthia_adult_male_sjh.JPG", "extract": "Samia cynthia, the ailanthus silkmoth, is a saturniid moth, used to produce silk fabric but not as domesticated as the silkworm, Bombyx mori. The moth has very large wings of 113–125 mm (4.4–4.9 in), with a quarter-moon shaped spot on both the upper and lower wings, whitish and yellow stripes and brown background. There are eyespots on the outer forewings. The species was first described by Dru Drury in 1773.", "url": "https://en.wikipedia.org/wiki/Samia_cynthia", "lang": "en", "sci": "Species of moth"}, "treehopper": {"title": "Treehopper", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/d/d1/%28MHNT%29_Stictocephala_bisonia.jpg/500px-%28MHNT%29_Stictocephala_bisonia.jpg", "extract": "Treehoppers and thorn bugs are members of the family Membracidae, a group of insects related to the cicadas and the leafhoppers. About 3,200 species of treehoppers in over 400 genera are known. They are found on all continents except Antarctica; only five species are known from Europe. Individual treehoppers usually live for only a few months.", "url": "https://en.wikipedia.org/wiki/Treehopper", "lang": "en", "sci": "Family of insects"}, "leaf_roller": {"title": "거위벌레", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/7/7e/Giraffe_Weevil_Apoderus_Longicollis.jpg/500px-Giraffe_Weevil_Apoderus_Longicollis.jpg", "extract": "거위벌레는 거위벌레과에 속하는 곤충의 총칭이다. 거위처럼 생겨서 '거위벌레'라는 이름이 붙여졌다. 한살이는 '알-애벌레-번데기-성충' 순이이므로 완전 탈바꿈이다.", "url": "https://ko.wikipedia.org/wiki/%EA%B1%B0%EC%9C%84%EB%B2%8C%EB%A0%88", "lang": "ko", "sci": ""}, "asian_damsel": {"title": "Ischnura asiatica (male s4).jpg", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/6/68/Ischnura_asiatica_%28male_s4%29.jpg/500px-Ischnura_asiatica_%28male_s4%29.jpg", "extract": "", "url": "https://commons.wikimedia.org/wiki/File:Ischnura_asiatica_(male_s4).jpg", "lang": "commons", "sci": ""}, "butterfly_dragon": {"title": "Rhyothemis fuliginosa", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/7/72/Rhyothemis_fuliginosa.JPG/500px-Rhyothemis_fuliginosa.JPG", "extract": "Rhyothemis fuliginosa, also known as the butterfly dragonfly or the butterfly flutterer, is a species of dragonfly of the family Libellulidae found throughout East Asia, in the countries of Japan, China, Taiwan, and the Korean Peninsula.", "url": "https://en.wikipedia.org/wiki/Rhyothemis_fuliginosa", "lang": "en", "sci": "Species of dragonfly"}, "water_boatman": {"title": "Corixidae", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/0/05/Hesperocorixa.castanea.-.lindsey.jpg/500px-Hesperocorixa.castanea.-.lindsey.jpg", "extract": "Corixidae is a family of aquatic insects in the order Hemiptera. They are found worldwide in virtually any freshwater habitat and a few species live in saline water. There are about 500 known species worldwide, in 55 genera, including the genus Sigara.", "url": "https://en.wikipedia.org/wiki/Corixidae", "lang": "en", "sci": "Family of true bugs"}, "midge": {"title": "깔따구과", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/d/dc/Chironomus_plumosus01.jpg/500px-Chironomus_plumosus01.jpg", "extract": "깔따구과(Chironomidae)는 전 세계에 분포하는 긴뿔파리류 파리과의 하나다. 등에모기과와 먹파리과(검은파리류), 타우말레아과 등과 밀접한 관련이 있다. 많은 종들이 겉보기에는 모기를 닮았지만, 모기과와는 달리 날개에 인편이 없으며 주둥이가 크다.", "url": "https://ko.wikipedia.org/wiki/%EA%B9%94%EB%94%B0%EA%B5%AC%EA%B3%BC", "lang": "ko", "sci": ""}, "leech": {"title": "거머리", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/7/77/Sucking_leech.jpg/500px-Sucking_leech.jpg", "extract": "거머리는 거머리아강에 딸린 환형동물의 총칭이다.", "url": "https://ko.wikipedia.org/wiki/%EA%B1%B0%EB%A8%B8%EB%A6%AC", "lang": "ko", "sci": ""}, "marmalade_fly": {"title": "Episyrphus balteatus", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/4/40/Marmalade_hoverfly_%28Episyrphus_balteatus%29_male_Wengen_2.jpg/500px-Marmalade_hoverfly_%28Episyrphus_balteatus%29_male_Wengen_2.jpg", "extract": "Episyrphus balteatus, sometimes called the marmalade hoverfly, is a relatively small hoverfly (9–12 mm) of the Syrphidae family, widespread throughout the Palaearctic region, which covers Europe, North Asia, and North Africa. It is considered the most abundant native hoverfly in Central Europe.", "url": "https://en.wikipedia.org/wiki/Episyrphus_balteatus", "lang": "en", "sci": "Species of fly"}, "webworm_moth": {"title": "Fall webworm", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/c/c7/Hyphantria_cunea%2C_adult.jpg/500px-Hyphantria_cunea%2C_adult.jpg", "extract": "The fall webworm is a moth in the family Erebidae known principally for its larval stage, which creates the characteristic webbed nests on the tree limbs of a wide variety of hardwoods in the late summer and fall. It is considered a pest but does not harm otherwise healthy trees. It is well known to commercial tree services and arboriculturists. Fall webworms are an invasive species in East Asia.", "url": "https://en.wikipedia.org/wiki/Fall_webworm", "lang": "en", "sci": "Species of moth"}, "cellar_spider": {"title": "유령거미과", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/6/6d/Pholcus.phalangioides.6908.jpg/500px-Pholcus.phalangioides.6908.jpg", "extract": "유령거미과(Pholcidae)는 거미목 새실젖거미아목의 과로, 거미의 일종이다.", "url": "https://ko.wikipedia.org/wiki/%EC%9C%A0%EB%A0%B9%EA%B1%B0%EB%AF%B8%EA%B3%BC", "lang": "ko", "sci": ""}, "brown_wing_bug": {"title": "Plautia stali (30698316498).jpg", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/b/b4/Plautia_stali_%2830698316498%29.jpg/500px-Plautia_stali_%2830698316498%29.jpg", "extract": "", "url": "https://commons.wikimedia.org/wiki/File:Plautia_stali_(30698316498).jpg", "lang": "commons", "sci": ""}, "german_roach": {"title": "독일바퀴", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/c/c3/Blattodea._Cascuda._Santiago_de_Compostela_1.jpg/500px-Blattodea._Cascuda._Santiago_de_Compostela_1.jpg", "extract": "바퀴 또는 독일바퀴(영어: German cockroach)는 바퀴과에 속하는 가장 대표적인 바퀴벌레이다. 몸은 황색이며 앞가슴등판에 검은 줄무늬 두 개가 있다. 한국에 서식하는 바퀴 중 소형종에 속한다. 가주성 바퀴로 연중 볼 수 있다. 바퀴는 여름에 주로 활동한다. 또 번식력이 아주 왕성하다. 암컷 바퀴벌레 한 마리는 1년 반의 수명 중 산란을 15~20번하는데 한 번에 22~28개의 알을 낳는다고 한다. 즉 암컷 바퀴벌레 한 마리가 곳 바퀴벌레 약 330마리~560마리가 된다는 것이다. 바퀴는 여름에 주로 활동한다.", "url": "https://ko.wikipedia.org/wiki/%EB%8F%85%EC%9D%BC%EB%B0%94%ED%80%B4", "lang": "ko", "sci": "바퀴과에 속하는 대표적인 벌레"}, "ghost_crab": {"title": "Ocypode stimpsoni", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/1/12/Ocypode_stimpsoni_Kanagawa_Japan_2023_10_17.jpeg/500px-Ocypode_stimpsoni_Kanagawa_Japan_2023_10_17.jpeg", "extract": "Ocypode stimpsoni is a small-sized species of crab found in China, the Korean Peninsula, and Japan. It closely resembles O. mortoni but can easily be distinguished because it lacks styles on its eyestalks.", "url": "https://en.wikipedia.org/wiki/Ocypode_stimpsoni", "lang": "en", "sci": "Species of crab"}, "shore_crab": {"title": "방게", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/a/af/Helice_tridens_%28Kohnoura%29.jpg/500px-Helice_tridens_%28Kohnoura%29.jpg", "extract": "방게는 바위게과에 속하며 학명은 Helice tridens이다. 등딱지의 길이는 30mm, 폭은 35mm 가량이다. 몸은 사각형으로 두툼두툼하며 다리에 털이 적고 등딱지 면에는 'H' 모양의 홈이 있다. 눈 사이 이마는 짧은 혀 모양인데, 비스듬히 아래쪽으로 기울었고 앞가장자리가 약간 오목하다. 몸빛은 암녹색이며 해변에 가까운 강가의 갈대가 나는 흙 속에 산다. 한국과 일본, 중국·타이완 등지에 분포한다.", "url": "https://ko.wikipedia.org/wiki/%EB%B0%A9%EA%B2%8C", "lang": "ko", "sci": ""}, "amur_star": {"title": "아무르불가사리", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/9/9c/%E6%B5%B7%E6%98%9F%EF%BC%88%E6%AD%A3%E9%9D%A2%EF%BC%89.JPG/500px-%E6%B5%B7%E6%98%9F%EF%BC%88%E6%AD%A3%E9%9D%A2%EF%BC%89.JPG", "extract": "아무르불가사리(학명 : Asterias amurensis)는 극피동물문 불가사리강에 속하는 무척추동물이다. 태평양 북서에 널리 분포한다.\n‘바다의 해적’이라 불릴만한 아무르불가사리는 무차별적인 포식자이다. 소름끼칠 정도의 크기에 희거나 누르스름한 몸체 위에 얼룩덜룩한 푸른 점 무늬가 있어 혐오스러운 인상을 준다.", "url": "https://ko.wikipedia.org/wiki/%EC%95%84%EB%AC%B4%EB%A5%B4%EB%B6%88%EA%B0%80%EC%82%AC%EB%A6%AC", "lang": "ko", "sci": ""}, "periwinkle": {"title": "Littorina brevicula", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/0/08/Littorina_brevicula_002_Tokyo_bay.jpg/500px-Littorina_brevicula_002_Tokyo_bay.jpg", "extract": "Littorina brevicula is a species of sea snail, a marine gastropod mollusk in the family Littorinidae, the winkles or periwinkles.", "url": "https://en.wikipedia.org/wiki/Littorina_brevicula", "lang": "en", "sci": "Species of gastropod"}, "moon_jelly": {"title": "보름달물해파리", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/2/27/Moon_jellyfish_at_Gota_Sagher.JPG/500px-Moon_jellyfish_at_Gota_Sagher.JPG", "extract": "보름달물해파리(학명: Aurelia aurita)는 전 세계의 연안과 대양에서 쉽게 발견되는 기구해파리목 느릅나무해파리과에 속하는 자포동물이다. 무색 투명한 몸을 가졌고 우산 내에 특징적인 무늬가 있으며, 보통 지름이 약 25 ~ 40 센티미터 이다.", "url": "https://ko.wikipedia.org/wiki/%EB%B3%B4%EB%A6%84%EB%8B%AC%EB%AC%BC%ED%95%B4%ED%8C%8C%EB%A6%AC", "lang": "ko", "sci": ""}, "kuruma_prawn": {"title": "보리새우", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/1/12/Marsupenaeus_japonicus_%28MNHN-IU-2011-5734%29.jpeg/500px-Marsupenaeus_japonicus_%28MNHN-IU-2011-5734%29.jpeg", "extract": "보리새우는 십각목 보리새우과에 속하는 갑각류다. 학명은 Penaeus japonicus이다.", "url": "https://ko.wikipedia.org/wiki/%EB%B3%B4%EB%A6%AC%EC%83%88%EC%9A%B0", "lang": "ko", "sci": ""}, "turban_shell": {"title": "Turbo sazae", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/5/5a/Turbo_cornutus_1.jpg/500px-Turbo_cornutus_1.jpg", "extract": "Turbo sazae, also known by its Japanese name sazae (サザエ), is a species of sea snail, a marine gastropod mollusk, in the family Turbinidae, the turban snails. Despite being commonly eaten in Japan, it had long been confused with Turbo cornutus and with Turbo japonicus before Fukuda (2017) pointed it out.", "url": "https://en.wikipedia.org/wiki/Turbo_sazae", "lang": "en", "sci": "Species of gastropod"}, "mantis_shrimp": {"title": "갯가재", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/0/04/Oratosquilla_oratoria%2C_back.jpg/500px-Oratosquilla_oratoria%2C_back.jpg", "extract": "갯가재(영어: Japanese mantis shrimp, 학명: Oratosquilla oratoria 오라토스퀼라 오라토리아[*])는 서태평양 일대에서 발견되는 구각목에 속하는 갑각류의 하나이다. 한국과 일본 등에서 흔히 식용한다. 사투리로는 쏙, 딱새, 털치라고 부른다. 겉모습이 비슷한 개펄 갑각류인 쏙과 혼동되는 일이 잦다. 갯가재과의 다른 동물들과 마찬가지로, 이 종 역시 강력한 힘을 가진 앞다리를 가지고 있으며 이것으로 먹이가 되는 무척추동물이나 작은 물고기를 잡아먹는다. 12~18.5cm까지 자란다.", "url": "https://ko.wikipedia.org/wiki/%EA%B0%AF%EA%B0%80%EC%9E%AC", "lang": "ko", "sci": ""}, "longtail_sw": {"title": "Papilio macilentus", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/f/f7/Papilio_macilentus.JPG/500px-Papilio_macilentus.JPG", "extract": "Papilio macilentus, the long tailed spangle, is a butterfly of the family Papilionidae. The species was first described by Oliver Erichson Janson in 1877.", "url": "https://en.wikipedia.org/wiki/Papilio_macilentus", "lang": "en", "sci": "Species of butterfly"}, "large_copper": {"title": "Large copper", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/1/14/Lycaena_dispar02.jpg/500px-Lycaena_dispar02.jpg", "extract": "Large copper is a butterfly of the family Lycaenidae. Lycaena dispar is widely distributed across temperate Eurasia from western Europe to the Amur region, Korea and Manchuria. While it is currently in severe decline in north-western Europe, it is expanding in central, northern and eastern regions.", "url": "https://en.wikipedia.org/wiki/Large_copper", "lang": "en", "sci": "Species of butterfly"}, "bombardier": {"title": "폭탄먼지벌레", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/6/67/Pheropsophus_jessoensis_on_the_concrete-block_wall_-_2.jpg/500px-Pheropsophus_jessoensis_on_the_concrete-block_wall_-_2.jpg", "extract": "폭탄먼지벌레(Asian bombardier beetle)는 딱정벌레과에 속하는 종 중 하나이다. 일본에서는 miidera beetle로 불리며, 주로 한반도와 일본, 윈난성에 분포하고 있다. 복부 내의 특수한 화학 반응으로 꽁무늬에서 섭씨 100도 이상 고온의 방어 물질을 발사하는 것에 착안하여 '폭탄먼지벌레'라는 이름이 붙었다.", "url": "https://ko.wikipedia.org/wiki/%ED%8F%AD%ED%83%84%EB%A8%BC%EC%A7%80%EB%B2%8C%EB%A0%88", "lang": "ko", "sci": ""}, "blue_longhorn": {"title": "Agapanthia pilicornis", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/e/e7/Agapanthia_pilicornis.jpg/500px-Agapanthia_pilicornis.jpg", "extract": "Agapanthia pilicornis is a species of beetle in the family Cerambycidae. It was described by Johan Christian Fabricius in 1787.", "url": "https://en.wikipedia.org/wiki/Agapanthia_pilicornis", "lang": "en", "sci": "Species of beetle"}, "meadow_katydid": {"title": "Conocephalus", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/7/70/Conocephalus_dorsalis_burri.JPG/500px-Conocephalus_dorsalis_burri.JPG", "extract": "Conocephalus is a genus of bush crickets, known as coneheads, or alternatively lesser meadow katydids. It was described by Carl Peter Thunberg in 1815.", "url": "https://en.wikipedia.org/wiki/Conocephalus", "lang": "en", "sci": "Genus of cricket-like animals"}, "owl_moth": {"title": "Brahmaea certhia", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/5/58/%D0%91%D1%80%D0%B0%D0%BC%D0%B5%D1%8F_%D0%B4%D0%B0%D0%BB%D1%8C%D0%BD%D0%B5%D0%B2%D0%BE%D1%81%D1%82%D0%BE%D1%87%D0%BD%D0%B0%D1%8F.JPG/500px-%D0%91%D1%80%D0%B0%D0%BC%D0%B5%D1%8F_%D0%B4%D0%B0%D0%BB%D1%8C%D0%BD%D0%B5%D0%B2%D0%BE%D1%81%D1%82%D0%BE%D1%87%D0%BD%D0%B0%D1%8F.JPG", "extract": "Brahmaea certhia, the Sino-Korean owl moth, is a moth from the family Brahmaeidae, the Brahmin moths. It is found in the Korean Peninsula and China.", "url": "https://en.wikipedia.org/wiki/Brahmaea_certhia", "lang": "en", "sci": "Species of moth"}, "giant_horsefly": {"title": "Hokkaido Tabanus chrysurinus.jpg", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/9/9a/Hokkaido_Tabanus_chrysurinus.jpg/500px-Hokkaido_Tabanus_chrysurinus.jpg", "extract": "", "url": "https://commons.wikimedia.org/wiki/File:Hokkaido_Tabanus_chrysurinus.jpg", "lang": "commons", "sci": ""}, "wasp_spider": {"title": "긴호랑거미", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/c/ca/Argiope_bruennichi_08Oct10.jpg/500px-Argiope_bruennichi_08Oct10.jpg", "extract": "긴호랑거미는 호랑거미과의 거미이다. 호랑거미에 비해 몸이 가늘고 길다.", "url": "https://ko.wikipedia.org/wiki/%EA%B8%B4%ED%98%B8%EB%9E%91%EA%B1%B0%EB%AF%B8", "lang": "ko", "sci": ""}, "vampire_squid": {"title": "흡혈오징어", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/9/90/Vampire_des_abysses.jpg/500px-Vampire_des_abysses.jpg", "extract": "흡혈오징어(영어: Vampire squid, 학명: Vampyroteuthis infernalis)는 팔완상목의 두족류로 오징어뼈를 갖고 있지 않다. 일반적으로 뱀파이어 문어 혹은 박쥐문어 등으로 불리지만 국내 학계에서는 흡혈오징어라고 부른다. 흡혈오징어목에는 이 종류 하나뿐이다.", "url": "https://ko.wikipedia.org/wiki/%ED%9D%A1%ED%98%88%EC%98%A4%EC%A7%95%EC%96%B4", "lang": "ko", "sci": "뼈가 없는 팔완상목의 두족류"}, "firefly_squid": {"title": "Firefly squid", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/7/77/Watasenia_scintillans.jpg/500px-Watasenia_scintillans.jpg", "extract": "The firefly squid, also commonly known as the sparkling enope squid or hotaru-ika in Japan, is a species of squid in the family Enoploteuthidae. W. scintillans is the sole species in the monotypic genus Watasenia.", "url": "https://en.wikipedia.org/wiki/Firefly_squid", "lang": "en", "sci": "Species of cephalopod also known as the sparkling enope squid"}, "atolla": {"title": "Atolla", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/a/ac/Atolla_wyvillei_%28Operation_Deep_Scope_2004%29.jpg/500px-Atolla_wyvillei_%28Operation_Deep_Scope_2004%29.jpg", "extract": "Atolla is a genus of crown jellyfish in the order Coronatae. The genus Atolla was originally proposed by Haeckel in 1880 and elevated to the monotypic family level, as Atollidae by Henry Bigelow in 1913. The six known species inhabit the mesopelagic zone. The medusae possess multiple lobes called lappets at the bell margin. Medusae also have eight tentacles, alternating with eight rhopalia, and twice as many lappets occur as tentacles.", "url": "https://en.wikipedia.org/wiki/Atolla", "lang": "en", "sci": "Genus of jellyfishes"}, "krill": {"title": "크릴", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/e/e3/Meganyctiphanes_norvegica2.jpg/500px-Meganyctiphanes_norvegica2.jpg", "extract": "난바다곤쟁이(krill 크릴[*])는 난바다곤쟁이목(Euphausiacea)에 속하는 갑각류들의 통칭이다. 새우와 비슷하게 생긴 해양 무척추동물이지만 새우와 친족 관계인 동물은 아니다. 최대 5cm까지 자라며 이들은 고래, 펭귄, 일부 상어, 물범, 심지어 인간에게 중요한 식량원이다. 흰수염고래는 하루에 약 400만 마리나 되는 난바다곤쟁이를 먹는다. 거대한 떼를 지어 나타나기도 해 가끔 바다를 온통 붉게 물들인다. \"크릴\"이라는 말은 노르웨이어로 \"작은 물고기 치어\"라는 krill에서 유래했다.", "url": "https://ko.wikipedia.org/wiki/%ED%81%AC%EB%A6%B4", "lang": "ko", "sci": ""}, "giant_amphipod": {"title": "Alicella", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/3/3b/Alicella_gigantea_Japan_Trench_2022.jpg/500px-Alicella_gigantea_Japan_Trench_2022.jpg", "extract": "Alicella gigantea is a giant species of amphipod inhabiting the deep sea, which is sometimes referred to as the \"supergiant amphipod\"; these crustaceans may reach 34 cm (13 in) in length. The only species within the genus Alicella, the species is white in colour and is distinguished from closely related amphipods mainly by size, though subtle anatomical differences can be used for small specimens. They live at depths of around 4,850–7,000 m (15,910–22,970 ft), and their large body size is often presented as an example of abyssal gigantism. Genetic studies into the species have found that it has an exceptionally large genome, which may be linked to its large body size, though this trait's origins are still being investigated.", "url": "https://en.wikipedia.org/wiki/Alicella", "lang": "en", "sci": "Genus of giant crustaceans"}, "brittle_star": {"title": "거미불가사리", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/1/1a/Ophioplocus_japonicus.jpg/500px-Ophioplocus_japonicus.jpg", "extract": "거미불가사리는 거미불가사리과에 속하며 학명은 Ophioplocus japonicus이다. 체반(體盤)은 지름이 2cm 정도로 편평하고, 표면은 작은 비늘로 빽빽이 덮여 있다. 7cm 정도의 가늘고 긴 다섯 개의 다리가 여기에서 나와 있다. 다리는 암갈색 바탕에 흑갈색의 줄무늬가 있다. 체반의 배쪽 중앙에 입이 있고 입가에 이빨이 둘러 있는데, 일부 다섯 개가 안쪽을 향해 있으며 항문이 없어 찌꺼기를 입으로 배출한다. 배쪽에 많은 촉수로 된 관족(管足)이 있고 양측의 가시로 걷는다. 가시는 부러지기 쉬우나 재생력이 강하다. 위험에 닥치면 스스로 다리를 떼어버리고 잘려나간 자리에는 새 다리가 자란다. 입은 몸의 밑면 가운데 있는데 먹이를 먹을 때는 다리로 나른다. 입은 단지 자루 모양의 위(胃)에 들어가는 구멍일 뿐 특별한 구조는 없다. 거미불가사리는 불가사리와는 달리 다리에 소화기관이나 생식기관이 없으며 작은 동물을 먹는다. 암수딴몸으로 난생이며 오피오플루테우스유생을 거쳐 변태하여 성체가 된다. 바위 밑이나 산호 틈에서 살거나, 개펄과 모래에 굴을 파고 살기 때문에 눈에 잘 띄지 않는다.", "url": "https://ko.wikipedia.org/wiki/%EA%B1%B0%EB%AF%B8%EB%B6%88%EA%B0%80%EC%82%AC%EB%A6%AC", "lang": "ko", "sci": ""}, "bone_worm": {"title": "Osedax", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/1/12/Osedax_roseus.jpg/500px-Osedax_roseus.jpg", "extract": "Osedax is a genus of siboglinid polychaetes, commonly called snot worms, bone-eating worms, or zombie worms. Osedax is Latin for 'bone devourer', derived from the worms' unique ecological niche of bone-boring. Osedax settle on a bone, then secrete an acid through specialized root tissues to dissolve the bone's external layers in order to access the lipids within. Osedax act as ecosystem engineers, enhancing the biodiversity of bones they inhabit by increasing their structural complexity, allowing microfauna to inhabit otherwise inaccessible regions of the internal bone.", "url": "https://en.wikipedia.org/wiki/Osedax", "lang": "en", "sci": "Genus of annelid worms"}, "pot_worm": {"title": "Enchytraeidae", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/f/fa/Enchytraeus_albidus.jpg/500px-Enchytraeus_albidus.jpg", "extract": "Enchytraeidae is a family of microdrile oligochaetes. They resemble small earthworms and include both terrestrial species known as potworms that live in highly organic terrestrial environments, as well as some that are marine. More than 700 species in about 30 genera have been described worldwide, although the true diversity of the family is thought to be much higher. Most species are small, whitish or transparent worms only a few millimetres long that feed on decaying organic matter and the microorganisms colonizing it, making them important contributors to decomposition and nutrient cycling in soils. The peculiar genus Mesenchytraeus is known as \"ice worms\", as they spend the majority of their lives within glaciers, only rising to the surface at certain points in the summer. Enchytraeidae also includes the Grindal worm, which is commercially bred as aquarium fish food. Certain varieties of Enchytraeidae are partially responsible for the notorious \"dark earth\" archaeological layers in post-Roman Era British urban centers such as London.", "url": "https://en.wikipedia.org/wiki/Enchytraeidae", "lang": "en", "sci": "Family of annelids"}, "cutworm": {"title": "Cutworm", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/2/2a/Neil_Phillips_-_Large_Yellow_Underwing_caterpiller_%28by%29.jpg/500px-Neil_Phillips_-_Large_Yellow_Underwing_caterpiller_%28by%29.jpg", "extract": "Cutworms are moth larvae that hide under litter or soil during the day, coming out in the dark to feed on plants. A larva typically attacks the first part of the plant it encounters, namely the stem, often of a seedling, and consequently cuts it down, hence the name cutworm. Cutworms are not worms, biologically speaking, but caterpillars.", "url": "https://en.wikipedia.org/wiki/Cutworm", "lang": "en", "sci": "Type of moth larva"}, "horned_dung": {"title": "Copris ochus Motschulsky, 1860 male (4510276029).jpg", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/b/b4/Copris_ochus_Motschulsky%2C_1860_male_%284510276029%29.jpg/500px-Copris_ochus_Motschulsky%2C_1860_male_%284510276029%29.jpg", "extract": "", "url": "https://commons.wikimedia.org/wiki/File:Copris_ochus_Motschulsky,_1860_male_(4510276029).jpg", "lang": "commons", "sci": ""}, "velvet_mite": {"title": "털진드기과", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/1/19/Trombidium_holosericeum_2_Luc_Viatour.jpg/500px-Trombidium_holosericeum_2_Luc_Viatour.jpg", "extract": "털진드기과(Trombiculidae /trɒmbɨˈkjuːlɨdiː/[*])는 진드기아강 털진드기목에 딸린 과이다. 이 과에 속하는 버러지를 통틀어 털진드기(일본어: ツツガムシ 쯔쯔가무시[*])라고 한다.", "url": "https://ko.wikipedia.org/wiki/%ED%84%B8%EC%A7%84%EB%93%9C%EA%B8%B0%EA%B3%BC", "lang": "ko", "sci": ""}, "pseudoscorpion": {"title": "Pseudoscorpion", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/8/81/Neobisium_sylvaticum_03.jpg/500px-Neobisium_sylvaticum_03.jpg", "extract": "Pseudoscorpions, also known as false scorpions or book scorpions, are small, scorpion-like arachnids belonging to the order Pseudoscorpiones, also known as Pseudoscorpionida or Chelonethida.", "url": "https://en.wikipedia.org/wiki/Pseudoscorpion", "lang": "en", "sci": "Order of arachnids"}, "soil_centipede": {"title": "Geophilomorpha", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/7/77/Western_Yellow_Centipede.jpg/500px-Western_Yellow_Centipede.jpg", "extract": "Geophilomorpha is an order of centipedes commonly known as soil centipedes. The name \"Geophilomorpha\" comes from Ancient Greek γεω- (geo-), meaning \"earth\", φίλος (phílos), meaning \"lover\", and μορφή (morphḗ), meaning \"form\". This group is the most diverse centipede order, with 230 genera. These centipedes are found nearly worldwide but are absent in Antarctica and most Arctic regions.", "url": "https://en.wikipedia.org/wiki/Geophilomorpha", "lang": "en", "sci": "Order of centipedes"}, "harvestman": {"title": "통거미목", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/9/90/Opiliones_harvestman.jpg/500px-Opiliones_harvestman.jpg", "extract": "통거미목 또는 장님거미목은 거미강에 속하는 목이다. 2017년 4월을 기준으로 세계에서 6,650종이 넘는 종이 발견되었고, 현존하는 종의 수는 10,000종이 넘을 것으로 예상된다. 통거미목은 Cyphophthalmi, Eupnoi, Dyspnoi, Laniatores 그리고 2014년에 명명된 Tetrophthalmi, 총 5 개의 아목을 포함한다.", "url": "https://ko.wikipedia.org/wiki/%ED%86%B5%EA%B1%B0%EB%AF%B8%EB%AA%A9", "lang": "ko", "sci": ""}, "rove_beetle": {"title": "Rove beetle", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/8/87/Georgiy_Jacobson_-_Beetles_Russia_and_Western_Europe_-_plate_14.jpg/500px-Georgiy_Jacobson_-_Beetles_Russia_and_Western_Europe_-_plate_14.jpg", "extract": "The rove beetles are a family (Staphylinidae) of beetles, primarily distinguished by their short elytra that typically leave more than half of their abdominal segments exposed. With over 68,000 species in approximately 4,100 genera, the group is one of the largest families in the beetle order and one of the largest families of organisms. They form an ancient group that first appeared during the Middle Jurassic based on definitive records of fossilized rove beetles, with the Late Triassic taxon Leehermania more likely belonging to the Myxophaga. They are an ecologically and morphologically diverse group of beetles and commonly are encountered in terrestrial ecosystems.", "url": "https://en.wikipedia.org/wiki/Rove_beetle", "lang": "en", "sci": "Family of beetles"}, "bristletail": {"title": "Archaeognatha", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/4/45/Rock_bristletail.JPG/500px-Rock_bristletail.JPG", "extract": "The Archaeognatha are an order of apterygotes, commonly known as jumping bristletails or humpbacked bristletails. \"Bristletail\" is mostly used for these true (ectognathous) insects, but there is overlap with the entognathan two-pronged bristletails. Among extant insect taxa they are some of the most evolutionarily primitive; they appeared in the Middle Devonian period at about the same time as the arachnids. Specimens that closely resemble extant species have been found as both body and trace fossils in strata from the remainder of the Paleozoic Era and more recent periods. For historical reasons an alternative name for the order is Microcoryphia.", "url": "https://en.wikipedia.org/wiki/Archaeognatha", "lang": "en", "sci": "Order of wingless insects"}, "huntsman": {"title": "농발거미", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/2/27/Heteropoda_venatoria_01.jpg/500px-Heteropoda_venatoria_01.jpg", "extract": "농발거미는 한국과 일본, 중국, 미국 등지에 서식하는 농발거미과의 거미로, 몸 길이 2~3cm, 전체 길이 10cm가 넘는 큰 거미이며 이 경이로운 기록은 대부분 다리길이에서 나온다. 한국산으로는 초대형 거미로 배갑은 회갈색이고 뒷부분에 황색 띠무늬가 있고, 양쪽 가장자리에 황색의 줄무늬가 있다. 사람에게 피해를 주지 않으며 독성도 약하다.", "url": "https://ko.wikipedia.org/wiki/%EB%86%8D%EB%B0%9C%EA%B1%B0%EB%AF%B8", "lang": "ko", "sci": ""}, "pygmy_hopper": {"title": "Tetrigidae", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/c/cb/Tetrix.spec.2159.jpg/500px-Tetrix.spec.2159.jpg", "extract": "Tetrigidae is an ancient family in the order Orthoptera, which also includes similar families such as crickets, grasshoppers, and their allies. Species within the Tetrigidae are variously called groundhoppers, pygmy grasshoppers, pygmy devils or \"grouse locusts\".", "url": "https://en.wikipedia.org/wiki/Tetrigidae", "lang": "en", "sci": "Family of Caelifera"}, "field_roach": {"title": "Blattella nipponica on the leaf.jpg", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/f/f1/Blattella_nipponica_on_the_leaf.jpg/500px-Blattella_nipponica_on_the_leaf.jpg", "extract": "", "url": "https://commons.wikimedia.org/wiki/File:Blattella_nipponica_on_the_leaf.jpg", "lang": "commons", "sci": ""}, "potter_wasp": {"title": "호리병벌아과", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/c/c1/Orange_Potter_Wasp_%28Delta_bicinctus%29.jpg/500px-Orange_Potter_Wasp_%28Delta_bicinctus%29.jpg", "extract": "호리병벌아과는 말벌과의 하위 분류이다. 진흙으로 둥지를 만드는 벌들을 포함한다. 다 자란 어미는 진흙으로 호리병 모양의 둥지를 만들고, 애벌레의 먹이인 나방 애벌레를 잡아놓는다. 알에서 깨어난 애벌레는 어미가 잡아놓은 먹이를 먹고자란다.", "url": "https://ko.wikipedia.org/wiki/%ED%98%B8%EB%A6%AC%EB%B3%91%EB%B2%8C%EC%95%84%EA%B3%BC", "lang": "ko", "sci": ""}, "small_firefly": {"title": "Aquatica lateralis.jpg", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/e/e7/Aquatica_lateralis.jpg/500px-Aquatica_lateralis.jpg", "extract": "", "url": "https://commons.wikimedia.org/wiki/File:Aquatica_lateralis.jpg", "lang": "commons", "sci": ""}, "pond_snail": {"title": "Radix auricularia", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/2/2a/Radix_auricularia_auricularia_01.JPG/500px-Radix_auricularia_auricularia_01.JPG", "extract": "Radix auricularia, the big-ear radix, is a species of medium-sized freshwater snail, an aquatic pulmonate gastropod mollusk in the family Lymnaeidae.", "url": "https://en.wikipedia.org/wiki/Radix_auricularia", "lang": "en", "sci": "Species of gastropod"}, "dragon_nymph": {"title": "Brown hawker dragonfly (Aeshna grandis) dragonfly nymph late instar.JPG", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/7/79/Brown_hawker_dragonfly_%28Aeshna_grandis%29_dragonfly_nymph_late_instar.JPG/500px-Brown_hawker_dragonfly_%28Aeshna_grandis%29_dragonfly_nymph_late_instar.JPG", "extract": "", "url": "https://commons.wikimedia.org/wiki/File:Brown_hawker_dragonfly_(Aeshna_grandis)_dragonfly_nymph_late_instar.JPG", "lang": "commons", "sci": ""}, "inchworm": {"title": "Uid larva 08431.jpg", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/3/3f/Uid_larva_08431.jpg/500px-Uid_larva_08431.jpg", "extract": "", "url": "https://commons.wikimedia.org/wiki/File:Uid_larva_08431.jpg", "lang": "commons", "sci": ""}, "cucumber_beetle": {"title": "Aulacophora femoralis urihamusi01.JPG", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/3/3d/Aulacophora_femoralis_urihamusi01.JPG/500px-Aulacophora_femoralis_urihamusi01.JPG", "extract": "", "url": "https://commons.wikimedia.org/wiki/File:Aulacophora_femoralis_urihamusi01.JPG", "lang": "commons", "sci": ""}, "bagworm": {"title": "Bagworm Moth (Psychidae) Larva in Case - Guelph, Ontario 2020-05-27 (01).jpg", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/e/ec/Bagworm_Moth_%28Psychidae%29_Larva_in_Case_-_Guelph%2C_Ontario_2020-05-27_%2801%29.jpg/500px-Bagworm_Moth_%28Psychidae%29_Larva_in_Case_-_Guelph%2C_Ontario_2020-05-27_%2801%29.jpg", "extract": "", "url": "https://commons.wikimedia.org/wiki/File:Bagworm_Moth_(Psychidae)_Larva_in_Case_-_Guelph,_Ontario_2020-05-27_(01).jpg", "lang": "commons", "sci": ""}, "pelican_eel": {"title": "펠리칸장어", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/d/db/Eurypharynx_pelecanoides.jpg/500px-Eurypharynx_pelecanoides.jpg", "extract": "펠리칸장어(Eurypharynx pelecanoides)는 뱀장어목에 속하는 조기어류의 일종이다. 펠리칸장어과(Eurypharyngidae)와 펠리칸장어속(Eurypharynx)의 유일종이다. 대서양과 인도양, 태평양의 온대 및 열대 지역 등 전세계의 따뜻한 바다에 분포하며, 주로 수심 550~3,000m의 중층에서 사는 심해어류이다. 일본에서는 미야기현과 고치현 등의 태평양 쪽에서도 발견되지만, 오가사와라 제도 근해의 수심 1,200~1,400m 부근에서는 비교적 흔하게 발견된다. 해저에서 떨어진 중층을 덜 활발하게 활동한다. 유영성 심해어류의 일종이다. 먹이는 주로 갑각류와 같은 플랑크톤부터 작은 물고기와 두족류 등이다.", "url": "https://ko.wikipedia.org/wiki/%ED%8E%A0%EB%A6%AC%EC%B9%B8%EC%9E%A5%EC%96%B4", "lang": "ko", "sci": ""}, "bedbug": {"title": "빈대", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/b/b1/Cimex_lectularius.jpg/500px-Cimex_lectularius.jpg", "extract": "빈대(Cimex lectularius) 또는 베드버그(bedbug)는 유성생식하는 종이며 빈대과에 딸린 곤충이다. 몸길이는 5mm 안팎이고, 둥글납작한 모양이며 몸 빛은 붉은색을 띤 갈색이다. 몸이 작고, 편평한 타원형이어서 아주 좁은 틈에 숨을 수 있다. 앞날개는 매우 짧으며, 뒷날개는 퇴화하고 다리는 세 쌍, 온 몸에 짧은 털이 났다.", "url": "https://ko.wikipedia.org/wiki/%EB%B9%88%EB%8C%80", "lang": "ko", "sci": "빈대과 곤충"}, "clothes_moth": {"title": "Tineola bisselliella", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/b/b5/Tineola.bisselliella.7218.jpg/500px-Tineola.bisselliella.7218.jpg", "extract": "Tineola bisselliella, known as the common clothes moth, webbing clothes moth, or simply clothing moth, is a species of fungus moth. It is the type species of its genus Tineola and was first described by the Swedish entomologist Arvid David Hummel in 1823. It and several closely related species are together known as the clothes moths due to their role as pests in human households. The specific name is commonly misspelled biselliella – for example, by G. A. W. Herrich-Schäffer, when he established Tineola in 1853.", "url": "https://en.wikipedia.org/wiki/Tineola_bisselliella", "lang": "en", "sci": "Species of moth"}, "booklouse": {"title": "다듬이벌레", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/1/1e/Psocoptera.jpg/500px-Psocoptera.jpg", "extract": "다듬이벌레는 다듬이벌레목(Psocoptera)에 속하는 곤충의 총칭이다. 전 세계에 41개 과에 5,500여 종이 있고, 대한민국에는 12종이 알려져 있다.", "url": "https://ko.wikipedia.org/wiki/%EB%8B%A4%EB%93%AC%EC%9D%B4%EB%B2%8C%EB%A0%88", "lang": "ko", "sci": ""}, "rice_weevil": {"title": "Rice weevil", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/9/9c/Sitophilus.oryzae.7438.jpg/500px-Sitophilus.oryzae.7438.jpg", "extract": "The rice weevil is a stored product pest which attacks seeds of several crops, including wheat, rice, and maize.", "url": "https://en.wikipedia.org/wiki/Rice_weevil", "lang": "en", "sci": "Species of beetle"}, "cat_flea": {"title": "고양이 벼룩", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/9/9d/%D0%9A%D0%BE%D1%88%D0%B0%D1%87%D1%8C%D1%8F_%D0%B1%D0%BB%D0%BE%D1%85%D0%B0.jpg/500px-%D0%9A%D0%BE%D1%88%D0%B0%D1%87%D1%8C%D1%8F_%D0%B1%D0%BB%D0%BE%D1%85%D0%B0.jpg", "extract": "고양이 벼룩(Ctenocephalides felis)은 매우 흔한 기생 곤충으로 주 숙주는 고양이다. 널리 존재하는 개벼룩은 Ctenocephalides canis라고 한다. 고양이 벼룩은 아프리카에서 기원했지만, 지금은 전 세계적으로 발견된다. 인간이 고양이를 길들이기 시작하면서 고양이 벼룩의 유병률이 증가했고 전 세계로 퍼져나갔다.", "url": "https://ko.wikipedia.org/wiki/%EA%B3%A0%EC%96%91%EC%9D%B4_%EB%B2%BC%EB%A3%A9", "lang": "ko", "sci": ""}, "meal_moth": {"title": "화랑곡나방", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/5/50/Indianmeal_moth_2009.jpg/500px-Indianmeal_moth_2009.jpg", "extract": "화랑곡나방(학명: Plodia interpunctella, 영어: indian-meal moth, weevil moth, pantry moth, flour moth 또는 grain moth)은 나비목 명나방과에 속하는 곤충이다. 흔히 쌀나방으로 불리며, 쌀이나 밀 등 곡류 안에 알을 낳는다. 부화한 애벌레는 강한 이빨과 턱을 갖고 있어 봉지나 플라스틱까지 뚫고 들어가 곡류와 같은 음식물을 먹으므로 해충으로 불린다.", "url": "https://ko.wikipedia.org/wiki/%ED%99%94%EB%9E%91%EA%B3%A1%EB%82%98%EB%B0%A9", "lang": "ko", "sci": ""}, "dust_mite": {"title": "House dust mite", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/4/43/CSIRO_ScienceImage_11085_A_scanning_electron_micrograph_of_a_female_dust_mite.jpg/500px-CSIRO_ScienceImage_11085_A_scanning_electron_micrograph_of_a_female_dust_mite.jpg", "extract": "House dust mites are various species of acariform mites belonging to the family Pyroglyphidae that are found in association with dust in dwellings. They are known for causing allergies.", "url": "https://en.wikipedia.org/wiki/House_dust_mite", "lang": "en", "sci": "Common name for several species of mite"}, "horseshoe_bat": {"title": "관박쥐", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/0/0a/Grand_Rhinolophe.jpg/500px-Grand_Rhinolophe.jpg", "extract": "관박쥐(학명: Rhinolophus ferrumequinum)는 관박쥐과에 속하는 박쥐이다. 주름코박쥐라고도 불리는 이 박쥐는 유럽, 아프리카, 아시아, 오스트레일리아에 서식한다. 유럽에서는 멸종 위기에 처해 있지만 한반도에서는 흔히 볼 수 있다. 한국에는 내륙관박쥐(R. f. korai)와 제주관박쥐(R. f. quelpartis) 등 2아종이 있는 것으로 알려져 있지만, 1933년 모리(Mori)가 발표한 제주관박쥐는 그 이후 아직 채집 관찰된 바 없다.", "url": "https://ko.wikipedia.org/wiki/%EA%B4%80%EB%B0%95%EC%A5%90", "lang": "ko", "sci": ""}, "orange_bat": {"title": "붉은박쥐", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/8/80/Black-winged_Myotis_imported_from_iNaturalist_photo_6268974_on_26_January_2022.jpg/500px-Black-winged_Myotis_imported_from_iNaturalist_photo_6268974_on_26_January_2022.jpg", "extract": "붉은박쥐(학명: Myotis rufoniger, 문화어: 검은오렌지윗수염박쥐)는 애기박쥐과 윗수염박쥐속에 속하는 포유동물이다. ‘황금박쥐’, ‘오렌지윗수염박쥐’, ‘조복성박쥐’로도 불린다. 중국, 한반도, 일본의 쓰시마섬과 대만 등에 분포하여 산다.", "url": "https://ko.wikipedia.org/wiki/%EB%B6%89%EC%9D%80%EB%B0%95%EC%A5%90", "lang": "ko", "sci": "포유류 박쥐목 애기박쥐과에 속하는 동물"}, "cave_spider": {"title": "Meta menardi", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/5/5b/Meta_menardi.jpg/500px-Meta_menardi.jpg", "extract": "Meta menardi, the European cave spider, is a long-jawed orb-weaving spider. It is also known as the orbweaving cave spider and the cave orbweaver.", "url": "https://en.wikipedia.org/wiki/Meta_menardi", "lang": "en", "sci": "Species of spider"}, "cave_beetle": {"title": "Leptodirus", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/8/8d/Leptodirus_hochenwartii.jpg/500px-Leptodirus_hochenwartii.jpg", "extract": "Leptodirus is a cave beetle in the family Leiodidae. The genus contains only the single species Leptodirus hochenwartii. It is a true troglobite, endemic to Slovenian, Croatian and, partly, Italian caves.", "url": "https://en.wikipedia.org/wiki/Leptodirus", "lang": "en", "sci": "Genus of beetles"}, "cave_shrimp": {"title": "Troglocaris", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/b/b7/PMS_-_jamska_kozica_Troglocaris.jpg/500px-PMS_-_jamska_kozica_Troglocaris.jpg", "extract": "Troglocaris is a genus of freshwater shrimp in the family Atyidae. These stygobitic, whitish and eyeless shrimp are found in Southern Europe. Although locally very common, the small ranges of the individual species make them highly vulnerable to habitat loss, for example by water extraction. Their underground habitat is often extremely stable; for example, the Vipavska jama cave in Slovenia is home to a population of T. anophthalmus, and its water only varies from 10 °C (50 °F) in the winter to 11 °C (52 °F) in the summer. In some Dinaric caves, notably Vjetrenica, as many as three species may occur together.", "url": "https://en.wikipedia.org/wiki/Troglocaris", "lang": "en", "sci": "Genus of crustaceans"}, "cave_fish": {"title": "Mexican tetra", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/c/c0/Mexican_Tetra_%28Astyanax_mexicanus%29_%282687270083%29.jpg/500px-Mexican_Tetra_%28Astyanax_mexicanus%29_%282687270083%29.jpg", "extract": "The Mexican tetra, also known as the blind cave fish, blind cave characin or the blind cave tetra, is a species of freshwater ray-finned fish belonging to the family Acestrorhamphidae, the American characins. This fish is found in the lower Rio Grande, and the Nueces and Pecos Rivers in Texas, into the Central Plateau and eastern states of Mexico.", "url": "https://en.wikipedia.org/wiki/Mexican_tetra", "lang": "en", "sci": "Species of fish"}, "firefly_cave": {"title": "Arachnocampa luminosa", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/2/21/Arachnocampa_luminosa_290768813.jpg/500px-Arachnocampa_luminosa_290768813.jpg", "extract": "Arachnocampa luminosa, commonly known as New Zealand glowworm or simply glowworm, is a species of fungus gnat solely endemic to New Zealand. The larval stage and the imago produce a blue-green bioluminescence. The species is known to dwell in caves and on sheltered banks in the native bush where humidity is high, as moisture helps to maintain their silk structures that capture prey. Its Māori names are pūrātoke, from the verb \"to glow\", and titiwai, meaning \"lights reflected in water.\" This likely derives from the glowworms' presence near bodies of water, where their luminous displays are reflected.", "url": "https://en.wikipedia.org/wiki/Arachnocampa_luminosa", "lang": "en", "sci": "Species of fly"}, "cave_millipede": {"title": "Brachycybe", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/9/9f/Brachycybe_lecontii_%28Platydesmida%29_millipede_%283680001399%29.jpg/500px-Brachycybe_lecontii_%28Platydesmida%29_millipede_%283680001399%29.jpg", "extract": "Brachycybe (Greek for \"short head\") is a genus of social millipedes with species in the United States and East Asia. Species in this genus are often referred to as \"feather millipedes\" due to their shape.", "url": "https://en.wikipedia.org/wiki/Brachycybe", "lang": "en", "sci": "Genus of millipedes"}, "cave_springtail": {"title": "Springtail", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/9/99/Orchesella_cincta.jpg/500px-Orchesella_cincta.jpg", "extract": "Springtails form the largest of the three lineages of modern hexapods that are no longer considered insects, the others being Protura and Diplura. Although the three lineages are sometimes grouped together in a class called Entognatha because they have internal mouthparts, they do not appear to be any more closely related to one another than they are to insects, which have external mouthparts. There are more than 9,000 species worldwide.", "url": "https://en.wikipedia.org/wiki/Springtail", "lang": "en", "sci": "Class of arthropods"}, "cave_amphipod": {"title": "Niphargus", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/1/11/Niphargus_ictus.jpg/500px-Niphargus_ictus.jpg", "extract": "Niphargus is by far the largest genus of its family, the Niphargidae, and the largest of all freshwater amphipod genera.", "url": "https://en.wikipedia.org/wiki/Niphargus", "lang": "en", "sci": "Genus of crustaceans"}, "herald_moth": {"title": "Herald (moth)", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/2/2c/Scoliopteryx_libatrix01.jpg/500px-Scoliopteryx_libatrix01.jpg", "extract": "The herald is a moth of the family Erebidae. The species was first described by Carl Linnaeus in his 1758 10th edition of Systema Naturae.", "url": "https://en.wikipedia.org/wiki/Herald_(moth)", "lang": "en", "sci": "Species of moth"}, "cave_snail": {"title": "Zospeum", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/1/1c/Zospeum-spelaeum_04.jpg/500px-Zospeum-spelaeum_04.jpg", "extract": "Zospeum is a genus of air-breathing land snails, terrestrial pulmonate gastropod mollusks in the family Ellobiidae, the salt marsh snails.", "url": "https://en.wikipedia.org/wiki/Zospeum", "lang": "en", "sci": "Genus of gastropods"}, "olm": {"title": "동굴영원", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/f/f0/Proteus_anguinus_Postojnska_Jama_Slovenija.jpg/500px-Proteus_anguinus_Postojnska_Jama_Slovenija.jpg", "extract": "동굴도롱뇽 또는 동굴영원, 혹은 동굴도롱뇽붙이는 유럽에 서식하는 도롱뇽이다. 흔히 올름(olm)이라고 한다. 유럽 동남부 디나르알프스산맥(Dinaric Alps)의 카르스트 지대에서 발견된다.", "url": "https://ko.wikipedia.org/wiki/%EB%8F%99%EA%B5%B4%EC%98%81%EC%9B%90", "lang": "ko", "sci": "유럽에 서식하는 도롱뇽이다."}, "deathstalker": {"title": "데스스토커", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/0/08/Deathstalker_%28Leiurus_quinquestriatus%29_7.jpg/500px-Deathstalker_%28Leiurus_quinquestriatus%29_7.jpg", "extract": "데스스토커(deathstalker, 학명: Leiurus quinquestriatus 레이우루스 쿠인쿠에스트리아투스[*])는 전갈과에 속하는 전갈이다. 노란색에 몸길이 30~77mm(평균 58
