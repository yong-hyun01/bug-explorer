<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<title>곤충 탐험대</title>
<link rel="preconnect" href="https://upload.wikimedia.org" crossorigin>
<link rel="dns-prefetch" href="https://upload.wikimedia.org">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
:root{
  --sky:#BDE8FF; --grass:#7CC24A; --grass-2:#4E9A2E; --accent:#FF8A3D; --accent-2:#E0661C;
  --ink:#1F3A1A; --dim:#5E7A58; --cream:#FFF8E6; --line:#E5D9B8;
  --green:#4E9A2E; --red:#E53935; --blue:#3B82F6; --purple:#8B5CF6;
  --display:"Jua","Noto Sans KR",sans-serif; --body:"Noto Sans KR",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
img,canvas{-webkit-user-drag:none;user-drag:none;pointer-events:none}
.scene canvas,#pad img{pointer-events:auto}
html,body{margin:0;height:100%;overscroll-behavior:none;touch-action:manipulation}
body{background:#DCEFC7;color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;display:flex;justify-content:center;align-items:center;min-height:100dvh;background-image:radial-gradient(circle at 50% 20%,#F2FBE4 0,#DCEFC7 60%)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
img.px{image-rendering:pixelated}
.disp{font-family:var(--display);font-weight:400}
.phone{width:100%;max-width:430px;height:100dvh;max-height:900px;background:var(--cream);overflow:hidden;position:relative}
.scroller{height:100%;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;display:flex;flex-direction:column;scroll-behavior:smooth}
@media(min-width:480px) and (min-height:720px){.phone{height:min(900px,96dvh);border-radius:34px;border:1px solid #CFC2A0;box-shadow:0 40px 80px -30px rgba(40,60,20,.6),0 0 0 8px #F6EEDC}}

.hud{display:flex;justify-content:space-between;align-items:center;padding:12px 16px 8px;background:linear-gradient(180deg,#FFF3D6,var(--cream))}
.hud h1{font-family:var(--display);font-size:24px;margin:0;color:var(--ink);display:flex;align-items:center;gap:8px}
.hud h1 img{width:28px;height:28px}
.hud .prog{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px;color:var(--dim)}
.hud .bar{width:80px;height:10px;border-radius:5px;background:#E8DFC3;overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.15)}
.hud .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--grass),var(--grass-2));transition:width .4s}
.hud .snd{width:34px;height:34px;border-radius:50%;background:#FFF;box-shadow:0 2px 0 #D9CCA6;font-size:16px;display:grid;place-items:center}

.scene{position:relative;margin:0 12px;border-radius:18px;overflow:hidden;background:#000;aspect-ratio:10/9;max-height:50dvh;border:3px solid #FFF;box-shadow:0 8px 24px -8px rgba(0,0,0,.35);flex:none}
.scene canvas{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.scene .label{position:absolute;top:10px;left:12px;font-family:var(--display);font-size:20px;color:#FFF;text-shadow:0 2px 0 rgba(0,0,0,.35),0 0 10px rgba(0,0,0,.3);pointer-events:none}
.scene .label small{display:block;font-family:var(--body);font-size:12px;font-weight:700;opacity:.9}
.scene .daynight{position:absolute;top:10px;right:10px;padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.9);font-weight:900;font-size:13px;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.scene .hint{position:absolute;left:50%;bottom:34px;width:max-content;max-width:92%;white-space:normal;text-align:center;line-height:1.35;transform:translateX(-50%);background:rgba(255,255,255,.9);padding:5px 12px;border-radius:999px;font-size:12px;font-weight:700;color:var(--ink);pointer-events:none;transition:opacity 1s}
.scene .map{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);width:140px;height:14px;border-radius:7px;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.5);pointer-events:none}
.scene .map i{position:absolute;top:1px;bottom:1px;border-radius:6px;background:rgba(255,255,255,.65)}
.scene .map b{position:absolute;top:4px;width:5px;height:5px;border-radius:50%;background:#FFD54A;box-shadow:0 0 3px #000}
.pad{display:flex;justify-content:space-between;align-items:center;padding:28px 14px 10px;gap:12px;user-select:none;-webkit-user-select:none;touch-action:none}
.pad button{touch-action:none}
.dpad{display:grid;grid-template-columns:repeat(3,60px);grid-template-rows:repeat(2,52px);gap:8px}
.dpad button{background:#FFF;border:2px solid #E8DFC3;border-radius:14px;font-size:24px;font-weight:900;color:var(--ink);box-shadow:0 4px 0 #D9CCA6;touch-action:none}
.dpad button:active,.dpad button.on{transform:translateY(3px);box-shadow:0 1px 0 #D9CCA6;background:#FFF1E3;border-color:var(--accent)}
.dpad .l{grid-column:1;grid-row:1/3}.dpad .r{grid-column:3;grid-row:1/3}.dpad .u{grid-column:2;grid-row:1}.dpad .d{grid-column:2;grid-row:2}
.acts{display:flex;align-items:flex-end;gap:8px}
.jumpb{width:56px;height:56px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#9FE07A,#4E9A2E);color:#FFF;font-family:var(--display);font-size:14px;box-shadow:0 5px 0 #2E6B1E,0 8px 16px rgba(0,0,0,.2);border:3px solid #FFF;touch-action:none;display:grid;place-items:center;line-height:1}
.jumpb:active,.jumpb.on{transform:translateY(4px);box-shadow:0 1px 0 #2E6B1E}
.jumpb[hidden]{display:none}
.catch{width:80px;height:80px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#FFB070,var(--accent));color:#FFF;font-family:var(--display);font-size:18px;box-shadow:0 6px 0 var(--accent-2),0 10px 20px rgba(0,0,0,.25);border:3px solid #FFF;touch-action:none;display:grid;place-items:center;line-height:1}
.catch small{font-family:var(--body);font-size:10px;font-weight:700;opacity:.9}
.catch:active,.catch.on{transform:translateY(5px);box-shadow:0 1px 0 var(--accent-2)}
.places{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;padding:8px 12px 4px}
.place{padding:5px 1px;font-size:12px;border-radius:14px;background:#FFF;border:2px solid #E8DFC3;font-weight:900;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 3px 0 #D9CCA6}
.place img{width:26px;height:26px}
.place.on{border-color:var(--accent);background:#FFF1E3;transform:translateY(-2px);box-shadow:0 5px 0 var(--accent-2)}
.place:active{transform:translateY(2px);box-shadow:0 1px 0 #D9CCA6}
.place small{font-size:11px;color:var(--dim);font-weight:700}

.tabs{display:flex;gap:8px;padding:10px 12px 0;position:sticky;top:0;z-index:5;background:var(--cream)}
.tabs::before{content:"";position:absolute;left:50%;top:3px;width:40px;height:4px;border-radius:2px;background:#D9CCA6;transform:translateX(-50%)}
.tab{flex:1;padding:10px 0 8px;border-radius:16px 16px 0 0;background:#EFE6CB;color:var(--dim);font-family:var(--display);font-size:17px;display:flex;align-items:center;justify-content:center;gap:6px;border:2px solid #E5D9B8;border-bottom:0}
.tab img{width:22px;height:22px}
.tab.on{background:#FFF;color:var(--ink);border-color:#D9CCA6;transform:translateY(2px)}
.sheet{flex:none;min-height:calc(var(--ph,100dvh) - 64px);margin:0 12px 12px;background:#FFF;border:2px solid #D9CCA6;border-top:0;border-radius:0 0 18px 18px;padding:12px}
.view[hidden]{display:none}
.recent h4,.dex h4{margin:0 0 8px;font-family:var(--display);font-size:16px;color:var(--dim);font-weight:400;display:flex;justify-content:space-between;align-items:center}
.strip{display:flex;flex-wrap:wrap;gap:8px;padding-bottom:4px}
.strip .mini{flex:none;width:calc((100% - 32px) / 5);text-align:center;font-size:11px;font-weight:700}
.strip .mini .b{width:100%;aspect-ratio:1;border-radius:14px;background:var(--cream);border:2px solid var(--line);display:grid;place-items:center}
.strip .mini img{width:80%;height:80%}
.strip .mini .b.photo{overflow:hidden}
.strip .mini .b.photo img{width:100%;height:100%;object-fit:cover;border-radius:12px}
.empty{color:var(--dim);font-size:13px;text-align:center;padding:18px 0;font-weight:700}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{padding:5px 11px;border-radius:999px;background:#F2EBD6;font-size:12px;font-weight:900;color:var(--dim);border:2px solid transparent}
.chip.on{background:#FFF1E3;color:var(--accent-2);border-color:var(--accent)}
.dexHead{display:flex;justify-content:space-between;align-items:center;gap:8px;position:sticky;top:50px;z-index:4;background:#FFF;margin:-12px -12px 6px;padding:10px 12px 8px;border-bottom:1px solid #EFE6CB}
.dexHead h4{margin:0}
.dexHead h4 span{font-family:var(--body);font-size:12px;font-weight:700;margin-left:6px}
.resetBtn{flex:none;padding:6px 12px;border-radius:999px;background:#FFF;border:2px solid #E6DCC0;color:var(--dim);font-size:12px;font-weight:900}
.resetBtn:active{background:#FFF1E3}
.modal .confirm{text-align:center;padding:6px 2px}
.modal .confirm .big{font-size:44px;line-height:1;margin-bottom:6px}
.modal .confirm h3{margin:0 0 6px;font-family:var(--display);font-size:20px;color:var(--ink);font-weight:400}
.modal .confirm p{margin:0 0 10px;font-size:13px;color:var(--dim);font-weight:700;line-height:1.5}
.modal .row2{display:flex;gap:8px}
.modal .row2 .close{margin-top:0;width:auto;flex:1 1 0;min-width:0}
.modal .close.ghost{background:#F2EBD6;color:var(--dim);box-shadow:0 4px 0 #D8CEB0}
.modal .close.danger{background:var(--red);box-shadow:0 4px 0 #9A2A26}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.card{position:relative;background:var(--cream);border:2px solid var(--line);border-radius:16px;padding:8px 4px 6px;text-align:center;box-shadow:0 3px 0 #E8DFC3;transition:transform .05s}
.card:active{transform:translateY(2px);box-shadow:0 1px 0 #E8DFC3}
.card img{width:64px;height:64px}
.card .pw{position:relative;width:100%;aspect-ratio:1;border-radius:12px;overflow:hidden;background:#EFE6CB}
.card .pw img.ph{width:100%;height:100%;object-fit:cover;display:block}
.card .pw .mini{position:absolute;right:3px;bottom:3px;width:26px;height:26px;border-radius:7px;background:rgba(255,248,230,.92);border:1.5px solid #fff;display:grid;place-items:center}
.card .pw .mini img{width:22px;height:22px}
.card .nm{font-weight:900;font-size:12px;margin-top:2px;line-height:1.2}
.card.unknown img{filter:brightness(0) opacity(.22)}
.card.unknown .nm{color:#B5AA8E}
.card .cnt{position:absolute;top:4px;right:4px;z-index:3;background:var(--accent);color:#FFF;font-size:11px;font-weight:900;border-radius:999px;padding:2px 7px;border:2px solid #FFF;box-shadow:0 2px 4px rgba(0,0,0,.35);line-height:1.2}
.card .rare{position:absolute;top:4px;left:5px;z-index:3;font-size:13px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5))}
.card.new::after{content:"NEW";position:absolute;bottom:6px;right:6px;z-index:3;background:var(--red);color:#FFF;font-size:9px;font-weight:900;border-radius:6px;padding:1px 5px}

.modal{position:absolute;inset:0;z-index:20;display:grid;place-items:center;background:rgba(31,58,26,.55);padding:12px}
.modal[hidden]{display:none}
.modal .box{width:100%;max-width:360px;max-height:96%;display:flex;flex-direction:column;overflow:hidden;background:#FFF;border-radius:20px;padding:12px 14px 12px;box-shadow:0 30px 60px -20px rgba(0,0,0,.6);animation:pop .35s cubic-bezier(.2,1.4,.4,1);position:relative}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.modal .badge{display:inline-block;align-self:flex-start;background:var(--red);color:#FFF;font-family:var(--display);font-size:14px;padding:3px 12px;border-radius:999px;margin-bottom:4px;animation:wiggle .6s ease-in-out 2}
.modal .badge.again{background:var(--blue)}
@keyframes wiggle{25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
.modal .mbody{flex:1 1 auto;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch}
.modal .hero{display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,#FFF8E6,#F2EBD6);border-radius:16px;padding:6px;margin-bottom:6px;position:relative;overflow:hidden;min-height:90px}
.modal .hero.photo{padding:0;background:#1F3A1A}
.modal .hero.photo img.ph{width:100%;height:clamp(140px,28dvh,220px);object-fit:cover;display:block;animation:none;filter:none}
.modal .hero .inset{position:absolute;right:8px;bottom:8px;width:56px;height:56px;border-radius:12px;background:rgba(255,248,230,.92);border:2px solid #fff;display:grid;place-items:center;box-shadow:0 4px 10px rgba(0,0,0,.3)}
.modal .hero .inset img{width:46px;height:46px;animation:none;filter:none}
.modal .credit{font-size:10px;color:var(--dim);text-align:right;margin:-2px 0 4px}
.modal .credit a{color:var(--dim)}
.modal .sci{font-family:var(--body);font-size:12px;font-weight:500;color:var(--dim);font-style:italic}
.modal details{margin-top:6px;background:var(--cream);border-radius:12px;padding:6px 10px}
.modal details summary{font-weight:900;font-size:13px;color:var(--accent-2);cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center}
.modal details summary::after{content:"▼";font-size:10px}
.modal details[open] summary::after{content:"▲"}
.modal details p{margin:6px 0 2px;font-size:12.5px;line-height:1.5;color:var(--ink)}
.modal details .more{font-size:11px;font-weight:700}
.modal .hero img{height:clamp(90px,20dvh,150px);width:auto;max-height:100%;filter:drop-shadow(0 8px 6px rgba(0,0,0,.25));animation:bob 2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.modal h2{font-family:var(--display);font-size:22px;margin:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap;line-height:1.2}
.modal h2 .grp{font-family:var(--body);font-size:12px;font-weight:900;color:#FFF;background:var(--green);padding:3px 9px;border-radius:999px}
.modal h2 .grp.not{background:var(--purple)}
.modal .rows{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin:6px 0}
.modal .r{display:flex;flex-direction:column;gap:1px;font-size:12px;line-height:1.3;background:var(--cream);border-radius:10px;padding:5px 9px}
.modal .r.wide{grid-column:1/-1}
.modal .r b{color:var(--accent-2);font-weight:900;font-size:11px}
.modal .fact{background:#FFF1E3;border:2px dashed var(--accent);border-radius:12px;padding:7px 10px;font-size:12.5px;font-weight:700;line-height:1.4;overflow:auto;min-height:0}
.modal .fact::before{content:"💡 알고 있나요? ";color:var(--accent-2)}
.modal .close{flex:none;width:100%;margin-top:8px;padding:11px;border-radius:12px;background:var(--accent);color:#FFF;font-family:var(--display);font-size:17px;box-shadow:0 4px 0 var(--accent-2)}
.modal .close:active{transform:translateY(3px);box-shadow:0 1px 0 var(--accent-2)}
.modal .cnt{font-size:11px;color:var(--dim);font-weight:700;text-align:right;margin-top:4px}
.toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:#FFF;border:2px solid var(--accent);color:var(--ink);padding:8px 16px;border-radius:999px;font-weight:900;font-size:14px;z-index:9;box-shadow:0 8px 20px -8px rgba(0,0,0,.4);animation:tin .3s;white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis}
.toast[hidden]{display:none}
@keyframes tin{from{transform:translate(-50%,-12px);opacity:0}}
.confetti{position:absolute;inset:0;pointer-events:none;z-index:25}
/* ---- 가로 모드 (태블릿·스마트폰 눕혔을 때): 왼쪽 탐험+키패드, 오른쪽 맵·도감 ---- */
.side{display:contents}
@media (orientation: landscape) and (min-width: 560px) {
  body{align-items:stretch}
  .phone{max-width:none;max-height:none;height:100dvh;border-radius:0;border:0;box-shadow:none}
  .scroller{--sc:min(calc((100dvh - 178px) / .9),calc(100vw - 340px),760px);display:grid;grid-template-columns:calc(var(--sc) + 12px) minmax(280px,520px);grid-template-rows:auto 1fr auto;grid-template-areas:"hud hud" "scene side" "pad side";column-gap:12px;justify-content:center;overflow:hidden;scroll-behavior:auto}
  .hud{grid-area:hud;padding:8px 16px 4px;max-width:1120px;width:100%;justify-self:center}
  .scene{grid-area:scene;width:var(--sc);height:calc(var(--sc) * .9);aspect-ratio:auto;max-height:none;margin:0 0 0 12px;justify-self:start}
  .pad{grid-area:pad;align-self:start;padding:22px 12px 10px;margin-left:12px;justify-content:space-between}
  .side{display:flex;flex-direction:column;grid-area:side;min-height:0;overflow:auto;padding-right:12px;overscroll-behavior:contain}
  .places{padding:0 0 4px;grid-template-columns:repeat(5,1fr)}
  .place{padding:4px 2px;font-size:12px}.place img{width:22px;height:22px}.place small{font-size:10px}
  .tabs{padding:8px 0 0}
  .sheet{min-height:0;flex:1 1 auto;margin:0 0 10px}
  .scene .map{width:110px}
  .modal .box{max-width:560px}
  .modal .hero.photo img.ph{height:clamp(120px,32dvh,220px)}
}
@media (orientation: landscape) and (min-width: 560px) and (max-height: 520px) {
  /* 스마트폰 가로: 탐험 화면을 세로로 꽉 채우고 키패드는 오른쪽 아래에 */
  .scroller{--sc:min(calc((100dvh - 62px) / .9),calc(100vw - 340px));grid-template-rows:auto 1fr;grid-template-areas:"hud hud" "scene side"}
  .pad{grid-area:side;align-self:end;z-index:3;margin:0;padding:6px 10px 8px;background:linear-gradient(180deg,rgba(255,248,230,0),var(--cream) 30%)}
  .side{padding-bottom:110px}
  .dpad{grid-template-columns:repeat(3,50px);grid-template-rows:repeat(2,42px);gap:6px}
  .catch{width:62px;height:62px;font-size:15px}.jumpb{width:46px;height:46px;font-size:12px}
  .hud{padding:6px 14px 2px}.hud h1{font-size:18px}
  .scene .hint{font-size:11px;line-height:1.3}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="phone" id="phone">
 <div class="scroller" id="scroller">
  <div class="hud">
    <h1 class="disp"><img class="px" id="logo" alt="">곤충 탐험대</h1>
    <div class="prog"><span id="progText">0/0</span><span class="bar"><i id="progBar" style="width:0%"></i></span><button class="snd" id="sndBtn" title="소리">🔊</button></div>
  </div>
  <div class="scene" id="scene">
    <canvas id="cv"></canvas>
    <div class="label"><span id="placeName">풀밭</span><small id="placeHint"></small></div>
    <button class="daynight" id="dayBtn">☀️ 낮</button>
    <div class="hint" id="hint">키패드를 짧게 톡톡 눌러 살금살금 다가간 뒤 잡기 버튼! 오래 달리면 도망가요</div>
    <div class="map" id="map"><i id="mapView"></i></div>
  </div>
  <div class="pad" id="pad">
    <div class="dpad"><button class="l" data-k="l">◀</button><button class="u" data-k="u" id="btnU">▲</button><button class="d" data-k="d" id="btnD">▼</button><button class="r" data-k="r">▶</button></div>
    <div class="acts"><button class="jumpb" data-k="j" id="btnJ">점프</button><button class="catch" data-k="a" id="btnA">잡기<small>휘두르기</small></button></div>
  </div>
  <div class="side" id="side">
  <div class="places" id="places"></div>
  <div class="tabs">
    <button class="tab on" data-v="ex"><img class="px" alt="" data-ico="net">탐험</button>
    <button class="tab" data-v="dex"><img class="px" alt="" data-ico="book">도감</button>
  </div>
  <div class="sheet">
    <div class="view recent" id="v-ex">
      <h4>방금 잡은 곤충 <span id="todayCnt" style="font-family:var(--body);font-size:12px;font-weight:700"></span></h4>
      <div class="strip" id="strip"></div>
      <div class="empty" id="stripEmpty">아직 잡은 곤충이 없어요. 키패드로 다가가서 잡아 보세요!</div>
    </div>
    <div class="view dex" id="v-dex" hidden>
      <div class="dexHead"><h4>곤충 도감 <span id="dexCnt"></span></h4><button class="resetBtn" id="resetBtn">🗑️ 초기화</button></div>
      <div class="filters" id="filters"></div>

const PHOTOS = {"ladybug": {"title": "칠성무당벌레", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/d/de/BIEDRONA.JPG/500px-BIEDRONA.JPG", "extract": "칠성무당벌레(Coccinella septempunctata)는 주변에서 볼 수 있는 가장 흔한 무당벌레이다. 딱지날개는 붉은색이고 양쪽에 각각 점이 3개, 날개의 경계 부분에 겹치는 것 1개로 7개의 점이 있다. 학명은 \"점이 7개인 무당벌레\"라는 뜻이다(septem = \"seven\", punctus = \"spot\").", "url": "https://ko.wikipedia.org/wiki/%EC%B9%A0%EC%84%B1%EB%AC%B4%EB%8B%B9%EB%B2%8C%EB%A0%88", "lang": "ko", "sci": ""}, "ladybug2": {"title": "Propylea japonica", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/7/74/Propylea_japonica.JPG/500px-Propylea_japonica.JPG", "extract": "Propylea japonica is a species of beetle of the family Coccinellidae. It is found in Vietnam, Laos, China, Japan, Korea and possibly north-eastern India.", "url": "https://en.wikipedia.org/wiki/Propylea_japonica", "lang": "en", "sci": "Species of beetle"}, "ladybug28": {"title": "Henosepilachna vigintioctopunctata", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/9/99/Henosepilachna_vigintioctopunctata.jpg/500px-Henosepilachna_vigintioctopunctata.jpg", "extract": "Henosepilachna vigintioctopunctata is a species of beetle in the family Coccinellidae. It is commonly known as the 28-spotted potato ladybird or the Hadda beetle. It feeds on the foliage of potatoes and other solanaceous crops. It was previously called Epilachna vigintioctopunctata and is a cryptic species complex. It is very often confused with a closely related species, Henosepilachna vigintioctomaculata, which occurs in Russia, China, Japan, and Korea, and is given the same \"common name\".", "url": "https://en.wikipedia.org/wiki/Henosepilachna_vigintioctopunctata", "lang": "en", "sci": "Species of beetle"}, "rhino": {"title": "장수풍뎅이", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/6/66/Kabutomushi-JapaneseBeetle-July2004.jpg/500px-Kabutomushi-JapaneseBeetle-July2004.jpg", "extract": "장수풍뎅이(Allomyrina dichotoma, 영어: Japanese rhinoceros beetle)는 장수풍뎅이아과의 곤충이다. 뿔의 생김새가 투구를 쓰고 있는 장수의 모습과 비슷하며 한국에서 가장 크고 힘센 풍뎅이라는 뜻으로 이런 이름이 붙었다.", "url": "https://ko.wikipedia.org/wiki/%EC%9E%A5%EC%88%98%ED%92%8D%EB%8E%85%EC%9D%B4", "lang": "ko", "sci": ""}, "rhino_f": {"title": "Allomyrina dichotoma female.JPG", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/9/94/Allomyrina_dichotoma_female.JPG/500px-Allomyrina_dichotoma_female.JPG", "extract": "", "url": "https://commons.wikimedia.org/wiki/File:Allomyrina_dichotoma_female.JPG", "lang": "commons", "sci": ""}, "stag": {"title": "넓적사슴벌레", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/1/11/Kokuwa-kun_and_daihirata-kun.jpg/500px-Kokuwa-kun_and_daihirata-kun.jpg", "extract": "넓적사슴벌레는 사슴벌레과에 속하는 곤충이다. 한국산 사슴벌레 중에서도 가장 큰 종에 속한다. 큰턱을 포함한 몸 길이는 38~85mm(수컷), 28~44mm(암컷)이고 수명은 대략 1~2년이다. 4~9월에 나타나 참나무류의 수액을 먹고 살며, 유충은 썩은 참나무와 부엽토를 먹으며 자란다. 전국적으로 분포한다. 옛날에는 집게벌레라고 부르기도 하였다.서울시 보호 야생 생물 대상종이다.", "url": "https://ko.wikipedia.org/wiki/%EB%84%93%EC%A0%81%EC%82%AC%EC%8A%B4%EB%B2%8C%EB%A0%88", "lang": "ko", "sci": ""}, "stag_saw": {"title": "톱사슴벌레", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/f/fc/Nokogirikuwagata.JPG/500px-Nokogirikuwagata.JPG", "extract": "톱사슴벌레는 사슴벌레아과의 톱사슴벌레속에 속하는 곤충이다.몸 길이는 22~70(수), 23~35mm(암)이다. 한국, 중국, 대만, 일본에 분포한다. 전국적으로 분포하며, 졸참나무나 신갈나무 떡갈나무 숲에서 발견된다. 대형 수컷의 큰턱은 매우 크고 아래쪽으로 굽었으나 단지 개체는 짧고 똑바르며 내치가 많아 톱날 모양으로 대형 개체와 많은 차이가 있다. 가을에 번데기가 어른벌레로 변한 후 이듬해 5∼6월까지 번데기방에서 겨울을 보내고 밖으로 나와 생활하다가 3~4개월 후에 죽기 때문에 다른 사슴벌레에 비해 수명은 짧은 편이다. 몸은 적갈색 또는 검은갈색이다. 성충은 주로 7월에 우화하고 밤에 등불에도 날아든다.", "url": "https://ko.wikipedia.org/wiki/%ED%86%B1%EC%82%AC%EC%8A%B4%EB%B2%8C%EB%A0%88", "lang": "ko", "sci": ""}, "stag_king": {"title": "왕사슴벌레", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/3/3f/Dhb.JPG/500px-Dhb.JPG", "extract": "왕사슴벌레(Dorcus hopei)는 한국, 중국, 일본에 서식하는 사슴벌레과의 곤충이다. 몸길이는 수컷이 27~53mm이고 암컷이 25~40mm이며 큰턱 길이는 수컷 4-20mm, 암컷 5-7mm이다. 수컷의 큰턱은 모양이 둥글고 안쪽으로 휘어지며, 안에는 내치라고 불리는 큰 돌기가 2개 나 있다. 암컷은 딱지날개에 세로 홈줄이 두드러져 유사종들과 구별된다. 5~8월에 산지의 숲에서 생활한다. 성충의 먹이는 참나무류의 수액이며, 유충은 썩은 참나무를 파먹으며 자란다. 주로 밤에 활동하며 불빛에 모인다. 평균수명이 3~4년 정도로 한국산 사슴벌레 종류 중에서 가장 오래 사는 편이다. 종 보호 차원에서 국외로 반출이 법으로 금지된 종이다.", "url": "https://ko.wikipedia.org/wiki/%EC%99%95%EC%82%AC%EC%8A%B4%EB%B2%8C%EB%A0%88", "lang": "ko", "sci": ""}, "stag_f": {"title": "Female stag beetle on the ground.jpg", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/3/3b/Female_stag_beetle_on_the_ground.jpg/500px-Female_stag_beetle_on_the_ground.jpg", "extract": "", "url": "https://commons.wikimedia.org/wiki/File:Female_stag_beetle_on_the_ground.jpg", "lang": "commons", "sci": ""}, "longhorn": {"title": "알락하늘소", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/2/22/Anoplophora_malasiaca.jpg/500px-Anoplophora_malasiaca.jpg", "extract": "알락하늘소 는 대한민국, 중국, 일본, 대만 및 동남아시아가 원산인 하늘소로 심각 해충이다. 이탈리아, 스위스, 튀르키예, 프랑스, 독일, 크로아티아에 생태교란종으로 유입해 있다.", "url": "https://ko.wikipedia.org/wiki/%EC%95%8C%EB%9D%BD%ED%95%98%EB%8A%98%EC%86%8C", "lang": "ko", "sci": "하늘소의 일종"}, "longhorn2": {"title": "Apriona germari", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/2/28/Apriona_germari_%2814038895783%29.jpg/500px-Apriona_germari_%2814038895783%29.jpg", "extract": "Apriona germari is a species of beetle in the subfamily Lamiinae, found in India, through Southeast Asia, to southern China. It is mostly yellow in colour.", "url": "https://en.wikipedia.org/wiki/Apriona_germari", "lang": "en", "sci": "Species of beetle"}, "scarab": {"title": "풍뎅이", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/f/f0/Wn4su5zdra451.jpg/500px-Wn4su5zdra451.jpg", "extract": "풍뎅이(라틴어: Mimela splendens)는 동북아시아에 분포하는 풍뎅이과 풍뎅이속의 곤충이다.", "url": "https://ko.wikipedia.org/wiki/%ED%92%8D%EB%8E%85%EC%9D%B4", "lang": "ko", "sci": ""}, "scarab_gold": {"title": "왕풍뎅이", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/d/d8/Melolontha_incana.jpg/500px-Melolontha_incana.jpg", "extract": "왕풍뎅이(Melolontha incana)는 검정풍뎅이과 왕풍뎅이속의 곤충이다.", "url": "https://ko.wikipedia.org/wiki/%EC%99%95%ED%92%8D%EB%8E%85%EC%9D%B4", "lang": "ko", "sci": ""}, "flower_chafer": {"title": "흰점박이꽃무지", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/7/7f/Protaetia_brevitarsis_brevitarsis_Lewis%2C_1879_%283019456898%29.jpg/500px-Protaetia_brevitarsis_brevitarsis_Lewis%2C_1879_%283019456898%29.jpg", "extract": "흰점박이꽃무지는 풍뎅이과 꽃무지의 일종이다. 약간 편평하며 딱딱한 인상을 주는 풍뎅이의 일종인데 공중에서 잘 날기 때문에 눈에 잘 띈다. 앞날개를 펼치지 않고 나는데 그 육중한 소리는 말벌과 같으며, 점박이꽃무지와 비슷하게 생겼다. 꽃에 모여들기도 하고, 나무의 수액에 모여들기도 한다. 몸 길이는 17~22mm다. 체색은 구릿빛 검은색이며 광택이 있다. 앞가슴등판과 딱지날개에는 불규칙한 흰색 내지 황백색 무늬들이 있고 곰보처럼 파인 홈이 많다. 애벌레를 굼벵이라고도 하여, 약재로 사용한다. 성충은 늦봄부터 가을까지 볼 수 있다. 한반도 전역에서 볼 수 있다. 시베리아 동부, 일본(대마도)에도 분포한다.", "url": "https://ko.wikipedia.org/wiki/%ED%9D%B0%EC%A0%90%EB%B0%95%EC%9D%B4%EA%BD%83%EB%AC%B4%EC%A7%80", "lang": "ko", "sci": ""}, "dung": {"title": "소똥구리", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/d/d5/Gymnopleurus_mopsus.jpg/500px-Gymnopleurus_mopsus.jpg", "extract": "소똥구리는 딱정벌레목 소똥구리아과의 곤충으로, 한국, 중국, 몽골 등에 서식한다. 한국에서는 1993년 특정야생동·식물 지정되어 보호받아 왔으며, 관련 법의 개정에 따라 2017년 멸종위기 야생생물 Ⅱ급으로 지정되어 보호받고 있다. 국내에서 마지막으로 소똥구리가 발견된 것은 1971년으로, 학계에서는 40년 넘게 발견되지 않아 사실상 지역 절멸된 것으로 간주하고 있다. 양평군은 지역 생태에 가장 적합한 복원 종으로 소똥구리를 선정하고 소똥구리가 비교적 많이 남아 있는 몽골 관련 기관 및 연구진과 복원 문제를 논의해왔으며 몽골산 소똥구리를 들여와 다양한 서식환경과 생존조건으로 나누어 복원 연구를 시작할 계획이다.", "url": "https://ko.wikipedia.org/wiki/%EC%86%8C%EB%98%A5%EA%B5%AC%EB%A6%AC", "lang": "ko", "sci": ""}, "tiger_beetle": {"title": "길앞잡이", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/0/09/Cicindela_chinensis_flammifera_MHNT.ZOO.2004.0.175.jpg/500px-Cicindela_chinensis_flammifera_MHNT.ZOO.2004.0.175.jpg", "extract": "길앞잡이(학명: Cicindela chinensis)는 길앞잡이속의 곤충이다. 몸 길이는 대략 2cm이며, 날카로운 턱으로 자기보다 작은 곤충을 잡아먹는다. 또한, 길앞잡이는 녹색, 적색, 청색 등이 섞인 색을 하고 있는데, 이것은 일종의 경고색의 역할을 한다. 과거에는 비단길앞잡이라고 불렀다. 길앞잡이는 2년살이 곤충으로서, 첫 해에는 애벌레로, 둘째 해에는 어른벌레로 겨울나기를 한다.", "url": "https://ko.wikipedia.org/wiki/%EA%B8%B8%EC%95%9E%EC%9E%A1%EC%9D%B4", "lang": "ko", "sci": "곤충의 종"}, "jewel": {"title": "Chrysochroa fulgidissima", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/c/cc/Chrysochroa_Fulgidissima_%28Tamamushi%29_In_Hand.PNG/500px-Chrysochroa_Fulgidissima_%28Tamamushi%29_In_Hand.PNG", "extract": "Chrysochroa fulgidissima, \"jewel beetle\" or Yamato tamamushi in Japanese (ヤマトタマムシ) is a metallic woodboring beetle of the family Buprestidae.", "url": "https://en.wikipedia.org/wiki/Chrysochroa_fulgidissima", "lang": "en", "sci": "Species of beetle"}, "divingbeetle": {"title": "물방개", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/c/cc/%E9%A3%BC%E8%82%B2%E4%B8%8B%E3%81%A7%E3%81%AE%E3%82%B2%E3%83%B3%E3%82%B4%E3%83%AD%E3%82%A6.JPG/500px-%E9%A3%BC%E8%82%B2%E4%B8%8B%E3%81%A7%E3%81%AE%E3%82%B2%E3%83%B3%E3%82%B4%E3%83%AD%E3%82%A6.JPG", "extract": "물방개 또는 선두리(영어: Diving beetle, 학명: Cybister chinensis, 문화어: 기름도치)는 대한민국에 서식하는 물방개과의 곤충 중 가장 큰 종이다. 한자어로는 용슬(龍蝨) 또는 지별충(地鱉蟲)이라고 한다. 《표준어 규정》 제3장 제3절 제23항에 따라 '물방개'와 '선두리'는 복수 표준어다. 옛말로는 쌀방개라고도 한다.\n물가에서 서식하는 진수서군곤충으로, 배의 제1-3배마디 복판이 서로 붙었고, 뒷다리 밑마디는 제1배마디와 유합하여 움직일 수 없으며, 몸길이는 약 3.5~4.5cm이다. 등딱지는 흑록색 내지 청록색이며 금색 옆줄이 있고 수컷은 광택이 있는 반면 암컷은 거칠다. 턱판과 더듬이 등 여타 신체 구조는 황갈색을 띤다. 호흡을 위해 꽁무니의 구멍을 물 밖에 내밀고 산소를 얻거나 물에 있는 산소를 얻는다. 공기 방울을 딱지날개와 등판 사이에 있는 공간 속에 저장할 수도 있다. 다리에는 털이 있으며 특히 뒷다리에 많아 뒷다리로 물 속에서 헤엄치거나 자맥질할 추진력을 얻는다. 붙들려 있으려는 습성이 있어 그물에 딸려 붙기도 하며 서로 엉겨붙어서 헤엄을 치기도 한다. 유충시기 먹이는 장구벌레, 송사리, 올챙이 등이다. 성충은 육식성으로, 살아있는 것, 죽은 것 가리지 않고 모두 잡아먹는다. 천적은 새와 두꺼비 등이며 위험을 느끼면 도망치기 위해 머리 뒤쪽에서 악취를 띤 물질을 분비해 달아나기도 한다.", "url": "https://ko.wikipedia.org/wiki/%EB%AC%BC%EB%B0%A9%EA%B0%9C", "lang": "ko", "sci": ""}, "water_scav": {"title": "물땡땡이", "img": "https://upload.wikimedia.org/wikipedia/ko/thumb/f/f4/%E3%82%B7%E3%83%9E%E3%82%B2%E3%83%B3%E3%82%B4%E3%83%AD%E3%82%A6_Hydaticus_bowringi_%E3%82%AC%E3%83%A0%E3%82%B7_Hydrophilus_acuminatus_%E3%82%B3%E3%82%AC%E3%83%A0%E3%82%B7_Hydrochara_affinis.jpg/500px-%E3%82%B7%E3%83%9E%E3%82%B2%E3%83%B3%E3%82%B4%E3%83%AD%E3%82%A6_Hydaticus_bowringi_%E3%82%AC%E3%83%A0%E3%82%B7_Hydrophilus_acuminatus_%E3%82%B3%E3%82%AC%E3%83%A0%E3%82%B7_Hydrochara_affinis.jpg", "extract": "물땡땡이(학명: Hydrophilus acuminatus)는 딱정벌레목 물땡땡이과의 곤충이다. 물방개와 비슷하게 생겼으나 물방개는 완전한 육식성이지만 물땡땡이는 잡식성이고, 또다른 차이점은 물방개와 물땡땡이의 얼굴형태는 상당한 차이가 있다는 점이다. 그리고 물방개는 알을 낳을 때 물풀의 줄기에 알을 낳지만, 물땡땡이는 알집을 만들어 그 안에 30개~50개의 알을 낳는다. 숨을 쉴때도 물방개과는 딱지날개속에 공기를 저장하지만, 물땡땡이과는 곤봉같은 더듬이를 수면밖에 내밀어 호흡한다. 유충때는 똑같이 둘다 육식성이며, 둘다 완전변태(번데기 과정을 거치고 성충이 되는 것)를 한다. 그리고 헤엄치는 것에 큰 차이점이 있고, 물방개의 뒷다리는 두껍고 힘이 넘치는 가운데, 물땡땡이는 뒷다리가 가늘고 잔털이 많다. 그리고 물땡땡이는 물속에 들어가면 배에 투명한 공기막이 보이게된다. 논, 웅덩이, 연못, 인공호 등 정수역과 평지하천, 강 등 유수역에 서식한다. 유속이 완만하거나 정체되는 수변부의 식생이 풍부한 곳을 선호한다. 양 발을 따로따로 움직여 기어 다니듯이 이동한다. 짝짓기를 한 후 암컷은 알을 알집을 만들어 그 속에 낳아서 물표면 가까이 있는 물풀에다 붙여 둔다. 성충은 야행성으로 불빛에 유인되어 날아온다.", "url": "https://ko.wikipedia.org/wiki/%EB%AC%BC%EB%95%A1%EB%95%A1%EC%9D%B4", "lang": "ko", "sci": ""}, "weevil": {"title": "바구미", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/6/62/Weevil_September_2008-1.jpg/500px-Weevil_September_2008-1.jpg", "extract": "바구미(영어: weevil)는 바구미상과(학명: Curculionoidea)에 속하는 딱정벌레 곤충의 총칭이다. 몸 길이는 약 1mm~30mm로 크기가 다양하며 식물의 씨앗이나 잎을 갉아먹는 초식성이다. 7~8개 과에 6만여 종 이상이 있으며, 대부분의 종은 바구미과에 속해 있다. 일부 바구미상과에 속하지 않는 곤충도 ‘바구미’로 불리기도 한다. 일부 종의 바구미는 곡식 등을 파먹는 해충이다. 한국에는 약 400종이 알려져 있다. 종자식물이 있는 곳이면 어디서든 볼 수 있다.", "url": "https://ko.wikipedia.org/wiki/%EB%B0%94%EA%B5%AC%EB%AF%B8", "lang": "ko", "sci": "머리대장하목에 속한 상과"}, "click": {"title": "Click beetle", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/0/09/Denticollis.linearis.3.jpg/500px-Denticollis.linearis.3.jpg", "extract": "Elateridae or click beetles are a family of beetles. Other names include elaters, snapping beetles, spring beetles or skipjacks. This family was defined by English zoologist William Elford Leach (1790–1836) in 1815. They are a cosmopolitan beetle family characterized by the unusual click mechanism they possess. There are a few other families of Elateroidea in which a few members have the same mechanism, but most elaterid subfamilies can click. A spine on the prosternum can be snapped into a corresponding notch on the mesosternum, producing a violent \"click\" that can bounce the beetle into the air. The evolutionary purpose of this click is debated: hypotheses include that the clicking noise deters predators or is used for communication, or that the click may allow the beetle to \"pop\" out of the substrate in which it is pupating. It is unlikely that the click is used for avoiding predators as it does not carry the beetle very far (<50 cm), and in practice click beetles usually play dead or flee normally. There are about 9300 known species worldwide, and 965 valid species in North America.", "url": "https://en.wikipedia.org/wiki/Click_beetle", "lang": "en", "sci": "Family of beetles"}, "firefly": {"title": "반딧불이과", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/9/90/Japanese_Firefly_%E3%83%98%E3%82%A4%E3%82%B1%E3%83%9C%E3%82%BF%E3%83%AB_Luciola_lateralis.jpg/500px-Japanese_Firefly_%E3%83%98%E3%82%A4%E3%82%B1%E3%83%9C%E3%82%BF%E3%83%AB_Luciola_lateralis.jpg", "extract": "반딧불이 또는 개똥벌레(문화어: 불벌레, firefly 또는 lightning bug, 학명: Lampyridae)는 딱정벌레목의 하위 과 가운데 하나이다. 약 1,900종의 곤충이 이 무리에 드는데, 대부분 생물 발광이라는 생리 과정을 통해 배에서 빛을 발한다.", "url": "https://ko.wikipedia.org/wiki/%EB%B0%98%EB%94%A7%EB%B6%88%EC%9D%B4%EA%B3%BC", "lang": "ko", "sci": "딱정벌레목에 속하는 과"}, "firefly2": {"title": "늦반딧불이", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/d/d5/%EB%B0%98%EB%94%A7%EB%B6%88%EC%9D%B4.jpg/500px-%EB%B0%98%EB%94%A7%EB%B6%88%EC%9D%B4.jpg", "extract": "늦반딧불이는 반딧불이과의 곤충이다. 몸길이는 15~18mm이다. 머리는 넓은 앞가슴등판 밑에 숨겨져서 위에서는 보이지 않는다. 앞가슴등판은 뒤쪽이 등황색이나 양옆의 앞쪽은 맑고 투명하다. 몸의 대부분은 암갈색 내지 흑갈색이며, 배의 뒤쪽에 있는 발광기관은 황백색이다. 암컷은 날개가 없으며 몸은 수컷에 비해 크고, 눈은 작다. 더듬이는 수컷보다 짧다. 애벌레는 달팽이나 고동류를 잡아먹고산다. 유충이 땅에 서식하는 육서종이지만, 습한 상태가 항상 유지되는 지역인 계곡 주변의 산기슭이나, 강 주변의 제방 등에서 서식한다. 성충은 8월 중순부터 10월 사이에 나타나는데 땅의 표면이나 풀줄기에서 불빛을 내는 암컷에게 수컷이 날아와 짝짓기를 한다. 한반도 중·남부와 제주도에 서식하며 일본, 중국에 분포한다.", "url": "https://ko.wikipedia.org/wiki/%EB%8A%A6%EB%B0%98%EB%94%A7%EB%B6%88%EC%9D%B4", "lang": "ko", "sci": ""}, "darkling": {"title": "Mealworm", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/f/fc/Tenebrio_molitor_Linn%C3%A9%2C_1758_%2832842137535%29.png/500px-Tenebrio_molitor_Linn%C3%A9%2C_1758_%2832842137535%29.png", "extract": "Mealworms are the larval form of the yellow mealworm beetle, Tenebrio molitor, a species of darkling beetle.", "url": "https://en.wikipedia.org/wiki/Mealworm", "lang": "en", "sci": "Species of darkling beetle, larval form"}, "butterfly": {"title": "배추흰나비", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/9/9b/Pieris.rapae.mounted.jpg/500px-Pieris.rapae.mounted.jpg", "extract": "배추흰나비(Pieris rapae)는 흰나비과에 속하는 나비이다. 구북구와 신북구 전역을 포함한 전북구와 호주, 뉴질랜드에 이르기까지 세계적으로 여러 곳에 서식하여 세계적으로 가장 넓은 서식지 분포를 보이는 나비 가운데 하나이다. 한반도에서도 매우 흔하다.", "url": "https://ko.wikipedia.org/wiki/%EB%B0%B0%EC%B6%94%ED%9D%B0%EB%82%98%EB%B9%84", "lang": "ko", "sci": ""}, "yellow_bf": {"title": "노랑나비", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/2/24/Colias_erate_poliographus_sep01_edited.png/500px-Colias_erate_poliographus_sep01_edited.png", "extract": "노랑나비(Colias erate)는 흰나비과에 속하는 나비이다.", "url": "https://ko.wikipedia.org/wiki/%EB%85%B8%EB%9E%91%EB%82%98%EB%B9%84", "lang": "ko", "sci": "흰나비과의 나비"}, "swallowtail": {"title": "호랑나비", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/2/24/Papilio_xuthus.jpg/500px-Papilio_xuthus.jpg", "extract": "호랑나비(학명: Papilio xuthus)는 호랑나비과에 속하는 나비이다. 범나비라고도 한다. 주로 동남아시아에서 동아시아에 걸쳐 서식하여 미안마, 중국, 타이완, 한반도, 일본에 걸쳐 서식하고 있다. 유럽, 하와이, 시베리아와 같은 곳에서도 관찰된다. 날개의 화려한 무늬때문에 인기가 많고 관람이나 판매를 위해 사육된다.", "url": "https://ko.wikipedia.org/wiki/%ED%98%B8%EB%9E%91%EB%82%98%EB%B9%84", "lang": "ko", "sci": "호랑나비과의 나비"}, "swallowtail2": {"title": "산호랑나비", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/6/69/Thomas_Bresson_-_Machaon-1_%28by%29.jpg/500px-Thomas_Bresson_-_Machaon-1_%28by%29.jpg", "extract": "산호랑나비(Papilio machaon)는 호랑나비과에 속하는 나비이다. 구북구와 신북구를 가리지 않고 북반구 어디서나 관찰된다. 호랑나비와 매우 비슷하게 생겼으나 앞날개의 맨앞부분 무늬가 다르고 뒷날개 끝에 선명한 푸른 반점이 있다.", "url": "https://ko.wikipedia.org/wiki/%EC%82%B0%ED%98%B8%EB%9E%91%EB%82%98%EB%B9%84", "lang": "ko", "sci": "호랑나비과의 나비"}, "black_sw": {"title": "제비나비", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/0/07/Papilio_bianor_1.jpg/500px-Papilio_bianor_1.jpg", "extract": "제비나비(Papilio bianor)는 호랑나비과에 속하는 나비이다.", "url": "https://ko.wikipedia.org/wiki/%EC%A0%9C%EB%B9%84%EB%82%98%EB%B9%84", "lang": "ko", "sci": "호랑나비과에 속하는 나비"}, "blue_bf": {"title": "남방부전나비", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/9/93/Pale_Grass_Blue_October_2007.jpg/500px-Pale_Grass_Blue_October_2007.jpg", "extract": "남방부전나비(Zizeeria maha)는 부전나비과에 속하는 나비이다.", "url": "https://ko.wikipedia.org/wiki/%EB%82%A8%EB%B0%A9%EB%B6%80%EC%A0%84%EB%82%98%EB%B9%84", "lang": "ko", "sci": "부전나비과의 나비"}, "comma": {"title": "네발나비", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/6/66/Polygonia_c-aureum_in_Higashiyama_Zoo_and_Botanical_Gardens.jpg/500px-Polygonia_c-aureum_in_Higashiyama_Zoo_and_Botanical_Gardens.jpg", "extract": "네발나비(Polygonia c-aureum)는 네발나비과를 대표하는 나비이다. 남방씨알붐나비로 불리다가 이름이 바뀌었다.", "url": "https://ko.wikipedia.org/wiki/%EB%84%A4%EB%B0%9C%EB%82%98%EB%B9%84", "lang": "ko", "sci": "네발나비과의 나비"}, "peacock": {"title": "공작나비", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/4/44/Tagpfauenauge3.jpg/500px-Tagpfauenauge3.jpg", "extract": "공작나비는 네발나비과의 나비이다. 애벌레는 쐐기풀이나 맥주의 원료식물인 호프를 먹고 자란다. 고산지역에 사는 나비이다. 공작나비라는 이름은 공작의 무늬를 연상시키는 눈무늬때문에 붙여졌으며, 눈무늬로 적인 새를 위협한다. 왜냐하면 눈무늬를 보면 작은 새들의 천적인 올빼미나 뱀이 연상되기 때문이다.", "url": "https://ko.wikipedia.org/wiki/%EA%B3%B5%EC%9E%91%EB%82%98%EB%B9%84", "lang": "ko", "sci": ""}, "monarch": {"title": "왕나비", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/f/f0/Parantica_sita-2.jpg/500px-Parantica_sita-2.jpg", "extract": "왕나비(Parantica sita)는 네발나비과의 왕나비아과에 속하는 나비이다. 한때 제주왕나비로 불리었으나 현재의 이름으로 바뀌었다.", "url": "https://ko.wikipedia.org/wiki/%EC%99%95%EB%82%98%EB%B9%84", "lang": "ko", "sci": ""}, "large_white": {"title": "큰줄흰나비", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/1/19/MZLU-00129265_ventral_%2850996810004%29.jpg/500px-MZLU-00129265_ventral_%2850996810004%29.jpg", "extract": "큰줄흰나비(Pieris melete)는 흰나비과의 나비이다. 앞날개와 뒷날개의 시맥을 따라 검은 줄이 굵게 나있다.", "url": "https://ko.wikipedia.org/wiki/%ED%81%B0%EC%A4%84%ED%9D%B0%EB%82%98%EB%B9%84", "lang": "ko", "sci": "흰나비과의 나비"}, "parnassius": {"title": "모시나비", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/a/af/Parnassius_stubbendorfi_ulster.jpg/500px-Parnassius_stubbendorfi_ulster.jpg", "extract": "모시나비(Parnassius stubbendorfii)는 호랑나비과의 나비이다. 날개 길이는 56 mm 안팍으로 비늘 가루가 적고 백색으로 반투명하다. 이 모습이 모시와 닮았다고 이런 이름이 붙었다.", "url": "https://ko.wikipedia.org/wiki/%EB%AA%A8%EC%8B%9C%EB%82%98%EB%B9%84", "lang": "ko", "sci": "호랑나비과의 나비"}, "skipper": {"title": "팔랑나비과", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/0/0f/Dickkopffalter.jpg/500px-Dickkopffalter.jpg", "extract": "팔랑나비과는 왕팔랑나비등이 속하는 팔랑나비상과의 유일한 과이다. 팔랑나비과의 성충은 나방과 비슷하게 생겼으며, 알에 털을 붙여서 적의 눈을 속인다. 애벌레도 먹이식물의 잎을 바느질하듯이 말아서 집을 만드는데, 이러한 자기보호는 나비의 성충과 애벌레 모두 천적이 많기 때문에 생긴 본능이다. 나비는 사마귀, 기생벌, 쌍살벌 등의 많은 천적들을 갖고 있다. 한국에는 수리팔랑나비아과(3종), 흰점팔랑나비아과(10종), 팔랑나비아과(20종) 등 3개의 아과에 총 33종이 밝혀져 있다.", "url": "https://ko.wikipedia.org/wiki/%ED%8C%94%EB%9E%91%EB%82%98%EB%B9%84%EA%B3%BC", "lang": "ko", "sci": ""}, "satyr": {"title": "뱀눈나비아과", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/a/a2/Butterfly_April_2008-2a.jpg/500px-Butterfly_April_2008-2a.jpg", "extract": "뱀눈나비과는 네발나비과의 하위 과이다.", "url": "https://ko.wikipedia.org/wiki/%EB%B1%80%EB%88%88%EB%82%98%EB%B9%84%EC%95%84%EA%B3%BC", "lang": "ko", "sci": ""}, "fritillary": {"title": "표범나비아과", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/0/0a/Heliconius_mimicry.png/500px-Heliconius_mimicry.png", "extract": "표범나비아과(豹범나비亞科)는 네발나비과에 속하는 나비의 아과이다. 날개길이 4.5-10cm이고 전 세계에 약 45-50 속이 알려져 있다. 유충이 시계꽃과 식물을 먹기 때문에 그 유독성분을 체내에 함유하고 있어 조류 등에게 잡아먹히지 않는다. 대부분의 종류가 붉은색·노란색·파란색·검은색 등의 색채를 여러 가지로 혼합한 선명한 색채를 띠며, 날개 모양은 옆으로 갸름하게 뻗어 있다. 남아메리카의 열대지역에서 많이 볼 수 있으며, 일부가 북아메리카에서 발견된다. 대부분 삼림에서 살며, 나무 위나 수목 주위를 서서히 날며, 여러 가지 꽃을 찾아 다닌다. 성충은 주둥이에 화분덩어리를 달고 있는 경우가 많은데, 이것은 화분 속의 아미노산을 영양원으로 이용하기 위해서이다. 종류에 따라 저녁 때가 되면 일정한 장소에서 집단을 이루어 밤을 지낸다. 얼룩무늬의 지리적 변이(變異)가 뚜렷하고, 독나비류끼리 서로 의태(擬態)를 하여 독이 없는 나비의 의태 모델도 되고 있다.", "url": "https://ko.wikipedia.org/wiki/%ED%91%9C%EB%B2%94%EB%82%98%EB%B9%84%EC%95%84%EA%B3%BC", "lang": "ko", "sci": ""}, "moth": {"title": "Adult Moth of Bombyx mori.jpg", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/1/19/Adult_Moth_of_Bombyx_mori.jpg/500px-Adult_Moth_of_Bombyx_mori.jpg", "extract": "", "url": "https://commons.wikimedia.org/wiki/File:Adult_Moth_of_Bombyx_mori.jpg", "lang": "commons", "sci": ""}, "hawkmoth": {"title": "박각시", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/e/e9/Agrius_convolvuli_MHNT.jpg/500px-Agrius_convolvuli_MHNT.jpg", "extract": "박각시(영어: Convolvulus hawkmoth, 학명: Agrius convolvuli)는 박각시과 박각시속에 딸린 커다란 나방이다. 날개 너비는 80 ~ 105 mm이다. 몸 색깔은 전체적으로 회색조지만, 복부에 검고 붉고 흰 섬세한 무늬가 있다. 몸이 유선형이며, 앞날개가 길고 뒷날개는 작다. 해질 무렵에 나와 꽃을 찾아다니며 꽃꿀을 빤다. 유충은 '깻망아지'라 불리며 고구마나 꽃의 잎을 갉아 먹는다. 유충 중에는 몸 뒷부분에 날카로운 뿔이 있는 것이 있다. 유충은 고치를 만들지 않고 흙 속에서 번데기 단계를 보낸다. 한국을 비롯한 아시아와 유럽 지역에 분포한다.", "url": "https://ko.wikipedia.org/wiki/%EB%B0%95%EA%B0%81%EC%8B%9C", "lang": "ko", "sci": ""}, "luna": {"title": "산누에나방", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/3/35/Antheraea_pernyi_female_sjh.JPG/500px-Antheraea_pernyi_female_sjh.JPG", "extract": "산누에나방(학명: Antheraea pernyi)은 산누에나방과 산누에나방속에 속하는 나방의 일종이다.", "url": "https://ko.wikipedia.org/wiki/%EC%82%B0%EB%88%84%EC%97%90%EB%82%98%EB%B0%A9", "lang": "ko", "sci": ""}, "gypsy": {"title": "매미나방", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/b/b8/Lymantria_dispar_MHNT.CUT.2012.0.357_Col_de_Cricheto_Bastelica_male_Dos.jpg/500px-Lymantria_dispar_MHNT.CUT.2012.0.357_Col_de_Cricheto_Bastelica_male_Dos.jpg", "extract": "매미나방(영어: sponge moth)은 독나방과의 나방이다. 암컷은 짝짓기한 후 7월부터 숲이나 단단한 벽, 바위 틈 등 다양한 곳에 배의 털을 섞어서 알 덩이를 붙여놓는다. 알은 1mm 내외며 이른 봄이면 이미 알껍데기 안에서 부화해 있다가 날씨가 따뜻하면 알을 깨고 나온다. 유충은 여름 숲 속, 산길에서 쉽게 볼 수 있으며, 털에 독성이 있어 맨손으로 만지거나 피부에 닿으면 알레르기나 각막염은 물론 피부병에 걸릴 수 있다. 낮에는 줄기에 잠복해 있다가 야간에 활동해 활엽수 잎을 갉아 먹으며, 지역에 따라 돌발적으로 대발생하는 경우가 있어 피해를 주는 해충으로 여겨진다. 잎에 실을 약간 치고 번데기가 되어 15일 정도면 우화한다. 수컷은 빠르고 활발하게 날아다니지만 암컷은 움직임이 거의 없다. 한국·일본·아무르·시베리아·유럽·북아메리카 등 전 대륙에 폭넓게 분포한다.", "url": "https://ko.wikipedia.org/wiki/%EB%A7%A4%EB%AF%B8%EB%82%98%EB%B0%A9", "lang": "ko", "sci": ""}, "tiger_moth": {"title": "Garden tiger moth", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/d/df/Arctia_caja_%28Marek_Szczepanek%29.jpg/500px-Arctia_caja_%28Marek_Szczepanek%29.jpg", "extract": "Arctia caja, the garden tiger moth or great tiger moth is a moth of the family Erebidae. Arctia caja is a northern species found in the US, Canada, and Europe. The moth prefers cold climates with temperate seasonality, as the larvae overwinter, and preferentially chooses host plants that produce pyrrolizidine alkaloids. However, garden tiger moths are generalists, and will pick many different plants to use as larval host plants.", "url": "https://en.wikipedia.org/wiki/Garden_tiger_moth", "lang": "en", "sci": "Species of moth"}, "bee": {"title": "꿀벌", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/5/5e/Bee_on_Geraldton_Wax_Flower.JPG/500px-Bee_on_Geraldton_Wax_Flower.JPG", "extract": "꿀벌은 꿀벌속(Apis)에 속하는 곤충의 총칭으로, 꿀벌과에 속한다. 또한 꿀벌은 이름 그대로 꿀을 저장하고 생산하는 벌로, 꿀벌로부터 채취한 꿀을 벌꿀이라고 부른다.", "url": "https://ko.wikipedia.org/wiki/%EA%BF%80%EB%B2%8C", "lang": "ko", "sci": "꿀벌속에 속하는 곤충의 총칭"}, "bumblebee": {"title": "호박벌", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/8/80/Bombus_ignitus.jpg/500px-Bombus_ignitus.jpg", "extract": "호박벌(Bombus ignitus)은 꿀벌과의 곤충이다.", "url": "https://ko.wikipedia.org/wiki/%ED%98%B8%EB%B0%95%EB%B2%8C", "lang": "ko", "sci": "꿀벌과의 곤충"}, "hornet": {"title": "말벌", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/f/fd/Hornet-vespa.jpg/500px-Hornet-vespa.jpg", "extract": "말벌(영어: European hornet, 학명: Vespa crabro 베스파 크라브로[*])은 말벌과 말벌아과 말벌속에 속하는 한 종으로서, 유라시아에 널리 분포한다. 유럽에 서식하는 말벌 중에서는 가장 크다. 6~10월 사이에 볼 수 있으며 사회성벌로서, 가을부터 다음 해 가을까지 군체를 형성하는 1년생이다. 이 말벌은 19세기에 유럽에서 북아메리카에 유입되어 그곳에 서식하는 유일한 말벌속의 종이 되었다.", "url": "https://ko.wikipedia.org/wiki/%EB%A7%90%EB%B2%8C", "lang": "ko", "sci": "말벌속에 속하는 한 종"}, "paper_wasp": {"title": "쌍살벌", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/c/c5/Wasp_May_2008-11.jpg/500px-Wasp_May_2008-11.jpg", "extract": "쌍살벌(Paper wasp)은 말벌상과에 딸린 벌로 쌍살벌아과에 속한다. 쌍살벌이라는 이름은 날아다닐 때 맨 뒷다리를 늘어뜨리고 나는 모습이 살 두 개를 들고 나는 것으로 보이는 것에서 유래하였다. 또다른 우리말로 '바다리'라고도 한다. 몸길이 18~25mm로 말벌보다 작으며 체형이 가늘고 다리가 길쭉하다. 도시에서도 흔히 볼 수 있으며, 창문이나 건물 지붕에 집을 짓기도 한다.", "url": "https://ko.wikipedia.org/wiki/%EC%8C%8D%EC%82%B4%EB%B2%8C", "lang": "ko", "sci": ""}, "yellowjacket": {"title": "땅벌", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/5/5d/Vespula_flaviceps.jpg/500px-Vespula_flaviceps.jpg", "extract": "땅벌(Vespula flaviceps)은 말벌과에 속하는 벌의 한 종류로 땅 속이나 숲 속에 층층히 된 집을 짓고 산다. 방언으로 땡삐, 오빠시라고도 한다. 몸 길이는 대략 15mm 정도로, 말벌보다 작다. 검은색 몸에 황색 선이 있다. 주로 수액이나 과일을 먹지만 꿀벌 등 작은 곤충을 사냥하기도 한다.", "url": "https://ko.wikipedia.org/wiki/%EB%95%85%EB%B2%8C", "lang": "ko", "sci": "말벌과 곤충"}, "mud_dauber": {"title": "나나니", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/5/5c/Red-banded_Sand_Wasp_%28Ammophila_sabulosa%29_%2811087045346%29.jpg/500px-Red-banded_Sand_Wasp_%28Ammophila_sabulosa%29_%2811087045346%29.jpg", "extract": "나나니는 구멍벌과 나나니아과 나나니속에 속하는 기생벌 종이다. 나나니 암펄은 맑은 날 다른 곤충의 애벌레를 납치하여 봉침으로 마비시킨 뒤 땅굴을 파서 자신의 알과 함께 파묻는다. 부화한 나나니 유충은 함께 파묻힌 애벌레를 먹이로 삼는다. 다른 나나니 애벌레 역시 이 기생의 대상이 될 수 있다. 또한 다른 나나니의 땅굴에 봉납된 먹이를 끄집어내 자기 땅굴로 훔쳐가는 노동기생, 다른 나나니 땅굴에 들어가 먼저 산란된 나나니 알을 파괴한 뒤 자기 알을 낳는 탁란 등 다채로운 기생 양태가 나타난다.", "url": "https://ko.wikipedia.org/wiki/%EB%82%98%EB%82%98%EB%8B%88", "lang": "ko", "sci": ""}, "carpenter_bee": {"title": "어리호박벌", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/7/72/Bee_September_2007-15.jpg/500px-Bee_September_2007-15.jpg", "extract": "어리호박벌은 꿀벌과의 벌이다. 수컷은 독침이 없으며 얼굴에 삼각 부분이 노랗고,암컷은 머리 전체가 검고 독침이 있다. 호박이 수박이도 어리호박벌이다. 일반 호박벌과 달리 혼자서 생활하거나 암수가 단둘이 사는 것이 특징,암컷은나무를 갉아먹어 집을짓는다.", "url": "https://ko.wikipedia.org/wiki/%EC%96%B4%EB%A6%AC%ED%98%B8%EB%B0%95%EB%B2%8C", "lang": "ko", "sci": ""}, "ant": {"title": "곰개미", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/0/0b/Hard_work.jpg/500px-Hard_work.jpg", "extract": "곰개미(학명: Formica japonica)는 곤충강 벌목 개미과 불개미아과 불개미속에 속한다. 한반도, 중화인민공화국, 일본, 중화민국, 러시아(연해주, 사할린, 동시베리아), 몽골 등지에 동아시아에서 Formica 속중 가장 넓은 분포 범위를 가졌다. 비슷한 종으로 숲곰개미(Formica hayashi)와 레만불개미(Formica lemani), 흑개미(Formica fusca)가 있다. 간혹 숲곰개미와 헷갈리기도 한다.", "url": "https://ko.wikipedia.org/wiki/%EA%B3%B0%EA%B0%9C%EB%AF%B8", "lang": "ko", "sci": ""}, "ant_big": {"title": "일본왕개미", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/0/06/Camponotus_japonicus_on_metallic_column_-_2.jpg/500px-Camponotus_japonicus_on_metallic_column_-_2.jpg", "extract": "일본왕개미(학명: Camponotus japonicus)는 한반도, 일본, 대만, 필리핀, 미얀마 등지에 넓게 분포하는 개미이다. 몸은 전체적으로 검은 빛을 띄며 흔히 놀이터, 운동장 등 공터나 인도에서 자주 발견된다. 몸의 길이는 여왕개미가 평균 17~18 mm, 수개미 10 mm, 일개미는 7~13 mm 내외이다. 결혼비행은 5월에서 9월까지 진행된다. 한국 홍가슴개미처럼 크기가 크다.", "url": "https://ko.wikipedia.org/wiki/%EC%9D%BC%EB%B3%B8%EC%99%95%EA%B0%9C%EB%AF%B8", "lang": "ko", "sci": ""}, "ant_red": {"title": "불개미", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/3/38/Formica_yessensis_-_journal.pone.0046840.g001_cropped.png/500px-Formica_yessensis_-_journal.pone.0046840.g001_cropped.png", "extract": "불개미(Formica yessensis)는 불개미속에 속하는 개미의 한 종이다. 화의(火蟻)라고도 한다. 한반도, 일본(혼슈 중부 이북), 중국, 대만, 러시아(동시베리아) 등지에 분포한다. 한국에서는 내륙에 넓게 국지적으로 분포한다. 다만, 남부지방으로 갈수록 개체수가 적어진다. 허준의 《동의보감》에서 나올 만큼 약재로도 유명한 개미다. 몸길이는 일개미는 4.5~8 mm, 여왕개미는 9~12 mm 정도이다. 불개미 일개미는 몸 길이나 덩치 차이가 아주 심하다. 여왕개미 중에 일개미와 비슷한 몸 길이를 가진 개체도 존재하기도 하다. 불개미의 모습이나 형태는 같은 속의 곰개미와 대체로 비슷하다. 둥그스름한 세모꼴의 얼굴과 양 쪽 눈의 겹눈 그리고 여왕개미와 수개미는 특유의 세 개의 홑눈을 가지고 있다.", "url": "https://ko.wikipedia.org/wiki/%EB%B6%88%EA%B0%9C%EB%AF%B8", "lang": "ko", "sci": ""}, "termite": {"title": "흰개미", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/d/d3/Coptotermes_formosanus_shiraki_USGov_k8204-7.jpg/500px-Coptotermes_formosanus_shiraki_USGov_k8204-7.jpg", "extract": "흰개미(영어: Termite)는 바퀴목의 흰개미하목(Isoptera)으로, 또는 바퀴목을 포함하는 흰개미차상과(Termitoidae)로 분류되는 진사회성 곤충이다. 흰개미하목을 바퀴목, 사마귀목을 함께 포함하는 망시목(Dictyoptera)의 아목으로 취급하기도 한다. 한국에서는 흰개미과에 속하는 흰개미(Reticulitermes speratus kyushuensis)를 가리키기도 한다. 한때는 흰개미와 바퀴는 다른 과로 분류되었지만, 계통학적 연구가 이루어진 후로부터 흰개미의 조상은 페름기나 석탄기에 나타났으며, 쥐라기 무렵 바퀴목과 근연의 조상에서 진화해 갈라져 나온 것으로 보고 있다. 현재의 사회성 흰개미와 같은 화석은 백악기에 최초로 출현하였고 신생대 제3기에 거의 모든 종이 출현하였다고 한다. 천적으로는 도마뱀, 영장류, 반날개, 개미 등의 포식성 동물들이 있는데, 이 중 개미는 번식에 필요한 여왕개미까지 죽이는 무서운 천적이다. 현재 3,106종이 알려져 있고, 알려지지 않은 몇백 종이 더 있을 것이다.", "url": "https://ko.wikipedia.org/wiki/%ED%9D%B0%EA%B0%9C%EB%AF%B8", "lang": "ko", "sci": ""}, "grasshopper": {"title": "메뚜기", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/e/e9/Acrididae_grasshopper-2.jpg/500px-Acrididae_grasshopper-2.jpg", "extract": "메뚜기(영어: Grasshopper)는 메뚜기목 메뚜기아목(Caelifera)에 속하는 곤충의 총칭 또는 벼메뚜기(Oxya chinensis sinuosa) 한 종만을 부르는 말이다. 일반적으로 몸이 중형이거나 대형 곤충류이다. 뒷다리는 뛰는데 알맞게 발달하였으며, 청각기나 발음기를 가진 종이 많다.", "url": "https://ko.wikipedia.org/wiki/%EB%A9%94%EB%9A%9C%EA%B8%B0", "lang": "ko", "sci": "메뚜기아목에 속하는 곤충의 총칭"}, "rice_hopper": {"title": "우리벼메뚜기", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/e/eb/Oxya_sinuosa_-_inat_48448261.jpg/500px-Oxya_sinuosa_-_inat_48448261.jpg", "extract": "우리벼메뚜기는 메뚜기과에 속하는 곤충이다. 벼메뚜기라고도 한다. 학명은 Oxya sinuosa이다.", "url": "https://ko.wikipedia.org/wiki/%EC%9A%B0%EB%A6%AC%EB%B2%BC%EB%A9%94%EB%9A%9C%EA%B8%B0", "lang": "ko", "sci": "메뚜기과에 속하는 곤충"}, "locust": {"title": "풀무치", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/3/31/Wanderheuschrecke-03.jpg/500px-Wanderheuschrecke-03.jpg", "extract": "풀무치(학명: Locusta migratoria)는 메뚜기과에 속하는 곤충이다. 풀무치속의 유일종이며, 황충(蝗蟲) 또는 누리라고도 불렸다. '이동메뚜기'라고도 하며, 북한의 생물명은 '이주메뚜기'다.", "url": "https://ko.wikipedia.org/wiki/%ED%92%80%EB%AC%B4%EC%B9%98", "lang": "ko", "sci": "메뚜기과에 속하는 곤충"}, "katydid": {"title": "방아깨비", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/f/f1/Acrida_cinerea_Kyoto_03.jpg/500px-Acrida_cinerea_Kyoto_03.jpg", "extract": "방아깨비(Acrida cinerea)는 메뚜기과에 속하는 곤충이다. 몸길이는 수컷이 4~5cm, 암컷이 7~8cm로, 수컷은 암컷에 비해 작고 말랐다. 암컷은 몸이 긴 원통형이고 머리 앞쪽이 원뿔처럼 뽀족하다. 전체적으로 녹색을 띠지만 더러 황백색 점이 줄무늬를 이루는 개체도 있고, 전체적으로 갈색을 띠는 개체도 있다. 한국에 서식하는 메뚜기들 가운데 가장 크다. 뒷다리가 매우 길어 손으로 잡으면 디딜방아처럼 위아래로 끄덕거려 이런 이름이 붙었다. 날아갈 때 날개를 부딪혀 '따다닥' 소리를 내서 '따닥개비'라고도 한다. 섬서구메뚜기와 오인하기도 하나, 방아깨비는 섬서구메뚜기에 비해 몸이 길쭉하고 뒷다리가 더 길며, 방아깨비의 뒷다리는 다른 다리보다 길지만, 섬서구메뚜기의 뒷다리는 다른 다리와 크게 다르지 않다.\n방아깨비 수컷이 소리를 내며 날아갈 때에 앞날개의 충돌은 없고, 뒷날개의 윗부분까지 충돌한다. 방아깨비 수컷은 1초에 약 30회의 날갯짓을 하며 날아가고, 방아깨비 암컷은 1초에 약 20회의 날갯짓을 하며 날아간다.\n방아깨비 암컷의 날갯짓에서 뒷날개의 윗부분이 충돌하지 않고 날갯짓의 횟수가 수컷보다 적은 이유는 날개의 면적이 수컷보다 커서 날갯짓을 할 때 공기 저항을 더 많이 받기 때문이다.\n방아깨비의 뒷날개는 시맥으로 이루어져있다. 뒷날개의 윗부분은 시맥이 고밀도로 촘촘하게 분포하고 아랫부분은 시맥이 비교적 적은데, 키틴막의 표면을 갖고 있는 시맥이 많을수록 단단한 성질을 갖게 된다. 이런 시맥 밀도의 차이가 뒷날개의 윗부분이 충돌했을 때 ‘따다다닥’ 소리를 만들게 된다.", "url": "https://ko.wikipedia.org/wiki/%EB%B0%A9%EC%95%84%EA%B9%A8%EB%B9%84", "lang": "ko", "sci": ""}, "bushcricket": {"title": "여치", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/f/f1/Gampsocleis_sedakovii_ssp._obscura_male.jpg/500px-Gampsocleis_sedakovii_ssp._obscura_male.jpg", "extract": "여치(학명: Gampsocleis sedakovii)는 여치과의 곤충으로, 몸길이는 30-36mm이고 머리부터 날개 끝까지의 길이는 32-44mm다. 녹색형과 갈색형이 있다. 수컷은 등면의 날개가 겹치는 곳에 발음기가 있다.", "url": "https://ko.wikipedia.org/wiki/%EC%97%AC%EC%B9%98", "lang": "ko", "sci": "여치과의 곤충"}, "katydid2": {"title": "베짱이", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/a/a8/Grasshopper_on_the_stairs_-_2.jpg/500px-Grasshopper_on_the_stairs_-_2.jpg", "extract": "베짱이는 메뚜기목 여치과의 육식성 곤충이다. 등에 갈색 줄무늬가 있다.", "url": "https://ko.wikipedia.org/wiki/%EB%B2%A0%EC%A7%B1%EC%9D%B4", "lang": "ko", "sci": "메뚜기목 여치과의 육식성 곤충"}, "cricket": {"title": "귀뚜라미과", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/6/6b/Becho.Galicia.070621_20.jpg/500px-Becho.Galicia.070621_20.jpg", "extract": "귀뚜라미과(Gryllidae)는 메뚜기목의 한 과이다. 세계적으로 약 800종이 알려져 있으며 한국에는 40종 정도가 알려졌다.", "url": "https://ko.wikipedia.org/wiki/%EA%B7%80%EB%9A%9C%EB%9D%BC%EB%AF%B8%EA%B3%BC", "lang": "ko", "sci": "메뚜기목의 한 과"}, "molecricket": {"title": "땅강아지", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/7/7b/Mole_cricket03.jpg/500px-Mole_cricket03.jpg", "extract": "땅강아지(학명: Gryllotalpa orientalis)는 땅강아지과 땅강아지속의 곤충으로, 아시아와 오스트레일리아에서 널리 발견된다. 하늘밥도둑, 강고(江蛄), 간단히 고(蛄)라고도 한다. 예전에 아프리카땅강아지(Gryllotalpa africana)와 혼동된 적이 있었으나 1980년대 이후로는 별도의 종으로 재분류되었다. 작물의 뿌리를 갉아먹고, 땅 속에 굴을 파 식물의 뿌리가 들뜨게 해 말라죽게 하는 토양 해충이다. 그러나 땅강아지는 장 기능과 관련된 질환에 다양하게 이용됨이 확인됐고, 특히 말려 가루를 내 복용하면 변비 치료에 특효가 있는 것으로 밝혀졌다.", "url": "https://ko.wikipedia.org/wiki/%EB%95%85%EA%B0%95%EC%95%84%EC%A7%80", "lang": "ko", "sci": "땅강아지과 땅강아지속의 곤충"}, "camel_cricket": {"title": "꼽등이", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/b/be/Diestrammena_coreana.JPG/500px-Diestrammena_coreana.JPG", "extract": "꼽등이(한국굴꼽등이)는 꼽등이과의 곤충이다. 몸과 다리는 적갈색으로 몸에는 약간 짙은 흑갈색 줄무늬가 있으며 산란관은 짙은 갈색으로 다른 종과 쉽게 구분할 수 있다. 더듬이는 몸길이의 4배 정도로 길며, 앞가슴은 둥글다. 몸길이는 19~24mm이다. 대한민국은 Yamasaki (1969)가 특산종으로 기록했으며, 제주도를 비롯하여 전국에 분포하며, 매우 흔한 종이다. 성숙하면 등에 광택이 나며 집 내부의 어두운 곳이나 동굴, 산의 바위 틈 등에서 있다가 밤에 나와서 활동한다. 한국, 일본, 중국, 타이완 등지에 분포한다.", "url": "https://ko.wikipedia.org/wiki/%EA%BC%BD%EB%93%B1%EC%9D%B4", "lang": "ko", "sci": ""}, "mantis": {"title": "사마귀", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/7/74/Tenodera_angustipennis_Saussure%28Pregnant%29_DSCN9575.jpg/500px-Tenodera_angustipennis_Saussure%28Pregnant%29_DSCN9575.jpg", "extract": "사마귀(Tenodera angustipennis)는 사마귀과의 곤충으로, 한국, 중국, 일본과 주위 아시아 본토 지역에 널리 분포한다. 미국 서부에도 정착해 서식하는 것이 발견되었다.", "url": "https://ko.wikipedia.org/wiki/%EC%82%AC%EB%A7%88%EA%B7%80", "lang": "ko", "sci": "사마귀과의 곤충"}, "mantis_big": {"title": "왕사마귀", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/0/03/Tenodera_sinensis_on_a_fence.jpg/500px-Tenodera_sinensis_on_a_fence.jpg", "extract": "왕사마귀(학명: Tenodera sinensis)는 사마귀목에 속하는 곤충이다.", "url": "https://ko.wikipedia.org/wiki/%EC%99%95%EC%82%AC%EB%A7%88%EA%B7%80", "lang": "ko", "sci": ""}, "mantis_brown": {"title": "Statilia maculata.jpg", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/a/a8/Statilia_maculata.jpg/500px-Statilia_maculata.jpg", "extract": "", "url": "https://commons.wikimedia.org/wiki/File:Statilia_maculata.jpg", "lang": "commons", "sci": ""}, "dragonfly": {"title": "된장잠자리", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/f/f9/Wandering_glider_horizontal_edit1.jpg/500px-Wandering_glider_horizontal_edit1.jpg", "extract": "된장잠자리(globe skimmer, wandering glider, Pantala flavescens)는 잠자리과에 속하는 곤충이다. 중위도 지역에서 남반구 열대 지역에 걸쳐 분포하며 체형에 비해 몸이 가벼워 장거리 이동을 한다. 추위에 매우 약해 알과 유충이 국내에서는 월동하지 못한다. 머리가 크고 몸이 전체적으로 누런 된장색이다.\n주변에서 가장 흔히 볼 수 있는 잠자리이며,\n겨울에는 동남아, 아프리카로 이동했다가 다시 봄이 되면 대한민국으로 날아온다.", "url": "https://ko.wikipedia.org/wiki/%EB%90%9C%EC%9E%A5%EC%9E%A0%EC%9E%90%EB%A6%AC", "lang": "ko", "sci": ""}, "red_dragonfly": {"title": "고추잠자리", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/2/23/Crocothemis_servilia_mariannae.jpg/500px-Crocothemis_servilia_mariannae.jpg", "extract": "고추잠자리(Crocothemis servilia)는 동아시아·동남아시아·플로리다반도·하와이 등에 분포하는 잠자리의 한 종이다.", "url": "https://ko.wikipedia.org/wiki/%EA%B3%A0%EC%B6%94%EC%9E%A0%EC%9E%90%EB%A6%AC", "lang": "ko", "sci": ""}, "emperor": {"title": "왕잠자리", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/f/f5/Anax_parthenope_male_and_female.JPG/500px-Anax_parthenope_male_and_female.JPG", "extract": "'왕잠자리(학명: Anax parthenope)는 왕잠자리과의 곤충이다. 한국, 중국, 일본, 타이완, 유럽 등지에 분포한다. 반수서곤충이고,\n배길이 50∼55mm, 뒷날개길이 50∼55mm, 전체길이 64~75mm이다. 겹눈과 가슴이 녹색이며 배는 갈색 바탕에 황색의 사각형 무늬가 있다. 수컷의 제1-3배마디 등면은 청색이고 암컷은 녹색을 띤다. 전국 대부분의 연못과 저수지 등지에서 서식하고 있으며 4월 하순경부터 10월까지 관찰이 가능하다. 유충(수채)은 대부분 농수로, 소류지, 습지에서 흔하게 볼 수 있다. 성충도 위와 같은 곳에 서식한다. 수컷은 서식지 주변의 가장자리를 왕복 비행하며 영역 경계활동을 하고, 암컷은 수생식물의 줄기에 산란관을 이용하여 단독 혹은 연결산란을 한다. 서울시 보호 야생 생물 대상종이다. 대중매체에서 록맨 X6의 커맨더 얀마크와 포켓몬스터의 왕자리의 모티브.라파엘을 상징 하나님의 갈증을 푸는자", "url": "https://ko.wikipedia.org/wiki/%EC%99%95%EC%9E%A0%EC%9E%90%EB%A6%AC", "lang": "ko", "sci": ""}, "skimmer": {"title": "밀잠자리", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/b/b8/Orthetrum_albistylum_%28young_female%29_%281%29.JPG/500px-Orthetrum_albistylum_%28young_female%29_%281%29.JPG", "extract": "밀잠자리(Orthetrum albistylum)는 잠자리하목에 속하는 곤충이다. 동아시아 지역, 중부와 남부 유럽 등지에 서식하는 것으로 알려져 있으며, 특히 폴란드의 발트해 지역에도 분포함이 확인되었다. 특히 눈이초록색이나 파란색,청록색인 것이 특징 중 하나이다. 한국에서는 소규모 하천, 논두렁, 연못, 습지 등에서 흔하게 볼 수 있으며 적응력이 뛰어나다.", "url": "https://ko.wikipedia.org/wiki/%EB%B0%80%EC%9E%A0%EC%9E%90%EB%A6%AC", "lang": "ko", "sci": ""}, "damselfly": {"title": "실잠자리아목", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/b/bd/Ischnura_heterosticta02.jpg/500px-Ischnura_heterosticta02.jpg", "extract": "실잠자리아목(Zygoptera) 또는 균시아목은 잠자리목을 이루는 두 아목 가운데 하나이다. 물잠자리과(Calopterygidae)에 속하는 종류는 물잠자리, 그 외의 것들은 통틀어 실잠자리라고 부른다. 실잠자리는 잠자리와 비슷하게 생겼지만 보다 작고 날렵하게 생겼으며 앉아서 쉴 때 날개를 접는다는 점이 다르다. 화석은 페름기 후기 이후의 지층에서 발견되며 남극을 제외한 세계 모든 곳에서 관찰된다.", "url": "https://ko.wikipedia.org/wiki/%EC%8B%A4%EC%9E%A0%EC%9E%90%EB%A6%AC%EC%95%84%EB%AA%A9", "lang": "ko", "sci": ""}, "jewelwing": {"title": "물잠자리", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/3/30/Calopteryx_japonica%28Male%2CJapan%2C2018.06.01%29.jpg/500px-Calopteryx_japonica%28Male%2CJapan%2C2018.06.01%29.jpg", "extract": "물잠자리(Calopteryx japonica)는 실잠자리아목에 속하는 곤충이다. 한국, 중국, 일본 등지에 서식하며, 빠른 속도로 흐르는 물가에서 주로 발견된다. 일반적으로 투명한 색상의 날개를 갖고 있으나, 성충 수컷 물잠자리는 화려한 색상의 날개를 갖고 있는 것이 특징이다. 사는 곳은 들이나 야산의 깨끗한 개울가로서 물가 식물이 자라는 곳이다. 활동기는 5월~7월이며 배 길이 42~47mm이며, 뒷날개는 32~40mm이다. 몸은 금속성 광택이 강한 녹색이며 수컷은 푸른빛이 나고 암컷은 구릿빛이 난다. 갓 태어났을 때는 몸의 색이 불완전할 수도 있다. 작은 곤충을 잡아먹는다.", "url": "https://ko.wikipedia.org/wiki/%EB%AC%BC%EC%9E%A0%EC%9E%90%EB%A6%AC", "lang": "ko", "sci": ""}, "lacewing": {"title": "풀잠자리", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/c/ce/Chrysopa_intima_%2810.3897-zookeys.807.29430%29_Figure_3_%28cropped%29.jpg/500px-Chrysopa_intima_%2810.3897-zookeys.807.29430%29_Figure_3_%28cropped%29.jpg", "extract": "풀잠자리(Chrysopa intima)는 풀잠자리과의 곤충이다. 몸길이는 10mm정도로 몸은 연두색이다. 진딧물 등의 자기보다 작은 곤충을 잡아먹는다.", "url": "https://ko.wikipedia.org/wiki/%ED%92%80%EC%9E%A0%EC%9E%90%EB%A6%AC", "lang": "ko", "sci": ""}, "antlion": {"title": "명주잠자리과", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/e/eb/Antlion.jpg/500px-Antlion.jpg", "extract": "명주잠자리과(明紬-)는 명주잠자리(Hagenomyia micans)를 포함한 풀잠자리목의 분류이다.", "url": "https://ko.wikipedia.org/wiki/%EB%AA%85%EC%A3%BC%EC%9E%A0%EC%9E%90%EB%A6%AC%EA%B3%BC", "lang": "ko", "sci": ""}, "stinkbug": {"title": "Nezara viridula", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/7/72/Nezara_viridula_MHNT_verte.jpg/500px-Nezara_viridula_MHNT_verte.jpg", "extract": "Nezara viridula, commonly known as the southern green stink bug (USA), southern green shield bug (UK) or green vegetable bug, is a plant-feeding stink bug. Believed to have originated in Ethiopia, it can now be found across the world. Because of its preference for certain species of legumes, such as beans and soybeans, it is an economically important pest on such crops.", "url": "https://en.wikipedia.org/wiki/Nezara_viridula", "lang": "en", "sci": "Species of true bug"}, "brown_stink": {"title": "썩덩나무노린재", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/a/a0/Pentatomidae_-_Halyomorpha_halys-001.JPG/500px-Pentatomidae_-_Halyomorpha_halys-001.JPG", "extract": "썩덩나무노린재(영어: brown marmorated stink bug)는 노린재과 노린재아과 썩덩나무노린재속에 딸린 곤충의 일종이다. 한국, 중국, 일본을 비롯한 아시아 일대에 서식한다. 1998년 9월 미국 펜실베이니아주 앨런타운시에서 발견되었는데, 사고로 유입된 것으로 여겨진다. 유충과 성충 모두 갈색이며, 각종 농작물을 비롯한 100종 이상의 식물을 먹이로 삼는다. 2010년대 들어서는 미국 동부의 과수원에까지 위명을 떨치는 해충이 되었다. 2010년 기준 미국 대서양 중부 지역에서 이놈 때문에 사과농가에 3700만 불의 손실이 발생했고, 일부 핵과 농가에서는 작물의 90%를 잃었다. 현재 북미 곳곳에 완전히 터를 잡았고, 최근에는 유럽과 남미에도 유입되었다.", "url": "https://ko.wikipedia.org/wiki/%EC%8D%A9%EB%8D%A9%EB%82%98%EB%AC%B4%EB%85%B8%EB%A6%B0%EC%9E%AC", "lang": "ko", "sci": ""}, "jewel_bug": {"title": "Poecilocoris lewisi", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/3/3e/Poecilocoris-lewisi.png/500px-Poecilocoris-lewisi.png", "extract": "Poecilocoris lewisi, known as the clown stink bug, is a species of shield bug found in eastern Asia.", "url": "https://en.wikipedia.org/wiki/Poecilocoris_lewisi", "lang": "en", "sci": "Species of true bug"}, "strider": {"title": "소금쟁이", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/6/63/Aquarius_najas01.jpg/500px-Aquarius_najas01.jpg", "extract": "소금쟁이(water strider)는 노린재아목에 속하는 곤충 중에서 소금쟁이과(Gerridae)에 속한 수표생물이자 수생곤충이다. 주요 서식지는 극지방을 제외하고, 한국, 일본, 시베리아, 중국 대륙 등의 동아시아를 포함한 전 세계이다. 몸 길이는 수컷이 11~14mm, 암컷이 13~16mm 정도이고, 몸 색깔은 진한 갈색이나 검은색을 띤다. 종류마다 다르지만 주요 서식지는 연못, 개천, 호수, 늪지 등이다.", "url": "https://ko.wikipedia.org/wiki/%EC%86%8C%EA%B8%88%EC%9F%81%EC%9D%B4", "lang": "ko", "sci": ""}, "waterbug": {"title": "물장군", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/b/b9/Tagame-female-male-DSC-8000.jpg/500px-Tagame-female-male-DSC-8000.jpg", "extract": "물장군은 노린재목 물장군과의 수서곤충이다. 몸 길이는 약 6.5cm 정도로 노린재 중에서 가장 크다. 서식처 파괴, 환경변화 등의 위협요인으로 인해 개체수가 줄어들어 환경부에서 멸종위기 야생생물 Ⅱ급으로 지정하여 보호하고 있다. 현재는 인천광역시 강화도, 제주특별자치시, 전라북도 익산시, 강원도 철원, 화천 일부지역, 경상북도 울진군, 경기도 화성시 등에서 대표적으로 서식이 확인되고 있다. 물 밖에서도 날아서 이동하거나 기어다닐 수 있다. 뾰족한 입으로 물고기, 올챙이, 개구리 등을 잡아 체액을 빨아먹는다. 불완전탈바꿈 곤충이며, 수컷 물장군은 암컷이 물 위로 나온 물풀이나 나무말뚝에 낳은 알을 부화할 때까지 지킨다. 서식지는 산 속 습지, 논, 농수로이며, 서식지는 매우 국지적이다. 충청도 일부 지역, 과거 영종도, 강화도, 제주도 지역 외에는 거의 서식하지 않는다.", "url": "https://ko.wikipedia.org/wiki/%EB%AC%BC%EC%9E%A5%EA%B5%B0", "lang": "ko", "sci": ""}, "waterbug2": {"title": "물자라", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/6/6b/Diplonychusjaponicus.jpg/500px-Diplonychusjaponicus.jpg", "extract": "물자라(학명: Muljarus japonicus)는 노린재목 물장군과에 속하는 수서곤충의 일종이다.", "url": "https://ko.wikipedia.org/wiki/%EB%AC%BC%EC%9E%90%EB%9D%BC", "lang": "ko", "sci": ""}, "waterscorpion": {"title": "게아재비", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/3/3e/Ranatra_chinensis.jpg/500px-Ranatra_chinensis.jpg", "extract": "게아재비(학명: Ranatra chinensis)는 노린재목 장구애비과에 속하는 곤충으로 생김새가 사마귀와 비슷해서 물사마귀라고도 한다. 몸 길이는 수컷은 35mm~40mm이고 암컷은 40mm~45mm정도다. 게아재비, 장구애비의 몸길이를 잴때는 숨관은 제외한다.", "url": "https://ko.wikipedia.org/wiki/%EA%B2%8C%EC%95%84%EC%9E%AC%EB%B9%84", "lang": "ko", "sci": ""}, "waterscorpion2": {"title": "장구애비", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/c/ca/Laccotrephes_japonensis.jpg/500px-Laccotrephes_japonensis.jpg", "extract": "장구애비(학명: Laccotrephes japonensis)는 노린재목 장구애비과에 속하는 수서곤충이다.", "url": "https://ko.wikipedia.org/wiki/%EC%9E%A5%EA%B5%AC%EC%95%A0%EB%B9%84", "lang": "ko", "sci": ""}, "aphid": {"title": "진딧물", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/4/4f/Aphidoidea_fight.jpg/500px-Aphidoidea_fight.jpg", "extract": "진딧물은 진딧물상과 진딧물과에 속하는 곤충의 총칭이다. 전세계에 4,000여 종, 한국에 300여 종이 알려져 있다.", "url": "https://ko.wikipedia.org/wiki/%EC%A7%84%EB%94%A7%EB%AC%BC", "lang": "ko", "sci": "진딧물과에 속하는 곤충"}, "cicada": {"title": "참매미", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/7/7e/Cicada_seoul.jpg/500px-Cicada_seoul.jpg", "extract": "참매미(Hyalessa maculaticollis)는 곤충강 노린재목 매미과에 속한다.", "url": "https://ko.wikipedia.org/wiki/%EC%B0%B8%EB%A7%A4%EB%AF%B8", "lang": "ko", "sci": ""}, "cicada_black": {"title": "말매미", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/1/11/Donovan_-_Insects_of_China%2C_1838_-_pl_15.jpg/500px-Donovan_-_Insects_of_China%2C_1838_-_pl_15.jpg", "extract": "말매미(Cryptotympana atrata)는 곤충강 노린재목 매미아목 매미과의 곤충이다. 대한민국에서 가장 큰 매미로, 몸길이는 44mm 내외이고, 날개까지 길이는 65mm 내외이다. 몸은 광택이 나는 검은색에 새로 나온 개체는 금빛 가루가 덮여 있으며, 배와 다리에는 주황색 무늬가 있다. 플라타너스, 버드나무 따위가 사는 낮은 지대의 벌판에 살며 성충은 6~10월에 활동한다. 한반도 전역에 서식하며, 세계적으로는 중국에 분포한다.", "url": "https://ko.wikipedia.org/wiki/%EB%A7%90%EB%A7%A4%EB%AF%B8", "lang": "ko", "sci": ""}, "cicada_brown": {"title": "유지매미", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/0/08/Graptopsaltria_nigrofuscata_001.jpg/500px-Graptopsaltria_nigrofuscata_001.jpg", "extract": "유지매미(油脂-, 문화어: 기름매미)는 곤충강 노린재목 매미과의 곤충이다. 학명은 Graptopsaltria nigrofuscata이다.\n몸길이는 35mm 정도이고 몸 빛깔은 흑색이며, 날개는 갈색이다. 땅속에서 약 5년 정도를 지내다가 나오며, 주로 산지에 서식한다. 한반도, 중국 대륙, 일본 열도, 타이완 등에서 관찰된다.", "url": "https://ko.wikipedia.org/wiki/%EC%9C%A0%EC%A7%80%EB%A7%A4%EB%AF%B8", "lang": "ko", "sci": ""}, "housefly": {"title": "집파리", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/8/87/Musca_domestica_housefly.jpg/500px-Musca_domestica_housefly.jpg", "extract": "집파리는 집파리과에 속하는 곤충이다. 몸길이는 3~8mm 정도이며 대체로 검은색을 띠고 있다. 이마는 짙은 갈색이고 옆얼굴·옆이마·눈언저리는 황금빛 가루로 덮여 있고, 겹눈은 적갈색이다. 머리는 크고 좌우로 돌릴 수 있으며, 겹눈도 크다. 뒷날개는 퇴화했고 배의 털이 짧다. 유충인 구더기는 동물의 고기나 오물을 먹는다. 입은 퇴화했고, 피부를 통해 소화효소를 분비하여 먹이를 녹인 뒤 피부로 흡수한다.", "url": "https://ko.wikipedia.org/wiki/%EC%A7%91%ED%8C%8C%EB%A6%AC", "lang": "ko", "sci": ""}, "hoverfly": {"title": "꽃등에과", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/f/f3/%C3%89ristale_gluante_%28Eristalis_tenax%29_-_Ver_%C3%A0_queue_de_rat.jpg/500px-%C3%89ristale_gluante_%28Eristalis_tenax%29_-_Ver_%C3%A0_queue_de_rat.jpg", "extract": "꽃등에과는 파리목에 속하는 과이다.", "url": "https://ko.wikipedia.org/wiki/%EA%BD%83%EB%93%B1%EC%97%90%EA%B3%BC", "lang": "ko", "sci": ""}, "mosquito": {"title": "모기", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/d/d4/Culex_pipiens.jpg/500px-Culex_pipiens.jpg", "extract": "모기는 파리목 모기과(Culicidae)에 속하는 곤충을 이르는 말이다. 수컷은 꽃의 꿀을 먹으며 살고 암컷도 평상시에는 그러하지만 산란기의 암컷의 거의 대부분은 빨대 모양의 주둥이로 숙주의 피부를 뚫고 피를 먹는 체외 기생충으로 산다. 수천 종이 다양한 숙주의 피를 먹고 살며, 주로 포유류, 조류, 파충류, 양서류 등을 포함한 척추동물이 숙주가 되고 경우에 따라서는 어류가 숙주가 된다. 어떤 종류는 절지동물과 같은 무척추동물을 공격하기도 한다. 숙주에게는 혈액을 잃는 것이 그다지 중요하지 않지만, 종종 모기의 침이 피부를 자극하는 발진을 일으켜 성가시게 한다. 무엇보다도 심각한 것은, 많은 모기의 종류가 질병의 매개체가 된다는 것이다. 일부는 숙주에서 숙주를 거치면서 말라리아(학질), 황열병, 치쿤구니아열, 서부나일강열바이러스, 뎅기열, 사상충증, 지카열, 아르보바이러스와 같은 매우 위험한 질병을 전파한다.", "url": "https://ko.wikipedia.org/wiki/%EB%AA%A8%EA%B8%B0", "lang": "ko", "sci": "파리목 모기과의 곤충"}, "horsefly": {"title": "등에", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/1/14/Horse_fly_Tabanus_2.jpg/500px-Horse_fly_Tabanus_2.jpg", "extract": "등에는 파리목 등에과에 속하는 곤충들이다. 흔히 '쇠파리'라고도 하는데, 소, 말, 사람 등 포유동물의 피를 흡혈하기 때문이다. 그러나 가축의 피하조직에 기생하는 쇠파리와는 다른 종류의 파리다.", "url": "https://ko.wikipedia.org/wiki/%EB%93%B1%EC%97%90", "lang": "ko", "sci": "파리목 등에과에 속하는 곤충들"}, "fruitfly": {"title": "초파리과", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/4/4c/Drosophila_melanogaster_-_side_%28aka%29.jpg/500px-Drosophila_melanogaster_-_side_%28aka%29.jpg", "extract": "초파리는 초파리과(Drosophilidae) 동물의 총칭으로, 세계에 3,000여 종이 분포하고 있다.", "url": "https://ko.wikipedia.org/wiki/%EC%B4%88%ED%8C%8C%EB%A6%AC%EA%B3%BC", "lang": "ko", "sci": "파리목에 속하는 과"}, "stick": {"title": "대벌레", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/2/2b/Baculum_irregulariterdentatum.jpg/500px-Baculum_irregulariterdentatum.jpg", "extract": "대벌레(Ramulus irregulariterdentatus)는 대벌레과 대벌레속의 곤충이다. 자신을 보호하기 위해 몸이 나뭇가지 모양이며, 적에게 잡히면 다리를 끊고 도망간다. 몸 길이는 70~100mm이다. 활엽수의 잎을 갉아먹으며 대발생도 종종 하기 때문에 일부 국가에서는 해충으로 보고 있다.", "url": "https://ko.wikipedia.org/wiki/%EB%8C%80%EB%B2%8C%EB%A0%88", "lang": "ko", "sci": ""}, "mayfly": {"title": "하루살이목", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/4/49/Rhithrogena_germanica_subimago_on_Equisetum_hyemale.jpg/500px-Rhithrogena_germanica_subimago_on_Equisetum_hyemale.jpg", "extract": "하루살이(mayfly, shadefly)는 하루살이목에 속하는 곤충의 총칭이다. 반수서곤충이고 총 2500여 종이 알려져 있다. 잠자리, 실잠자리 등을 포함하는 고시하강(팔레옵테라)이라고 부르는 오래된 곤충군에 속하며, 유충은 수생 곤충으로 종류에 따라 다르지만, 민물, 습지에서 1년 동안 사는 종도 있고, 2년 넘게도 사는 종이 있다. 성충은 종류에 따라 짧으면 몇 시간에서 길면 일주일이나 2주일 정도까지 산다. 따라서 애벌레 기간까지 포함하면 하루살이는 하루만 사는 게 아니라 1년가량 사는 것이다. 유충이나 아성충에게는 입이 있지만, 성충은 입이 퇴화하여 흔적만 남고 먹이섭취를 하지 못하거나, 입이 있다고 해도 수분 섭취만 하는 정도이며, 번식활동을 한다. 천적으로는 작은 곤충을 잡아먹는 잠자리가 있다.", "url": "https://ko.wikipedia.org/wiki/%ED%95%98%EB%A3%A8%EC%82%B4%EC%9D%B4%EB%AA%A9", "lang": "ko", "sci": ""}, "earwig": {"title": "집게벌레목", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/9/90/Forficula_auricularia.jpg/500px-Forficula_auricularia.jpg", "extract": "집게벌레목(----目, 膜翤目; Dermaptera)은 12과에 약 2,000종으로 이루어진 집게벌레 종들이 속해있는 분류군으로, 소형 곤충 목 중 하나이다. 집게벌레는 복부 맨 끝에 겸자처럼 생긴 핀서 모양의 독특한 꼬리털이 달려 있으며, 거의 쓰지 않는 짧은 앞날개 아래로 막질의 뒷날개(학명이 여기에서 유래하였다.)를 포개는 것이 전형적인 특징이다. 포유류에 기생하는 매우 작은 기생충도 있으며 아예 집게가 없기도 하다. 집게벌레는 남극을 제외한 모든 대륙에서 발견된다.", "url": "https://ko.wikipedia.org/wiki/%EC%A7%91%EA%B2%8C%EB%B2%8C%EB%A0%88%EB%AA%A9", "lang": "ko", "sci": ""}, "roach": {"title": "바퀴벌레", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/4/45/Blattella_germanica_1236168.jpg/500px-Blattella_germanica_1236168.jpg", "extract": "바퀴는 바퀴목(Blattodea)에 속하는 곤충의 총칭, 또는 독일바퀴(Blattella germanica) 한 종만을 부르는 말이다. 바퀴목에는 6과에 3500 여종의 바퀴가 있으며, 극지방과 해발 2000m 이상인 곳을 뺀 세계 전역에 분포하고 있다. 건물안에 있는 바퀴벌레는 해충으로 여긴다.", "url": "https://ko.wikipedia.org/wiki/%EB%B0%94%ED%80%B4%EB%B2%8C%EB%A0%88", "lang": "ko", "sci": "바퀴목에 속한 날개 있는 곤충들을 일컫는 말"}, "caddisfly": {"title": "날도래목", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/d/d7/Trichoptera_caddisfly_1.jpg/500px-Trichoptera_caddisfly_1.jpg", "extract": "날도래목은 작거나 중간 크기인 곤충으로서, 생김새가 나방과 비슷하다. 입은 씹는 데 적당하지만 어느 정도 퇴화되어 있다. 유충은 물속에 사는데, 보통 실을 내어 이동할 수 있는 통을 만든 후 그 안에서 생활한다. 종류에 따라 낙엽이나 자갈, 돌, 실 등을 이용하여 여러 모양의 튼튼한 집을 만드는데, 집 근처에 그물을 치고 먹이를 사냥하는 종류도 있다. 한편, 성충은 낮에는 물가의 돌이나 풀숲 등에 조용히 앉아 있다가, 해가 지면 날아다닌다. 유충은 물고기의 먹이가 되므로 생태계에 유익하다. 물날 도래·각날 도래·줄날 도래 등이 이에 속한다.", "url": "https://ko.wikipedia.org/wiki/%EB%82%A0%EB%8F%84%EB%9E%98%EB%AA%A9", "lang": "ko", "sci": ""}, "stonefly": {"title": "강도래목", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/4/4c/Eusthenia_sp.jpg/500px-Eusthenia_sp.jpg", "extract": "강도래목(Plecoptera)은 곤충의 한 목이다. 몸이 길고 연약하며 평평하다. 머리는 폭이 넓으며, 실모양의 길다란 촉각이 나 있다. 많은 체절로 이루어져 있고 대부분 두 쌍의 날개를 가지는데, 일반적으로 앞날개보다 뒷날개가 더 크다. 그러나 날개가 없는 것이나 퇴화된 것도 있다. 유충은 물 속에서 생활하는데, 촉각과 꼬리털이 성충의 것과 비슷하다. 강도래와 민강도래 등이 이에 속한다.", "url": "https://ko.wikipedia.org/wiki/%EA%B0%95%EB%8F%84%EB%9E%98%EB%AA%A9", "lang": "ko", "sci": ""}, "cabbage_cat": {"title": "紋白蝶終齡幼蟲 Final instar larvae of Pieris rapae crucivora - panoramio.jpg", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/b/bb/%E7%B4%8B%E7%99%BD%E8%9D%B6%E7%B5%82%E9%BD%A1%E5%B9%BC%E8%9F%B2_Final_instar_larvae_of_Pieris_rapae_crucivora_-_panoramio.jpg/500px-%E7%B4%8B%E7%99%BD%E8%9D%B6%E7%B5%82%E9%BD%A1%E5%B9%BC%E8%9F%B2_Final_instar_larvae_of_Pieris_rapae_crucivora_-_panoramio.jpg", "extract": "", "url": "https://commons.wikimedia.org/wiki/File:%E7%B4%8B%E7%99%BD%E8%9D%B6%E7%B5%82%E9%BD%A1%E5%B9%BC%E8%9F%B2_Final_instar_larvae_of_Pieris_rapae_crucivora_-_panoramio.jpg", "lang": "commons", "sci": ""}, "swallow_cat": {"title": "Papilio xuthus Larva 2011-07-01.jpg", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/d/da/Papilio_xuthus_Larva_2011-07-01.jpg/500px-Papilio_xuthus_Larva_2011-07-01.jpg", "extract": "", "url": "https://commons.wikimedia.org/wiki/File:Papilio_xuthus_Larva_2011-07-01.jpg", "lang": "commons", "sci": ""}, "silkworm": {"title": "누에나방", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/0/0f/Silkworms3000px.jpg/500px-Silkworms3000px.jpg", "extract": "누에나방(Bombyx mori, 문화어: 누에나비)은 누에나방과의 나방이다. 누에나방의 애벌레는 누에라고 하고, 이를 한자로는 잠(蠶)이라고 한다. 하늘에서 내린 벌레라는 의미로 천충(天蟲)이라고 부르기도 한다.", "url": "https://ko.wikipedia.org/wiki/%EB%88%84%EC%97%90%EB%82%98%EB%B0%A9", "lang": "ko", "sci": "명주실을 얻는 데 쓰이는 나방의 종류"}, "spider": {"title": "무당거미", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/1/14/Nephila-clavata-f-eating-and-2-m.jpg/500px-Nephila-clavata-f-eating-and-2-m.jpg", "extract": "무당거미(학명: Trichonephila clavata)는 거미목의 무당거미과, 무당거미속에 속하는 거미이다. 여름에서 가을에 걸쳐 큰 그물을 치는 가장 눈에 띄는 거미다. 큰 그물을 치는 거미 중에서 호랑거미와 함께 잘 알려진 거미다. 호랑거미와 혼동되는 경우가 많지만 생물학적으로 다소 먼 관계이다. 호랑거미보다 훨씬 크고 복잡한 거미줄을 치며 거미줄은 눈에 잘 띄는 노란색을 띈다.", "url": "https://ko.wikipedia.org/wiki/%EB%AC%B4%EB%8B%B9%EA%B1%B0%EB%AF%B8", "lang": "ko", "sci": ""}, "jumping_spider": {"title": "Jumping spider", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/6/6d/PlatycryptusUndatusFemale.jpg/500px-PlatycryptusUndatusFemale.jpg", "extract": "Jumping spiders are spiders in the family Salticidae, with almost 700 genera and around 7,000 described species, making it the largest family of spiders – comprising 13% of spider species. Jumping spiders have some of the best vision among arthropods — being capable of stereoptic color vision — and use sight in courtship, hunting, and navigation.", "url": "https://en.wikipedia.org/wiki/Jumping_spider", "lang": "en", "sci": "Family of spiders"}, "snail": {"title": "달팽이", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/6/6d/Common_snail.jpg/500px-Common_snail.jpg", "extract": "달팽이(Land snail)는 복족류 연체동물 중 달팽이과에 속하는 동물을 통틀어 일컫는 말이다. 영어 단어 'snail'은 우렁이, 골뱅이, 고둥 등 패각을 가진 수생 복족류를 모두 포함하는 넓은 의미로 쓰이지만, 한국어에서 '달팽이'는 주로 병안목에 속하는 폐를 가진 육상 복족류 중 둥근 패각(껍데기)을 가진 종류 만을 지칭한다. 패각이 없는 육상 복족류는 보통 '민달팽이'라 부른다.", "url": "https://ko.wikipedia.org/wiki/%EB%8B%AC%ED%8C%BD%EC%9D%B4", "lang": "ko", "sci": "복족류 연체동물 중 와선형의 패각을 가지고 있는 동물을 가리키는 말"}, "centipede": {"title": "순각류", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/6/66/Centipede.jpg/500px-Centipede.jpg", "extract": "순각강(脣脚綱, 학명 : Chilopoda)은 절지동물문의 한 강이다. 지네와 그리마를 포함하며 열대지방과 온대지방에 광범위하게 분포한다. 대부분 돌 밑, 흙 속 나무 및 등 습기 찬 곳에 서식하며 약 8,000종이 알려져 있다. 그리고 지네의 경우는 마당이나 주로 산이나 나무 같은 식물이 많은 곳에서 살지만, 독이 있어 사람들에게 해를 끼쳐서 심하면 죽는 경우가 있으니 조심해야 한다.", "url": "https://ko.wikipedia.org/wiki/%EC%88%9C%EA%B0%81%EB%A5%98", "lang": "ko", "sci": "절지동물문의 한 강"}, "pillbug": {"title": "공벌레", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/4/4e/Armadillidium_vulgare_001.jpg/500px-Armadillidium_vulgare_001.jpg", "extract": "공벌레(pillbug, Armadillidium vulgare) 또는 콩벌레는 쥐며느리의 일종이다. 돌 밑이나 축축한 낙엽 더미 또는 썩은 나무에서 산다. 몸은 머리와 일곱 개의 마디로 된 가슴, 다섯 개의 배로 나뉜다. 더듬이는 두 쌍이 있으나, 첫 번째 더듬이는 퇴화하여 보이지 않는다. 두 번째 더듬이는 머리 앞으로 튀어나와서 중간에 세 번 꺾인다. 공벌레가 몸을 둥글게 마는 것은 자기 방어일 뿐만 아니라 몸이 건조해 지는 것을 막기 위해서이다. 공벌레는 쥐며느리와 생김새가 비슷하다. 공벌레는 위협을 느끼면 몸을 둥글게 말지만 쥐며느리는 몸을 말지 못한다. 그리고 또한 먹이는 주로 낙엽을 먹는다.", "url": "https://ko.wikipedia.org/wiki/%EA%B3%B5%EB%B2%8C%EB%A0%88", "lang": "ko", "sci": ""}, "earthworm": {"title": "지렁이", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/3/30/Regenwurm1.jpg/500px-Regenwurm1.jpg", "extract": "지렁이는 지렁이아목에 딸린 환형동물의 총칭이다.", "url": "https://ko.wikipedia.org/wiki/%EC%A7%80%EB%A0%81%EC%9D%B4", "lang": "ko", "sci": "지렁이아목 또는 지렁이목의 환형동물들을 총칭하는 이름"}, "stag_true": {"title": "사슴벌레", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/e/e4/Lucanus70.JPG/500px-Lucanus70.JPG", "extract": "사슴벌레(학명: Lucanus maculifemoratus dybowskyi)는 사슴벌레과에 속하는 곤충이다. 큰턱을 포함한 수컷의 몸길이는 50~80mm이고, 암컷의 몸길이는 25~42mm이다. 한국, 일본, 중국, 러시아, 대만에 분포하며 성충은 늦은 봄부터 초가을까지 볼 수 있다. 주로 참나무가 많은 곳에서 생활하며 주로 나무의 수액을 먹는다. 사슴벌레속(Genus Lucanus)의 유일한 한국 서식종이며 홍다리사슴벌레와 마찬가지로 저온 지역을 좋아하는 고산성 종이다. 한국에 사는 다른 사슴벌레 종류들과의 가장 큰 차이점은 마치 코끼리의 귀처럼 돌출되어 있는 수컷의 머리 뒤 부분이다. 유충은 몸의 색이 하얀색이며 잘 썩은 참나무류의 고목과 같이 습한 곳에 서식한다. 유충이 성충이 되는 데는 약 2~3년이 걸린다. 성충은 5~9월까지 볼 수 있으며, 참나무류의 수액에 모여든다. 밤에는 불빛에 날아든다.\n참고로 수명은 톱사슴벌레와 비슷하다. 2013년 Huang & Chen은 서적 <Stag Beetles of China Ⅱ>에서, dybowskyi 아종을 종으로 변경하고, taiwanus, lhasaensis 아종을 추가하였으나, 아직 학자들 간의 의견이 분분하다.", "url": "https://ko.wikipedia.org/wiki/%EC%82%AC%EC%8A%B4%EB%B2%8C%EB%A0%88", "lang": "ko", "sci": "사슴벌레과에 속하는 곤충"}, "stag_small": {"title": "Dorcus rectus 01.JPG", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/2/22/Dorcus_rectus_01.JPG/500px-Dorcus_rectus_01.JPG", "extract": "", "url": "https://commons.wikimedia.org/wiki/File:Dorcus_rectus_01.JPG", "lang": "commons", "sci": ""}, "stag_redleg": {"title": "홍다리사슴벌레", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/6/64/Dorcus_rubrofemoratus.jpg/500px-Dorcus_rubrofemoratus.jpg", "extract": "홍다리사슴벌레는 한국, 중국, 일본, 타이완, 미얀마에 분포하는 사슴벌레과의 곤충이다. 한국에서는 주로 강원도나 그 부근에서 발견되는 다소 희귀한 사슴벌레의 일종으로, 저온 지역을 좋아하는 고산성 종이다. 몸길이는 23~38mm이다. 수컷의 큰턱은 길게 앞으로 뻗으며, 모양이 중앙에서 바깥으로 부푼 모습이다. 몸은 검은색으로 별다른 무늬가 없으나 이름처럼 다리 안쪽이 붉은 것이 특징이며 버드나무를 좋아하는 특이한 사슴벌레다. 애완곤충으로 현재 활용 가치를 가질 뿐만 아니라 심미적 가치 등 생태적 가치가 높다.홍다리사슴벌레는 고산종이다.", "url": "https://ko.wikipedia.org/wiki/%ED%99%8D%EB%8B%A4%EB%A6%AC%EC%82%AC%EC%8A%B4%EB%B2%8C%EB%A0%88", "lang": "ko", "sci": ""}, "stag_twospot": {"title": "두점박이사슴벌레", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/d/d8/Prosopocoilus_astacoides_%287271483300%29.jpg/500px-Prosopocoilus_astacoides_%287271483300%29.jpg", "extract": "두점박이사슴벌레는 사슴벌레과의 곤충이다. 한국(제주도), 중국, 대만, 몽골에 분포하며 야간에 등불에 잘 모인다. 종종 나무진에 모인다. 환경부 멸종위기 야생생물 II급, 국가적색목록 취약(VU)종으로 지정되어 법적 보호를 받고 있는 곤충이다. 이를 채집할 시 법에 따라 처벌할 수 있다. 톱사슴벌레와 매우 가까운 친척 종이지만 열대산 사슴벌레처럼 노란 몸에 점무늬가 있는 게 특징이다. 앞가슴등판 양 가장자리에 검은 점이 있는 것이 특징이며, 두점박이사슴벌레라는 국명도 이에서 유래한 것이다. 큰턱은 공통적으로 약하게 휘어지나 내치의 형태는 아종에 따라 크게 차이를 보인다. 암컷의 몸은 수컷과 동일한 색이며 전체적으로 둥그런 모양으로 수컷과 같이 앞가슴등판 양 가장자리에 검은 점이 있다. 히말라야산맥 일대부터 인도차이나반도를 걸쳐 동아시아 일부 지역까지 광범위하게 분포한다. 현재 2026년 법 개정으로 불법이였던 환경부에서 승인한 합법 농가에서 키운 암컷과 유충을 키우는 것이 합법화 되면서 합법 농가에서 키운 암컷과 유충 키우는 것도 가능하다. 물론 야생종은 불법이다.", "url": "https://ko.wikipedia.org/wiki/%EB%91%90%EC%A0%90%EB%B0%95%EC%9D%B4%EC%82%AC%EC%8A%B4%EB%B2%8C%EB%A0%88", "lang": "ko", "sci": ""}, "stag_mini": {"title": "Aegus laevicollis formosae (42654900515).jpg", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/1/1e/Aegus_laevicollis_formosae_%2842654900515%29.jpg/500px-Aegus_laevicollis_formosae_%2842654900515%29.jpg", "extract": "", "url": "https://commons.wikimedia.org/wiki/File:Aegus_laevicollis_formosae_(42654900515).jpg", "lang": "commons", "sci": ""}, "whirligig": {"title": "물맴이과", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/2/23/Gyrinus_natator.JPG/500px-Gyrinus_natator.JPG", "extract": "물맴이과는 수생 딱정벌레의 한 분류이다. 수면을 맴돌기 때문에 물맴이라고 불린다.", "url": "https://ko.wikipedia.org/wiki/%EB%AC%BC%EB%A7%B4%EC%9D%B4%EA%B3%BC", "lang": "ko", "sci": ""}, "backswimmer": {"title": "송장헤엄치게", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/9/96/Notonecta_triguttata_matumomusi.JPG/500px-Notonecta_triguttata_matumomusi.JPG", "extract": "송장헤엄치게 또는 송장헤엄치개는 물속에 사는 수서곤충이다. 몸을 뒤집어서 헤엄치는 모습이 마치 송장과 같아서 송장헤엄치게라고 불린다. 주로 연못이나 개울에 살며\n작은 물고기나 올챙이, 수면에 떨어진 곤충들을 잡아먹는다.", "url": "https://ko.wikipedia.org/wiki/%EC%86%A1%EC%9E%A5%ED%97%A4%EC%97%84%EC%B9%98%EA%B2%8C", "lang": "ko", "sci": ""}, "sea_skater": {"title": "Halobates", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/b/bd/Aggregation_of_sea_skaters.png/500px-Aggregation_of_sea_skaters.png", "extract": "Halobates, colloquially the sea skaters or ocean striders, are an insect genus with over 40 species of water striders. Most Halobates species are coastal and typically found in sheltered, coastal marine habitats, but five live on the surface of the open ocean and only occur near the coast when storms blow them ashore. These are the only known truly oceanic, offshore insects. They are found in tropical and subtropical marine habitats around the world, with a single species recorded in rivers a few kilometers upstream from the ocean. Halobates are generally very abundant where they are found.", "url": "https://en.wikipedia.org/wiki/Halobates", "lang": "en", "sci": "Genus of true bugs"}, "kelp_fly": {"title": "Coelopidae", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/a/a9/Kelp_Fly_%28Coelopa%29.jpg/500px-Kelp_Fly_%28Coelopa%29.jpg", "extract": "The Coelopidae or kelp flies are a family of Acalyptratae flies, they are sometimes also called seaweed flies, although both terms are used for a number of seashore Diptera. Fewer than 40 species occur worldwide. The family is found in temperate areas, with species occurring in the southern Afrotropical, Holarctic, and Australasian regions.", "url": "https://en.wikipedia.org/wiki/Coelopidae", "lang": "en", "sci": "Family of flies"}, "sand_darkling": {"title": "Tenebrionidae - Phaleria bimaculata.JPG", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/a/ad/Tenebrionidae_-_Phaleria_bimaculata.JPG/500px-Tenebrionidae_-_Phaleria_bimaculata.JPG", "extract": "", "url": "https://commons.wiki
