  if (net) { const k = net.t / .35; ctx.save(); ctx.translate(net.x - cam, net.y); ctx.rotate(-1.2 + k * 1.6); ctx.strokeStyle = '#8A5A2B'; ctx.lineWidth = 6; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, 90); ctx.stroke(); ctx.strokeStyle = '#444'; ctx.lineWidth = 3; ctx.beginPath(); ctx.ellipse(0, -16, 34, 22, 0, 0, 6.3); ctx.stroke(); ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 1; for (let i = -3; i <= 3; i++) { ctx.beginPath(); ctx.moveTo(i * 9, -36); ctx.lineTo(i * 9, 4); ctx.stroke(); ctx.beginPath(); ctx.moveTo(-32, -16 + i * 6); ctx.lineTo(32, -16 + i * 6); ctx.stroke(); } ctx.restore(); }
  for (const p of puffs) { ctx.globalAlpha = 1 - p.t / p.life; ctx.fillStyle = p.c; ctx.fillRect(p.x - cam, p.y, p.s, p.s); } ctx.globalAlpha = 1;
  for (const m of misses) { ctx.globalAlpha = 1 - m.t / .7; ctx.font = '20px "Jua",sans-serif'; ctx.textAlign = 'center'; ctx.lineWidth = 4; ctx.strokeStyle = '#000'; ctx.strokeText('휙~', m.x - cam, m.y - m.t * 40); ctx.fillStyle = '#FFF'; ctx.fillText('휙~', m.x - cam, m.y - m.t * 40); } ctx.globalAlpha = 1;
}
function renderMap() {
  const mp = $('map'); $('mapView').style.left = (cam / WW * 100) + '%'; $('mapView').style.width = (W / WW * 100) + '%';
  const dots = [...mp.querySelectorAll('b')], live = bugs.filter(u => !u.leave);
  for (let i = dots.length - 1; i >= live.length; i--) dots[i].remove();
  for (let i = dots.length; i < live.length; i++) mp.appendChild(document.createElement('b'));
  [...mp.querySelectorAll('b')].forEach((d, i) => { d.style.left = `calc(${live[i].x / WW * 100}% - 2px)`; });
  $('panL').disabled = cam <= 2; $('panR').disabled = cam >= WW - W - 2;
}

// 입력: 끌기 = 화면 이동, 탭 = 잡기
let drag = null;
const toWorld = (px, py) => { const r = cv.getBoundingClientRect(); return [(px - r.left) / r.width * W, (py - r.top) / r.height * H]; };
cv.addEventListener('pointerdown', e => { e.preventDefault(); cv.setPointerCapture(e.pointerId); const [x, y] = toWorld(e.clientX, e.clientY); drag = { x0: e.clientX, cam0: cam, moved: false, x, y }; });
cv.addEventListener('pointermove', e => { if (!drag) return; const r = cv.getBoundingClientRect(); const dx = (e.clientX - drag.x0) / r.width * W; if (Math.abs(dx) > 10) drag.moved = true; if (drag.moved) { cam = clamp(drag.cam0 - dx, 0, WW - W); camTarget = cam; } });
cv.addEventListener('pointerup', e => { if (!drag) return; if (!drag.moved) tapAt(drag.x, drag.y); drag = null; });
cv.addEventListener('pointercancel', () => { drag = null; });
$('panL').addEventListener('click', () => { camTarget = clamp(camTarget - W * .7, 0, WW - W); beep(SND.tap); });
$('panR').addEventListener('click', () => { camTarget = clamp(camTarget + W * .7, 0, WW - W); beep(SND.tap); });
function tapAt(x, y) {
  const wx = x + cam; net = { x: wx, y: y + 20, t: 0 };
  let best = null, bd = 1e9;
  for (const u of bugs) { const d = Math.hypot(u.x - wx, u.y + u.hop - y); if (d < 54 && d < bd) { bd = d; best = u; } }
  if (!best) { misses.push({ x: wx, y, t: 0 }); beep(SND.miss); return; }
  bugs.splice(bugs.indexOf(best), 1);
  for (let i = 0; i < 16; i++) puffs.push({ x: best.x, y: best.y, vx: rnd(-120, 120), vy: rnd(-200, -40), t: 0, life: rnd(.4, .8), s: rnd(3, 6), c: pick(['#FFD54A', '#FF8A3D', '#FF8FB1', '#7CC24A', '#5ED3F3', '#FFF']) });
  caught(best.b);
}

// ======================= 잡았을 때 =======================
function caught(b) {
  const first = !S.caught[b.id];
  S.caught[b.id] = (S.caught[b.id] || 0) + 1; S.total++;
  S.recent = [b.id, ...S.recent.filter(x => x !== b.id)].slice(0, 30);
  if (first) S.seen.push(b.id);
  save(); renderHud(); renderStrip(); renderGrid(); renderPlaces();
  beep(first ? SND.new : SND.catch); if (first) confetti();
  showCard(b, first ? 'new' : 'again');
}
window.photoFail = img => { const hero = img.parentElement, ins = hero.querySelector('.inset'); hero.className = 'hero'; if (ins) { const il = ins.querySelector('img'); ins.remove(); img.replaceWith(il); } else img.remove(); const cr = hero.nextElementSibling; if (cr && cr.classList.contains('credit')) cr.remove(); };
function showCard(b, mode) {
  const box = $('mbox'); const n = S.caught[b.id] || 0, ph = PHOTOS[b.id];
  box.innerHTML = `
    ${mode === 'new' ? '<span class="badge">🎉 새로운 곤충 발견!</span>' : mode === 'again' ? '<span class="badge again">또 잡았어요!</span>' : ''}
    <div class="mbody">
    ${ph && ph.img ? `<div class="hero photo"><img class="ph" src="${ph.img}" alt="${b.name} 사진" onerror="photoFail(this)"><div class="inset"><img src="${bugURL(b.id)}" alt=""></div></div><div class="credit">사진·설명 출처: <a href="${ph.url || '#'}" target="_blank" rel="noopener">위키백과</a></div>` : `<div class="hero"><img src="${bugURL(b.id)}" alt="${b.name}"></div>`}
    <h2 class="disp">${b.name} <span class="grp${b.notInsect ? ' not' : ''}">${b.grp}</span>${b.rare === 2 ? ' <span title="아주 드물어요">⭐</span>' : ''}</h2>
    ${ph && ph.sci && ph.lang === 'ko' ? `<div class="sci">${ph.sci}</div>` : ''}
    <div class="rows">
      <div class="r wide"><b>크기</b><span>${b.size}</span></div>
      <div class="r"><b>먹이</b><span>${b.food}</span></div>
      <div class="r"><b>사는 곳</b><span>${b.home}</span></div>
      <div class="r wide"><b>언제 · 어디서</b><span>${b.time === 'night' ? '🌙 밤에 나와요' : b.time === 'day' ? '☀️ 낮에 나와요' : '☀️🌙 낮과 밤 모두'} · ${b.place.map(p => PLACES.find(x => x.id === p).name).join('·')}</span></div>
      <div class="r wide"><b>한살이</b><span>${lifecycle(b)}</span></div>
    </div>
    <div class="fact">${b.fact}</div>
    ${ph && ph.extract && ph.lang === 'ko' ? `<details><summary>📖 더 알아보기</summary><p>${ph.extract.replace(/</g, '&lt;')}</p>${ph.url ? `<a class="more" href="${ph.url}" target="_blank" rel="noopener">위키백과에서 더 읽기 →</a>` : ''}</details>` : ''}
    <div class="cnt">지금까지 ${n}마리 잡았어요</div>
    </div>
    <button class="close" id="mClose">${mode === 'new' ? '도감에 넣기!' : '좋아요!'}</button>`;
  $('modal').hidden = false; $('mClose').onclick = () => { $('modal').hidden = true; beep(SND.tap); };
}
$('modal').addEventListener('click', e => { if (e.target === $('modal')) $('modal').hidden = true; });
function confetti() {
  const c = $('confetti'), x = c.getContext('2d'); const r = c.getBoundingClientRect(); c.width = r.width; c.height = r.height;
  const ps = Array.from({ length: 90 }, () => ({ x: rnd(0, c.width), y: rnd(-c.height * .3, 0), vx: rnd(-40, 40), vy: rnd(80, 220), s: rnd(5, 10), c: pick(['#FFD54A', '#FF8A3D', '#FF8FB1', '#7CC24A', '#5ED3F3', '#B48CFF']), rot: rnd(0, 6.3), vr: rnd(-4, 4) }));
  let t0 = performance.now();
  (function step(now) { const dt = Math.min(.05, (now - t0) / 1000); t0 = now; x.clearRect(0, 0, c.width, c.height); let alive = false;
    for (const p of ps) { p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt; if (p.y < c.height) alive = true; x.save(); x.translate(p.x, p.y); x.rotate(p.rot); x.fillStyle = p.c; x.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); x.restore(); }
    if (alive) requestAnimationFrame(step); else x.clearRect(0, 0, c.width, c.height); })(t0);
}

// ======================= UI =======================
let toastT;
function toast(msg) { const el = $('toast'); el.textContent = msg; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => el.hidden = true, 2500); }
function renderHud() {
  const n = S.seen.length; $('progText').textContent = `${n}/${BUGS.length}`; $('progBar').style.width = (n / BUGS.length * 100) + '%';
  $('sndBtn').textContent = S.sound ? '🔊' : '🔇'; $('todayCnt').textContent = S.total ? `모두 ${S.total}마리` : '';
  if (n === BUGS.length && !S.done) { S.done = true; save(); setTimeout(() => { confetti(); toast('🏆 도감을 모두 채웠어요! 곤충 박사님!'); }, 600); }
}
function renderPlaces() {
  const box = $('places'); box.innerHTML = '';
  PLACES.forEach(p => { const b = document.createElement('button'); b.className = 'place' + (p.id === S.place ? ' on' : ''); const got = BUGS.filter(x => x.place.includes(p.id) && S.caught[x.id]).length, all = BUGS.filter(x => x.place.includes(p.id)).length;
    b.innerHTML = `<img class="px" src="${icon(p.id)}" alt="">${p.name}<small>${got}/${all}</small>`; b.addEventListener('click', () => { if (S.place !== p.id) { S.place = p.id; bugs = []; spawnT = .3; save(); renderPlaces(); renderScene(); beep(SND.tap); } }); box.appendChild(b); });
}
function renderScene() { const p = placeOf(); $('placeName').textContent = (S.night ? '밤의 ' : '') + p.name; $('placeHint').textContent = p.hint; $('dayBtn').textContent = S.night ? '🌙 밤' : '☀️ 낮'; }
function renderStrip() {
  const st = $('strip'); st.innerHTML = ''; $('stripEmpty').hidden = S.recent.length > 0;
  S.recent.forEach(id => { const b = BUG[id]; if (!b) return; const d = document.createElement('button'); d.className = 'mini'; d.innerHTML = `<div class="b"><img src="${bugURL(id)}" alt=""></div>${b.name}`; d.addEventListener('click', () => showCard(b, 'view')); st.appendChild(d); });
}
let filter = 'all';
function renderGrid() {
  const fs = $('filters'); if (!fs.children.length) {
    [['all', '전체'], ['meadow', '풀밭'], ['forest', '숲'], ['pond', '연못'], ['yard', '마당'], ['sea', '바다'], ['mountain', '산'], ['night', '🌙 밤'], ['rare', '⭐ 희귀'], ['not', '곤충 아님'], ['got', '✅ 잡은 것']].forEach(([k, label]) => { const c = document.createElement('button'); c.className = 'chip' + (k === filter ? ' on' : ''); c.dataset.k = k; c.textContent = label; c.addEventListener('click', () => { filter = k; [...fs.children].forEach(x => x.classList.toggle('on', x.dataset.k === k)); renderGrid(); }); fs.appendChild(c); });
  }
  const list = BUGS.filter(b => filter === 'all' || (filter === 'night' ? b.time !== 'day' : filter === 'rare' ? b.rare === 2 : filter === 'not' ? b.notInsect : filter === 'got' ? S.caught[b.id] : b.place.includes(filter)));
  const grid = $('grid'); grid.innerHTML = '';
  list.forEach(b => { const n = S.caught[b.id] || 0, known = n > 0; const c = document.createElement('button'); c.className = 'card' + (known ? '' : ' unknown') + (known && S.recent[0] === b.id && n === 1 ? ' new' : '');
    c.innerHTML = `${b.rare === 2 ? '<span class="rare">⭐</span>' : ''}${known ? `<span class="cnt">${n}</span>` : ''}<img src="${bugURL(b.id)}" alt="" loading="lazy"><div class="nm">${known ? b.name : '???'}</div>`;
    c.addEventListener('click', () => { if (known) showCard(b, 'view'); else { toast(`${b.place.map(p => PLACES.find(x => x.id === p).name).join('·')}에서 ${b.time === 'night' ? '밤에 ' : b.time === 'day' ? '낮에 ' : ''}찾아보세요!`); beep(SND.tap); } });
    grid.appendChild(c); });
}
function showView(v) { document.querySelectorAll('.view').forEach(x => x.hidden = x.id !== 'v-' + v); document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.v === v)); }
const scroller = $('scroller');
function setPH() { document.documentElement.style.setProperty('--ph', $('phone').clientHeight + 'px'); }
new ResizeObserver(setPH).observe($('phone')); setPH();

// ======================= 시작 =======================
load();
$('logo').src = icon('bug'); document.querySelectorAll('[data-ico]').forEach(img => img.src = icon(img.dataset.ico));
BUGS.forEach(b => bugImg(b.id));
renderHud(); renderPlaces(); renderScene(); renderStrip(); renderGrid();
$('dayBtn').addEventListener('click', () => { S.night = !S.night; bugs = []; spawnT = .3; save(); renderScene(); beep(SND.tap); toast(S.night ? '🌙 밤이 되었어요. 밤에만 나오는 곤충을 찾아보세요!' : '☀️ 아침이 밝았어요!'); });
$('sndBtn').addEventListener('click', () => { S.sound = !S.sound; save(); renderHud(); beep(SND.tap); });
document.querySelectorAll('.tab').forEach(tb => tb.addEventListener('click', () => { const same = tb.classList.contains('on'); showView(tb.dataset.v); beep(SND.tap); if (tb.dataset.v === 'ex' && same) scroller.scrollTo({ top: 0 }); else if (tb.dataset.v === 'dex') scroller.scrollTo({ top: tb.parentElement.offsetTop }); }));
requestAnimationFrame(tick);
window.__dbg = { bugs: () => bugs, tap: tapAt, time: () => t, cam: () => cam };
setTimeout(() => { $('hint').style.opacity = 0; }, 7000);
})();
</script>
