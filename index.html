mm)이다.", "url": "https://ko.wikipedia.org/wiki/%EB%8D%B0%EC%8A%A4%EC%8A%A4%ED%86%A0%EC%BB%A4", "lang": "ko", "sci": ""}, "fog_beetle": {"title": "Stenocara gracilipes", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/8/8e/Stenocara_gracilipes.jpg/500px-Stenocara_gracilipes.jpg", "extract": "Stenocara gracilipes, the racingstripe darkling beetle, is a species of beetle that is native to the Namib Desert in southern Africa. This is one of the most arid areas of the world, receiving only 1.4 centimetres (0.55 in) of rain per year. The beetle is able to survive by collecting water on its bumpy back surface from early morning fogs.", "url": "https://en.wikipedia.org/wiki/Stenocara_gracilipes", "lang": "en", "sci": "Species of beetle"}, "sacred_scarab": {"title": "Scarabaeus sacer", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/0/0c/Scarabaeus.sacer.jpg/500px-Scarabaeus.sacer.jpg", "extract": "Scarabaeus sacer, common name sacred scarab, is the type species of the genus Scarabaeus and the family Scarabaeidae. This dung beetle is native to southern Europe, North Africa, West Asia, and was venerated in ancient Egypt.", "url": "https://en.wikipedia.org/wiki/Scarabaeus_sacer", "lang": "en", "sci": "Species of beetle"}, "camel_spider": {"title": "낙타거미목", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/3/32/Sunspider.jpg/500px-Sunspider.jpg", "extract": "낙타거미목(영어: Solifugae) 또는 피일목은 동물계, 절지동물문, 협각아문, 거미강에 속하는, '태양거미(영어: Sun spider)' 또는 '바람전갈(영어: Wind scorpion)', '낙타거미(영어: Camel spiders)'라고도 불리는 동물계의 한 목이다. 이 목은 153개의 속과 1,000 종이 넘는 종들을 포함한다. 이름에 거미가 들어감에도 불구하고, 완전한 거미나 완전한 전갈의 형태와는 차이를 보인다. 대부분의 거미들과 비슷하게 낙타거미 또한 두흉부와 후체부에 두개의 합체절이 있다. 두흉부는 종 대부분에서 눈에 띄게 큰 두 개의 앞쪽 끝 협각을 지탱한다. 협각은 턱의 역할을 하며 많은 종들에서 울음소리를 내기 위해 사용된다. 전갈과 다르게 꼬리에 세번째 협각을 갖지 않는다. 피일목의 대부분의 종들은 건조한 기후에서 서식하며, 육지에서 서식하는 절지동물과 작은 동물들을 먹이로한다. 가장 큰 종은 다리를 포함하여 12-15cm까지 자란다. 많은 도시전설에서 낙타거미의 크기와 속도, 인간에 대한 잠재적인 위험을 과장해서 말하는데, 이것은 사실과는 다른, 어디까지나 도시전설의 이야기이다.", "url": "https://ko.wikipedia.org/wiki/%EB%82%99%ED%83%80%EA%B1%B0%EB%AF%B8%EB%AA%A9", "lang": "ko", "sci": "동물계의 한 목"}, "tarantula": {"title": "타란툴라", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/3/31/Lasiodora_parahybana_2009_G03.jpg/500px-Lasiodora_parahybana_2009_G03.jpg", "extract": "타란툴라(tarantula)는 짐승빛거미과(또는 대형열대거미과, Theraphosidae)에 속하는, 털이 북슬북슬하고 몸집이 큰 거미의 총칭이다. 2023년 12월 기준, 166속 1,100종이 동정되어 있다. '타란툴라'라는 단어는 보통 짐승빛거미과의 구성종들을 뜻하지만, 원실젖거미하목으로 같이 분류되어 있는 이외 다른 종들도 흔히 '타란툴라'로 불리거나 '타란툴라붙이'로 불린다.", "url": "https://ko.wikipedia.org/wiki/%ED%83%80%EB%9E%80%ED%88%B4%EB%9D%BC", "lang": "ko", "sci": "짐승빛거미과에 속하는 거미"}, "silver_ant": {"title": "사하라은개미", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/8/8d/Saharan_Silver_Ants_Erg_Chebbi_2011.jpg/500px-Saharan_Silver_Ants_Erg_Chebbi_2011.jpg", "extract": "사하라은개미는 사하라 사막에 살아가는 개미의 종류다. 사막개미와 사하라사막개미와는 근연종이다.", "url": "https://ko.wikipedia.org/wiki/%EC%82%AC%ED%95%98%EB%9D%BC%EC%9D%80%EA%B0%9C%EB%AF%B8", "lang": "ko", "sci": ""}, "honeypot_ant": {"title": "꿀단지개미", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/c/c2/HoneyAnt.jpg/500px-HoneyAnt.jpg", "extract": "꿀개미Honey ants라고도 불리는 꿀단지개미Honeypot ants는 다른 일개미들한테 액상형의 먹이를 복부가 크게 부풀어오를 정도로 받아먹는 전문화된 일개미들(repletes, plerergates, rotunds)이 있는 개미들이다. 이후 다른 개미들은 이 개미들한테 영양분을 받아먹는다. 이 개미들은 살아있는 식량창고의 역할을 한다. 꿀단지개미라고 불리는 개미들은 왕개미속, 미르메코시스투스속과 같은 몇몇 속들에 속해 있다. 꿀단지개미는 1881년에 헨리 크리스토퍼 맥쿡이 최초로 기록했으며 1908년에 윌리엄 모턴 휠러가 좀 더 자세히 묘사하였다.", "url": "https://ko.wikipedia.org/wiki/%EA%BF%80%EB%8B%A8%EC%A7%80%EA%B0%9C%EB%AF%B8", "lang": "ko", "sci": ""}, "desert_centipede": {"title": "Scolopendra heros", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/0/0b/Scolopendra_heros.jpg/500px-Scolopendra_heros.jpg", "extract": "Scolopendra heros, commonly known as the Arizona desert centipede, giant desert centipede, giant Sonoran centipede, Texas black-tailed centipede, Texas redheaded centipede, and giant redheaded centipede, is a species of North American centipede found in the Southwestern United States and Northern Mexico.", "url": "https://en.wikipedia.org/wiki/Scolopendra_heros", "lang": "en", "sci": "Species of centipede"}, "thorny_devil": {"title": "가시도마뱀", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/7/72/Thornydevil.jpg/500px-Thornydevil.jpg", "extract": "가시도마뱀(Thorny lizard)은 도깨비도마뱀(Thorny devil)이라고도 불리며 아가마과에 속하는 도마뱀의 일종이다. 이 종은 오스트레일리아의 토착종이며 가시도마뱀속(Moloch)의 유일한 종이다. 총 길이는 21cm까지 자라며 암컷이 수컷보다 일반적으로 더 크다.", "url": "https://ko.wikipedia.org/wiki/%EA%B0%80%EC%8B%9C%EB%8F%84%EB%A7%88%EB%B1%80", "lang": "ko", "sci": ""}, "desert_locust": {"title": "사막메뚜기", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/f/f2/SGR_laying.jpg/500px-SGR_laying.jpg", "extract": "사막메뚜기(Schistocerca gregaria)는 메뚜기의 일종으로, 주기적으로 떼를 짓는 메뚜기목 메뚜기과의 짧은뿔메뚜기이다. 주로 북부 및 동부 아프리카, 아라비아반도, 그리고 서남아시아의 사막과 건조 지대에서 발견된다. 개체수가 급증하는 해에는 북쪽으로는 남유럽 일부 지역, 남쪽으로는 동부 아프리카, 동쪽으로는 북부 인도까지 서식지가 확장될 수 있다. 사막메뚜기는 주기적으로 몸의 형태가 변하며, 환경 조건에 따라 여러 세대에 걸쳐 혼자 사는 짧은 날개를 가진 높은 번식력의 비이동성 형태에서, 새로운 지역으로 멀리 이동할 수 있는 무리 생활을 하는 긴 날개의 이동성 형태로 변할 수 있다. 따라서 일부 해에는 메뚜기 재앙을 형성하여 새로운 지역을 침범하고, 작물을 포함한 모든 식생을 소비할 수 있으며, 다른 시기에는 소수가 눈에 띄지 않게 살 수 있다.", "url": "https://ko.wikipedia.org/wiki/%EC%82%AC%EB%A7%89%EB%A9%94%EB%9A%9C%EA%B8%B0", "lang": "ko", "sci": "메뚜기과에 속한 아종"}, "wheel_spider": {"title": "Wheel spider", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/1/14/Carparachne_aureoflava_110456212.jpg/500px-Carparachne_aureoflava_110456212.jpg", "extract": "The wheel spider or golden wheel spider is a huntsman spider native to the Namib Desert of Southern Africa. This spider is distinct from Leucorchestris arenicola, a spider sharing the same common name and found in the same locale. The spider escapes parasitic pompilid wasps by flipping onto its side and cartwheeling down sand dunes at speeds of up to 44 turns per second.", "url": "https://en.wikipedia.org/wiki/Wheel_spider", "lang": "en", "sci": "Huntsman spider native to the Namib Desert"}, "tarantula_hawk": {"title": "Tarantula hawk", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/d/db/Tarantula_Hawk%2C_Southeastern_Colorado_P1270150b.jpg/500px-Tarantula_Hawk%2C_Southeastern_Colorado_P1270150b.jpg", "extract": "A tarantula hawk is a spider wasp (Pompilidae) that preys on tarantulas. Tarantula hawks belong to any of the many species in the genera Pepsis and Hemipepsis. They are some of the largest parasitoid wasps, using their sting to paralyze their prey before dragging it into a brood nest as living food; a single egg is laid on the prey, hatching to a larva, which then eats the still-living host. They are found on all continents other than Europe and Antarctica.", "url": "https://en.wikipedia.org/wiki/Tarantula_hawk", "lang": "en", "sci": "Common name for two genera of wasps"}, "mitten_crab": {"title": "참게", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/7/70/EriocheirSinensis1.jpg/500px-EriocheirSinensis1.jpg", "extract": "참게(Eriocheir sinensis)는 참게과에 속하는 게이다.", "url": "https://ko.wikipedia.org/wiki/%EC%B0%B8%EA%B2%8C", "lang": "ko", "sci": ""}, "minnow": {"title": "피라미", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/a/a3/Oikawa1.jpg/500px-Oikawa1.jpg", "extract": "피라미(Zacco platypus, 문화어: 행베리)는 잉어목 잉어과에 속하는 물고기이다. 어린 개체는 열피리라 부른다. 한반도 하천의 어디에서나 볼 수 있는 물고기로, 다른 물고기에 비해 암수, 산란 시기에 따라 몸 빛깔의 변화가 다양하다. 피라미는 성질이 급하며, 행동이 민첩하고, 바닥이 모래나 작은 자갈로 된 흐르는 물을 좋아한다. 성질이 급해서 잡히면 금방 죽곤 한다. 가을이 깊어가고 수온이 내려가면 상류에 사는 피라미는 하류로 이동하고 호수 등지의 피라미는 깊은 곳으로 이동한다. 그리고 조어라고도 부른다.", "url": "https://ko.wikipedia.org/wiki/%ED%94%BC%EB%9D%BC%EB%AF%B8", "lang": "ko", "sci": ""}, "loach": {"title": "미꾸라지", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/7/70/Misgurnus_fossilis_2009_G1.jpg/500px-Misgurnus_fossilis_2009_G1.jpg", "extract": "미꾸라지(영어: The Chinese muddy loach, 학명: Misgurnus mizolepis 미스구르누스 미졸레피스[*])는 잉어목 미꾸리과 미꾸리속에 속하는 민물고기로 한반도 전역에 두루 서식한다. 한자로는 추어(鰍魚)라고 부르기도 하며 식용한다.", "url": "https://ko.wikipedia.org/wiki/%EB%AF%B8%EA%BE%B8%EB%9D%BC%EC%A7%80", "lang": "ko", "sci": "잉어과에 속하는 민물고기"}, "medaka": {"title": "송사리", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/4/49/Nihonmedaka.jpg/500px-Nihonmedaka.jpg", "extract": "송사리(Rice Fish)는 동갈치목 송사리과에 속하는 민물고기로 성어가 4센티미터 내외이며 보통 2센티미터 정도만 되어도 산란할 수 있다. 송사리라는 이름 외에도 송살, 뽀돌치라는 이름으로도 불린다. 수심이 얕은 호수·늪·웅덩이·배수로·농수로 등에서 살며, 수온이 35 °C가 넘는 온천에서도 산다. 환경 변화에 대한 내성이 강하고 플랑크톤을 주식으로 하지만 잡식성이다. 산란기는 5-7월이다. 산란은 수컷이 암컷의 몸에 등지느러미와 뒷지느러미를 대고 진동시켜 알을 낳게 한다. 암컷은 알덩어리를 달고 다니다가 물풀 등에 붙여 놓는다. 수명은 1-2년이다.", "url": "https://ko.wikipedia.org/wiki/%EC%86%A1%EC%82%AC%EB%A6%AC", "lang": "ko", "sci": "동갈치목 송사리과의 민물고기"}, "water_spider": {"title": "물거미", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/b/b1/Argyroneta_aquatica_Paar.jpg/500px-Argyroneta_aquatica_Paar.jpg", "extract": "물거미는 거미목 잎거미과의 거미이다. 물속에 공기주머니를 만들어서 생활하며, 알도 그 속에서 보호한다. 먹이는 하루살이 애벌레 등의 물 속에 사는 곤충이다. 연천 은대리의 물거미 서식지가 천연기념물 제 412호로 지정되어 있고, 2017년 환경부 지정 멸종위기 Ⅱ급 생물목록에 추가되었다.", "url": "https://ko.wikipedia.org/wiki/%EB%AC%BC%EA%B1%B0%EB%AF%B8", "lang": "ko", "sci": ""}, "mayfly_nymph": {"title": "Baetidae", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/8/8d/Cloeon_dipterum_-_side_%28aka%29.jpg/500px-Cloeon_dipterum_-_side_%28aka%29.jpg", "extract": "Baetidae is a family of mayflies with about 1000 described species in 110 genera distributed worldwide. These are among the smallest of mayflies, adults rarely exceeding 10 mm in length excluding the two long slender tails and sometimes much smaller, and members of the family are often referred to as small mayflies or small minnow mayflies. Most species have long oval forewings with very few cross veins but the hindwings are usually very small or even absent. The males often have very large eyes, shaped like turrets above the head.", "url": "https://en.wikipedia.org/wiki/Baetidae", "lang": "en", "sci": "Family of mayflies"}, "black_jewelwing": {"title": "검은물잠자리", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/9/9a/Calopteryx_atrata_male_in_Kiso_Sansen_National_Government_Park_2011-07-30.jpg/500px-Calopteryx_atrata_male_in_Kiso_Sansen_National_Government_Park_2011-07-30.jpg", "extract": "검은물잠자리(학명: Atrocalopteryx atrata)는 물잠자리과에 속하는 곤충이다.", "url": "https://ko.wikipedia.org/wiki/%EA%B2%80%EC%9D%80%EB%AC%BC%EC%9E%A0%EC%9E%90%EB%A6%AC", "lang": "ko", "sci": ""}, "river_clubtail": {"title": "Sieboldius", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/5/5d/Sieboldius_albardae2.JPG/500px-Sieboldius_albardae2.JPG", "extract": "Sieboldius is a genus of dragonflies in the family Gomphidae. The genus occurs in Asia and is closely related to the dragonhunter of North America.", "url": "https://en.wikipedia.org/wiki/Sieboldius", "lang": "en", "sci": "Genus of dragonflies"}, "melania": {"title": "다슬기", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/7/70/Semisulcospira_kurodai2.jpg/500px-Semisulcospira_kurodai2.jpg", "extract": "다슬기(Semisulcospira libertina, 중세 한국어: 배틀죠개, 문화어: 토질골뱅이)는 다슬기과의 연체동물로 물이 깊고 물살이 센 강의 바위 틈에 무리지어 서식한다. 소래고둥·민물고둥·고딩이·골뱅이 등 여러 이름으로 불린다.", "url": "https://ko.wikipedia.org/wiki/%EB%8B%A4%EC%8A%AC%EA%B8%B0", "lang": "ko", "sci": ""}, "korean_frog": {"title": "참개구리", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/d/dd/Pelophylax_nigromaculatus_s1.JPG/500px-Pelophylax_nigromaculatus_s1.JPG", "extract": "참개구리(학명: Pelophylax nigromaculatus)는 개구리목 개구리과에 속하는 양서류이다. 몸길이 60~90mm로 비교적 대형이며, 한반도, 일본 열도, 중국 본토, 연해주에 서식한다. 몸길이는 15cm 내외이며 논, 연못, 습지 등에서 흔하게 볼 수 있다. 대한민국에서는 먹을 것이 귀하고 자연이 훼손되지 않았던, 산업화 이전 시골에서는 참개구리를 잡아 뒷다리를 구워 먹곤 했다. 지금은 식용으로 거의 쓰이지 않는다. 곤충을 잡아먹으며, 천적으로는 큰노랑테먼지벌레, 뱀, 족제비, 물장군, 수달, 왜가리, 해오라기, 솔개, 개구리매, 붉은배새매 등이 있다. 산란시기는 4~6월 사이이다.", "url": "https://ko.wikipedia.org/wiki/%EC%B0%B8%EA%B0%9C%EA%B5%AC%EB%A6%AC", "lang": "ko", "sci": ""}, "freshwater_shrimp": {"title": "Neocaridina davidi", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/3/3a/Red_Cherry_Shrimp_1.jpg/500px-Red_Cherry_Shrimp_1.jpg", "extract": "Neocaridina davidi, also known as the cherry shrimp, is a freshwater shrimp native to Taiwan, east of China, the Korean Peninsula, and Vietnam, that is sold globally in the aquatic pet trade. They are omnivores, and their natural habitat in these regions include inland water bodies such as lakes, ponds, rivers, and streams. N. davidi is also able to tolerate a wide range of environmental conditions, and as a result of this is also becoming invasive in thermally polluted waterways of Japan, the United States, Poland, and Germany. It is thought that the release of captive shrimp has led to their presence in these environments. Their natural coloration, or wild type, is a mottled brown, but N. davidi has been selectively bred to produce a diverse array of color morphs including red, orange, yellow, green, blue, violet, white, clear, and more. The popularity of the red morph has led to N. davidi also being known as \"cherry shrimp\". N. davidi do not have a distinct larval stage, reach maturity in 30 days, and may live 1–2 years. At maturity, the shrimp are approximately 3–4 cm in length.", "url": "https://en.wikipedia.org/wiki/Neocaridina_davidi", "lang": "en", "sci": "Species of crustacean"}, "crayfish": {"title": "가재", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/1/1a/Procambarus_clarkii.jpg/500px-Procambarus_clarkii.jpg", "extract": "가재(Crayfish)는 가재하목에 속하는 가재상과와 남방가재상과의 민물 갑각류의 통칭이다. 또한 가재는 한국가재(학명: Cambaroides similis) 한 종만을 가리키기도 한다.", "url": "https://ko.wikipedia.org/wiki/%EA%B0%80%EC%9E%AC", "lang": "ko", "sci": "가재하목에 속하는 가재상과와 남방가재상과의 민물 갑각류의 통칭"}, "salamander": {"title": "도롱뇽목", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/b/bf/Tiger_salamander.jpg/500px-Tiger_salamander.jpg", "extract": "도롱뇽목 또는 유미목(有尾目, Urodela)은 양서류의 한 목이며, 이 목에 속하는 동물들을 도롱뇽(salamander)이라고 한다.", "url": "https://ko.wikipedia.org/wiki/%EB%8F%84%EB%A1%B1%EB%87%BD%EB%AA%A9", "lang": "ko", "sci": "양서류의 한 목"}, "firebelly_toad": {"title": "무당개구리", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/5/59/Oriental_fire-bellied_toad.jpg/500px-Oriental_fire-bellied_toad.jpg", "extract": "무당개구리(학명 : Bombina orientalis)는 개구리목 무당개구리과에 속하는 양서류이다. 비단개구리라는 이름으로도 알려져있다. 몸길이는 5cm 내외이고 배는 청색·담갈색 또는 이 두 빛이 섞였으며, 피부에는 작은 혹이 많다. 등은 암록색·청록색·갈색 바탕에 불규칙한 검은색 무늬가 섞여 있다. 알덩어리는 불규칙하며, 보통 고인 물의 물풀 따위에 붙여 놓는다. 산란기는 3~6월 무렵이며 산골짜기에 흐르는 맑은 물이나 평지에 알을 낳는다. 피부의 점액질에서는 독 성분이 분비되어 방어를 하며 사람이 만져 눈에 묻으면 한참 동안 눈이 따깝다. 적을 만나면 네 다리로 등을 뻗치고 눕는 습성이 있다. 산 속의 개울이나 늪에 사는데, 우기나 산란기에 암수 모두 가느다란 소리로 운다. 한국과 중국 북부 등지에 분포한다. 서울시 보호 야생 생물 대상종이다.", "url": "https://ko.wikipedia.org/wiki/%EB%AC%B4%EB%8B%B9%EA%B0%9C%EA%B5%AC%EB%A6%AC", "lang": "ko", "sci": "개구리목 무당개구리과에 속하는 양서류"}, "dace": {"title": "버들치", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/8/8c/Phoxinus_oxycephalus_jouyi_Gobius.jpg/500px-Phoxinus_oxycephalus_jouyi_Gobius.jpg", "extract": "버들치는 잉어과에 속하는 민물고기이다. 1급수의 지표종이다. 몸길이 8cm ~ 15cm 내외이다. 넓은 하천과 호소에 서식하나 좁은 산골짜기 계류를 좋아한다. 맛이 없어 식용으로 보다는 관상어로 더 인기 있다하였으나, 겨울철 끓여내는 매운탕 재료로는 더할 나위없이 담백하다.", "url": "https://ko.wikipedia.org/wiki/%EB%B2%84%EB%93%A4%EC%B9%98", "lang": "ko", "sci": "잉어과에 속하는 민물고기"}, "amphipod": {"title": "옆새우", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/3/3f/Gammarus_roeselii.jpg/500px-Gammarus_roeselii.jpg", "extract": "옆새우는 연갑강 낭하상목 단각목에 속하는 옆새우아목(Gammaridea) 갑각류의 총칭이다.", "url": "https://ko.wikipedia.org/wiki/%EC%98%86%EC%83%88%EC%9A%B0", "lang": "ko", "sci": ""}, "planarian": {"title": "플라나리아", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/c/c4/Planariafull.jpg/500px-Planariafull.jpg", "extract": "플라나리아(planaria)는 편형동물문 와충류강, 삼기장목(三岐腸目) 플라나리아과에 속하는 동물이다.", "url": "https://ko.wikipedia.org/wiki/%ED%94%8C%EB%9D%BC%EB%82%98%EB%A6%AC%EC%95%84", "lang": "ko", "sci": ""}, "caddis_larva": {"title": "Limnephilidae", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/d/df/Adult_Sequatchie_caddislfy._Credit-_Kevin_Moulton%2C_UT_%2815046979024%29.jpg/500px-Adult_Sequatchie_caddislfy._Credit-_Kevin_Moulton%2C_UT_%2815046979024%29.jpg", "extract": "Limnephilidae is a family of caddisflies with about 100 genera and almost 900 described species. They belong to the main lineage of case-constructing caddisflies, the Integripalpia or tube-case caddisflies. The Limnephilidae is one of the most species-rich Trichoptera families of northern temperate regions, but only a few are known from tropical areas and the Southern Hemisphere. For this reason they are often known as northern caddisflies.", "url": "https://en.wikipedia.org/wiki/Limnephilidae", "lang": "en", "sci": "Family of caddisflies"}, "stonefly_nymph": {"title": "Perlidae", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/f/f8/Plecoptera-perlidae1-sp.png/500px-Plecoptera-perlidae1-sp.png", "extract": "The Perlidae are a family of stoneflies, with more than 50 genera and 1,100 described species. The majority of the Perlidae are found in eastern North America, but they occur worldwide except for Antarctica and parts of Africa. Their lifecycles range between one and three years. The adults emerge in the summer; they are very active and known to be attracted to light sources. They are usually very sensitive to changes in environment.", "url": "https://en.wikipedia.org/wiki/Perlidae", "lang": "en", "sci": "Family of stoneflies"}, "valley_frog": {"title": "계곡산개구리", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/7/7e/Rana_huanrensis_Kim_Hyuntae_2471106.jpg/500px-Rana_huanrensis_Kim_Hyuntae_2471106.jpg", "extract": "계곡산개구리(학명: Rana huanrensis)는 개구리과 개구리속에 속하는 개구리의 일종이다. 중국 랴오닝성, 지린성, 한반도에 서식한다. 랴오닝성 환런현에서 처음 발견되었다. 북방산개구리(Rana dybowskii)와 가까운 관계로, 1991년 이전에 수집된 많은 계곡산개구리 표본이 북방산개구리로 잘못 동정되었다. 배의 색깔과 울음주머니가 없다는 특징으로 북방산개구리와 구별할 수 있다.", "url": "https://ko.wikipedia.org/wiki/%EA%B3%84%EA%B3%A1%EC%82%B0%EA%B0%9C%EA%B5%AC%EB%A6%AC", "lang": "ko", "sci": "개구리의 일종"}, "gold_frog": {"title": "금개구리", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/0/02/Pelophylax_chosenicus_%28cropped%29.jpg/500px-Pelophylax_chosenicus_%28cropped%29.jpg", "extract": "금개구리(金―, 학명: Pelophylax chosenicus)는 개구리목에 속하는 양서류이다. 금선와(金線蛙) 또는 금줄개구리라고도 한다.", "url": "https://ko.wikipedia.org/wiki/%EA%B8%88%EA%B0%9C%EA%B5%AC%EB%A6%AC", "lang": "ko", "sci": "양서류 개구리목 개구리과에 속하는 동물"}, "tree_frog": {"title": "청개구리", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/5/53/Japanese_tree_frog_eating_wood_louse.jpg/500px-Japanese_tree_frog_eating_wood_louse.jpg", "extract": "청개구리(학명: Hyla japonica 휠라 야포니카[*])는 청개구리과의 개구리이다.", "url": "https://ko.wikipedia.org/wiki/%EC%B2%AD%EA%B0%9C%EA%B5%AC%EB%A6%AC", "lang": "ko", "sci": ""}, "narrow_frog": {"title": "맹꽁이", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/a/a7/Kaloula_borealis_2.jpg/500px-Kaloula_borealis_2.jpg", "extract": "맹꽁이(학명: Kaloula borealis)는 맹꽁이과에 속하는 개구리로, 영어권에서는 boreal digging frog라고 부른다. 중국 중북부, 한반도, 제주도에 분포한다. IUCN 적색 목록에서는 관심 대상(LC)으로 평가하나, 한국에서는 멸종 위기 야생 생물 II급으로 지정되어 있다.", "url": "https://ko.wikipedia.org/wiki/%EB%A7%B9%EA%BD%81%EC%9D%B4", "lang": "ko", "sci": "맹꽁이과에 속하는 양서류"}, "toad": {"title": "두꺼비", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/4/43/Bufo_gargarizans_profile.jpg/500px-Bufo_gargarizans_profile.jpg", "extract": "두꺼비(학명: Bufo sachalinensis)는 개구리목 두꺼비과에 속하는 양서류로 사할린두꺼비라고도 일컫는다. 한반도에서 분포하는 개구리목 생물 가운데 최대종이며, 한반도 외에도 중국 요동·사할린· 러시아 연해주 등지에 분포한다. 본래는 중국에 서식하고 있는 중국두꺼비(Bufo gargarizans)와 동일종으로 분류하였으나 최근 연구로 인하여 별개의 종으로 분리되었다.", "url": "https://ko.wikipedia.org/wiki/%EB%91%90%EA%BA%BC%EB%B9%84", "lang": "ko", "sci": "개구리목 두꺼비과에 속하는 양서류"}, "fishing_spider": {"title": "Dolomedes sulfureus", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/f/ff/IouiroHashirigumo_06d2035sv.jpg/500px-IouiroHashirigumo_06d2035sv.jpg", "extract": "Dolomedes sulfureus is a species of spiders commonly known as fishing spiders belonging to the genus Dolomedes. They produce a venom that contains a group of neurotoxic peptides. The species is found in Russia, China, Korea, and Japan.", "url": "https://en.wikipedia.org/wiki/Dolomedes_sulfureus", "lang": "en", "sci": "Species of spider"}, "tiny_dragonfly": {"title": "꼬마잠자리", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/f/f9/Nannophya_pygmaea.JPG/500px-Nannophya_pygmaea.JPG", "extract": "꼬마잠자리는 잠자리목 잠자리과의 곤충이다. 배의 길이는 10~14mm이고, 뒷날개길이는 13~15mm이다. 전체 1.7cm 내외의 크기로 세계에서 가장 작은 잠자리이다. 수컷은 1m 내외의 영역을 확보하여 영역 경계 활동을 하며, 약 10초 정도의 짧은 짝짓기를 한후 암컷 단독으로 타수산란을 한다.", "url": "https://ko.wikipedia.org/wiki/%EA%BC%AC%EB%A7%88%EC%9E%A0%EC%9E%90%EB%A6%AC", "lang": "ko", "sci": ""}, "apple_snail": {"title": "우렁이", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/f/fa/Viviparus_contectus_met_operculum2.JPG/500px-Viviparus_contectus_met_operculum2.JPG", "extract": "우렁이 또는 논우렁이(Lister's river snail)는 논우렁이과에 속하는 복족류 고둥의 총칭이다. 남미와 남극 대륙을 제외한 각 대륙과 그 주변 지역의 민물에 서식하고, 자웅이주의 난태생이다. 딱딱한 껍질과 딱딱하고 편편한 모자를 둘러쓴 것과 같은 입을 가진다. 민물 고둥으로서는 대형의 종을 포함한다.", "url": "https://ko.wikipedia.org/wiki/%EC%9A%B0%EB%A0%81%EC%9D%B4", "lang": "ko", "sci": "복족류의 과"}, "wriggler": {"title": "장구벌레", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/1/18/Mosquito_larva.jpg/500px-Mosquito_larva.jpg", "extract": "장구벌레는 모기의 애벌레를 가리킨다. 모기는 한번에 100~700개의 알을 물이 고여있는 곳에 낳는다. 장구벌레는 물 속에서 위아래로 이동하여 먹이를 섭취하는 등 매우 활발하게 운동한다. 집모기의 장구벌레는 꼬리 부분 끝에 있는 호흡관을 수면 밖으로 내어 외호흡을 하며, 4회 탈피 후 번데기로 된다. 반면 학질모기의 장구벌레는 호흡관이 없고, 꼬리끝의 기문을 수면 밖으로 내어 외호흡을 한다.", "url": "https://ko.wikipedia.org/wiki/%EC%9E%A5%EA%B5%AC%EB%B2%8C%EB%A0%88", "lang": "ko", "sci": "모기의 애벌레"}, "black_damsel": {"title": "Paracercion calamorum", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/b/b2/Paracercion_calamorum_%28Dusky_Lilysquatter%29_male.jpg/500px-Paracercion_calamorum_%28Dusky_Lilysquatter%29_male.jpg", "extract": "Paracercion calamorum, the dusky lilly-squatter, is a species of damselfly in the family Coenagrionidae. It has a range that extends from southern far-eastern Russia to Japan, and to India and Indonesia. The nominate subspecies P. c. calamorum is known from central and eastern China, Korea and Japan. The subspecies P. c. dyeri occurs in southern China, Hong Kong, Taiwan, Indonesia, India, Nepal, and Thailand.", "url": "https://en.wikipedia.org/wiki/Paracercion_calamorum", "lang": "en", "sci": "Species of damselfly"}, "kkeokji": {"title": "꺽지", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/b/b9/%E3%82%B3%E3%82%A6%E3%83%A9%E3%82%A4_%E3%82%AA%E3%83%A4%E3%83%8B%E3%83%A9%E3%83%9F.jpg/500px-%E3%82%B3%E3%82%A6%E3%83%A9%E3%82%A4_%E3%82%AA%E3%83%A4%E3%83%8B%E3%83%A9%E3%83%9F.jpg", "extract": "꺽지는 쏘가리과의 물고기로 한국의 고유종이다.", "url": "https://ko.wikipedia.org/wiki/%EA%BA%BD%EC%A7%80", "lang": "ko", "sci": ""}, "dolgogi": {"title": "돌고기", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/6/6a/Pungtungia_herzi1.jpg/500px-Pungtungia_herzi1.jpg", "extract": "돌고기(Pungtungia herzi)는 민물고기의 일종이다. 방언으로는 쭉비라 하며, 어린 개체는 가사리라 부른다. 물속에 사는 곤충들을 먹는다. 비교적 물이 맑고 바닥에 큰 돌이나 자갈이 많은 곳에 무리를 지어 산다. 주로 하천 중상류에 서식한다. 등은 암갈색이고, 배는 담황색이다. 몸이 길고 약간 납작한 원통형이다. 감돌고기 · 가는돌고기와는 생김새가 비슷하며 같은 아과에 속하지만 속 단계에서 갈라진다. 알은 봄에 돌이 맣은 맑은 냇물 바닥에 낳는다. 물 깊이가 50~100cm쯤 되고 넓적한 돌이나 바위가 많은 곳에 낳는다. 이때 수컷은 입술이나 지느러미에 오돌오돌한 돌기가 생기고 혼인색을 띤다.", "url": "https://ko.wikipedia.org/wiki/%EB%8F%8C%EA%B3%A0%EA%B8%B0", "lang": "ko", "sci": ""}, "galgyeoni": {"title": "갈겨니", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/f/ff/Nipponocypris_temminckii.jpg/500px-Nipponocypris_temminckii.jpg", "extract": "갈겨니(학명: Nipponocypris temminckii)는 동아시아의 개천에 서식하는 민물고기이다. 갈견이라고도 부르며, 눈이 검다 하여 안흑어(眼黑魚), 눈검쟁이라고도 한다.", "url": "https://ko.wikipedia.org/wiki/%EA%B0%88%EA%B2%A8%EB%8B%88", "lang": "ko", "sci": "잉어과 갈겨니속의 물고기"}, "dongsari": {"title": "Odontobutis platycephala", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/6/60/Odontobutis_platycephala_COEX1.jpg/500px-Odontobutis_platycephala_COEX1.jpg", "extract": "Odontobutis platycephala is a species of freshwater sleeper endemic to South Korea.", "url": "https://en.wikipedia.org/wiki/Odontobutis_platycephala", "lang": "en", "sci": "Species of fish"}, "dobsonfly": {"title": "뱀잠자리", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/2/2e/Protohermes_grandis.jpg/500px-Protohermes_grandis.jpg", "extract": "뱀잠자리는 뱀잠자리목 뱀잠자리과의 곤충이다. '뱀잠자리'라는 이름은 길고 둥근 머리와 긴 앞가슴 모양이 마치 뱀이 머리를 곧추세우고 있는 모습과 유사하여 붙여졌다. 더듬이는 다른 잠자리들과 다르게 길다. 한국에서 기존에 뱀잠자리로 알려졌던 종은 노란뱀잠자리(Protohermes xanthodes)이며 뱀잠자리(P. grandis)종은 한국에서의 분포 확인이 필요하다.", "url": "https://ko.wikipedia.org/wiki/%EB%B1%80%EC%9E%A0%EC%9E%90%EB%A6%AC", "lang": "ko", "sci": ""}, "hellgrammite": {"title": "Dobsonfly", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/e/e7/Corydalus_cornutus_MHNT.jpg/500px-Corydalus_cornutus_MHNT.jpg", "extract": "Dobsonflies are a subfamily of insects, Corydalinae, part of the Megalopteran family Corydalidae. The larvae are aquatic, living in streams, and the adults are often found along streams as well. The nine genera of dobsonflies are distributed in the Americas, Asia, and South Africa.", "url": "https://en.wikipedia.org/wiki/Dobsonfly", "lang": "en", "sci": "Subfamily of insects"}, "striped_shrimp": {"title": "줄새우", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/7/76/Palaemon_paucidens.jpg/500px-Palaemon_paucidens.jpg", "extract": "줄새우(Palaemon paucidens)는 징거미새우과에 속하는 새우이다. 몸의 특징은 갑각의 간 부위에 가시가 없고 아가미 부위에 가시가 있다. 또 수컷의 제2가슴다리는 다른 가슴다리에 비해 그다지 크지 않다. 암컷이 수컷보다 크다. 몸은 연한 갈색을 띠고 갑각의 옆에 짙은 갈색의 복잡한 무늬가 있다. 또 배의 제2마디에 두 줄, 꼬리마디를 제외한 다른 마디에 각각 한 줄씩 모두 일곱 줄의 짙은 갈색 줄무늬가 있다. 배에는 알 뭉치가 붙는데, 알 뭉치는 연한 황록색을 띤다. 한국·일본·러시아·중국 등지에 분포한다.", "url": "https://ko.wikipedia.org/wiki/%EC%A4%84%EC%83%88%EC%9A%B0", "lang": "ko", "sci": ""}, "clubtail": {"title": "Gomphidae", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/5/50/Bladetail_%28Lindenia_tetraphylla%29_male_Macedonia.jpg/500px-Bladetail_%28Lindenia_tetraphylla%29_male_Macedonia.jpg", "extract": "Gomphidae is a family of dragonflies commonly known as clubtails or club-tailed dragonflies. The family is placed in the superfamily Gomphoidea, together with Petaluridae.", "url": "https://en.wikipedia.org/wiki/Gomphidae", "lang": "en", "sci": "Family of dragonflies"}, "cumulus": {"title": "적운", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/3/3c/GoldenMedows.jpg/500px-GoldenMedows.jpg", "extract": "적운(積雲)은 수직으로 발달하는 구름으로 쌘구름 또는 뭉게구름(문화어: 더미구름)이라고도 한다.", "url": "https://ko.wikipedia.org/wiki/%EC%A0%81%EC%9A%B4", "lang": "ko", "sci": ""}, "cirrus": {"title": "권운", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/2/2e/CirrusField-color.jpg/500px-CirrusField-color.jpg", "extract": "권운(卷雲, cirrus cloud, 구름 분류 기호: Ci)은 얼음 결정으로 이루어진 높은 고도의 구름 속이다. 상층운으로 털구름 또는 새털구름이라고도 한다.", "url": "https://ko.wikipedia.org/wiki/%EA%B6%8C%EC%9A%B4", "lang": "ko", "sci": ""}, "altocumulus": {"title": "고적운", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/6/6e/Altocumulus02.jpg/500px-Altocumulus02.jpg", "extract": "고적운(高積雲, altocumulus, 문화어: 높은더미구름)은 중층운으로 양떼구름, 높쌘구름이라고도 한다.", "url": "https://ko.wikipedia.org/wiki/%EA%B3%A0%EC%A0%81%EC%9A%B4", "lang": "ko", "sci": ""}, "stratus": {"title": "층운", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/d/d1/Stratus-Opacus-Uniformis.jpg/500px-Stratus-Opacus-Uniformis.jpg", "extract": "층운(層雲)은 하층운으로, 층구름 또는 안개와 비슷하여 안개구름이라고도 한다.", "url": "https://ko.wikipedia.org/wiki/%EC%B8%B5%EC%9A%B4", "lang": "ko", "sci": ""}, "nimbostratus": {"title": "난층운", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/7/7b/Nov20-05-Nimbostratus.jpg/500px-Nov20-05-Nimbostratus.jpg", "extract": "난층운(亂層雲)은 비층구름, 비구름이라고도 하며 하층운에 속하는 구름이다.", "url": "https://ko.wikipedia.org/wiki/%EB%82%9C%EC%B8%B5%EC%9A%B4", "lang": "ko", "sci": ""}, "cumulonimbus": {"title": "적란운", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/c/c2/Cumulonimbus_in_South_Korea.JPG/500px-Cumulonimbus_in_South_Korea.JPG", "extract": "적란운(積亂雲, 영어: cumulonimbus cloud)은 수직으로 발달하는 구름으로, 적운과 비슷하지만 훨씬 높이 솟아 산이나 큰 탑처럼 보인다. 강한 상승 기류와 강수를 동반하고 번개·천둥을 일으킬 수 있으며, 국제 구름 분류에서 하나의 운종으로 다룬다. 번개와 천둥을 동반하는 구름을 뇌운이라고도 하며, 강한 비, 눈 또는 우박을 동반할 때는 각각 쌘비구름, 쌘눈구름, 쌘우박구름으로도 부른다.", "url": "https://ko.wikipedia.org/wiki/%EC%A0%81%EB%9E%80%EC%9A%B4", "lang": "ko", "sci": ""}, "sunset_cloud": {"title": "노을", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/2/2e/Dawn_over_Oostende_cloud.jpg/500px-Dawn_over_Oostende_cloud.jpg", "extract": "노을(영어: afterglow) 또는 놀은, 새벽이나 아침 또는 저녁에 태양 광선이 대기를 통과하는 거리가 길어져서 태양 광선 중 파장이 짧은 파란색은 대기 중 먼지에 많이 흡수되고, 파장이 긴 빨간색은 적게 흡수되어 하늘이 빨간색으로 보이는 현상이다.", "url": "https://ko.wikipedia.org/wiki/%EB%85%B8%EC%9D%84", "lang": "ko", "sci": "자연현상의 하나"}, "lenticular": {"title": "렌즈운", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/4/4b/Lenticular4.jpeg/500px-Lenticular4.jpeg", "extract": "렌즈구름(Lenticular cloud)은 높은 고도에서, 바람 방향에 직각으로 정렬하고 있는 렌즈모양의 움직이지 않는 구름이다. 렌즈구름은 그 모양에 따라서 고적운(ACSL), 층적운(SCSL), 그리고 권적운으로 분류할 수 있다.", "url": "https://ko.wikipedia.org/wiki/%EB%A0%8C%EC%A6%88%EC%9A%B4", "lang": "ko", "sci": ""}, "contrail": {"title": "비행운", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/8/8b/Airplane_contrail.jpg/500px-Airplane_contrail.jpg", "extract": "비행운(영어: contrail 콘트레일[*])은 항공기 엔진 배기 가스나 공기압의 변화로 인해 형성되는 선 모양의 구름으로, 일반적으로 항공기가 순항하는 지구 표면 위 수 킬로미터 상공에서 발생한다. 비행운은 주로 빙정 형태의 물로 구성된다. 항공기 엔진 배기 가스 속의 수증기와 고고도의 낮은 주변 온도가 결합하여 비행운이 형성된다.", "url": "https://ko.wikipedia.org/wiki/%EB%B9%84%ED%96%89%EC%9A%B4", "lang": "ko", "sci": "비행기의 자취를 따라 생기는 구름"}, "snow_cloud": {"title": "눈 (날씨)", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/c/c2/SnowflakesWilsonBentley.jpg/500px-SnowflakesWilsonBentley.jpg", "extract": "눈(영어: snow)은 기상 현상의 한 종류로 기온이 섭씨 0°C 아래로 떨어질 때, 구름 안의 물입자나 대기 중의 수증기가 얼어서 결정화된 것이 내리는 것이다.", "url": "https://ko.wikipedia.org/wiki/%EB%88%88_(%EB%82%A0%EC%94%A8)", "lang": "ko", "sci": "기상 현상의 한 종류"}, "noctilucent": {"title": "야광운", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/8/82/ISS_17_-_Noctilucent_clouds_over_Asia.jpg/500px-ISS_17_-_Noctilucent_clouds_over_Asia.jpg", "extract": "야광운(夜光雲)은 고위도지방 70~90도 부근 고도 76 ~ 85 km 높이의 중간권에 생기는 구름을 말한다. 약 120년 전에 처음 관측되었으나 그 높이에서 왜 생기는지는 아직 알 수 없다. 온도는 -120˚C(-184˚F)정도이며, 열대의 상승 기류나 메탄이 주요 수증기원으로 될 것으로 추정된다.", "url": "https://ko.wikipedia.org/wiki/%EC%95%BC%EA%B4%91%EC%9A%B4", "lang": "ko", "sci": ""}, "rainbow": {"title": "무지개", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/5/5c/Double-alaskan-rainbow.jpg/500px-Double-alaskan-rainbow.jpg", "extract": "무지개(영어: rainbow, 문화어: 색동다리)는 하늘에서, 눈에 보이는 반원형의 호(弧)를 이루는 일곱 가지 색의 띠를 말한다. 색 경계가 분명하지 않아 각 문화권마다 색의 개수가 다르게 인식되기도 한다.", "url": "https://ko.wikipedia.org/wiki/%EB%AC%B4%EC%A7%80%EA%B0%9C", "lang": "ko", "sci": "하늘에 보이는 호를 이루는 색 띠"}, "swallow": {"title": "제비", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/3/33/%D0%94%D0%B5%D1%80%D0%B5%D0%B2%D0%B5%D0%BD%D1%81%D0%BA%D0%B0%D1%8F_%D0%BB%D0%B0%D1%81%D1%82%D0%BE%D1%87%D0%BA%D0%B0_%28Hirundo_rustica%29%2C_%D0%9C%D0%B5%D0%BB%D0%B8%D1%85%D0%BE%D0%B2%D0%BE.jpg/500px-%D0%94%D0%B5%D1%80%D0%B5%D0%B2%D0%B5%D0%BD%D1%81%D0%BA%D0%B0%D1%8F_%D0%BB%D0%B0%D1%81%D1%82%D0%BE%D1%87%D0%BA%D0%B0_%28Hirundo_rustica%29%2C_%D0%9C%D0%B5%D0%BB%D0%B8%D1%85%D0%BE%D0%B2%D0%BE.jpg", "extract": "제비(학명: Hirundo rustica 히룬도 루스티카[*])는 참새목 제비과의 철새다. 벼랑이나 처마 밑에 진흙으로 만든 둥지를 만들어서 번식하며, 곤충을 잡아먹는다. 집을 지을때는 해조류나 진흙을 이용해, 자신의 침과 섞어 수직벽에 붙도록 짓는다. 제비가 낮게 날면 비가 온다고 하는데, 이는 습기 때문에 몸이 무거워진 곤충을 잡아먹기 위해 제비가 낮게 날기 때문이다. 오늘날에는 제비가 멸종 위기에 처해 있다. 이는 사람이 뿌린 농약이 제비의 몸에 쌓여 알껍질이 얇아지면, 부화하지 못하기 때문이다. 서울시 보호 야생 생물 대상종이다.", "url": "https://ko.wikipedia.org/wiki/%EC%A0%9C%EB%B9%84", "lang": "ko", "sci": ""}, "swift": {"title": "칼새", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/b/bd/Pacific_Swift.jpg/500px-Pacific_Swift.jpg", "extract": "칼새(영어: Pacific swift, 학명: Apus pacificus 아푸스 파키피쿠스[*])는 칼새목 칼새과의 한 종이다. 여름새로서 뚜렷한 위꽁지덮깃과 담색의 멱을 빼고는 전체적으로 흑갈색을 띤다. 해안과 섬의 암벽과 높은 산의 바위, 굴 또는 오래된 높은 건물 등에서 집단으로 번식한다. 하늘을 날면서 먹이를 찾고 대개는 큰 무리를 이룬다.", "url": "https://ko.wikipedia.org/wiki/%EC%B9%BC%EC%83%88", "lang": "ko", "sci": ""}, "ballooning_spider": {"title": "Ballooning (spider)", "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/1/12/Ballooning_spiderlings.jpg/500px-Ballooning_spiderlings.jpg", "extract": "Ballooning, sometimes called kiting, is a process by which spiders, and some other small invertebrates, move through the air by releasing one or more gossamer threads to catch the wind, causing them to become airborne at the mercy of air currents and electric fields. A 2018 study concluded that electric fields provide enough force to lift spiders in the air, and possibly elicit ballooning behavior. This is primarily used by spiderlings to disperse; however, larger individuals have been observed doing so as well. The spider climbs to a high point and takes a stance with its abdomen to the sky, releasing fine silk threads from its spinneret until it becomes aloft. Journeys achieved vary from a few metres to hundreds of kilometres. Even atmospheric samples collected from balloons at five kilometres altitude and ships mid-ocean have reported spider landings. Ballooning can be dangerous due to predators and the unpredictable nature of long-distance ballooning, which may bring individuals to an unfavorable environment.", "url": "https://en.wikipedia.org/wiki/Ballooning_(spider)", "lang": "en", "sci": "Air-borne movement of spiders and other invertebrates"}};

    b.innerHTML = `<img class="px" src="${icon(p.id)}" alt="">${p.name}<small>${got}/${all}</small>`; b.addEventListener('click', () => { if (S.place !== p.id) { S.place = p.id; bugs = []; spawnT = .3; player.x = WW / 2; player.y = 0; player.vy = 0; player.py = 220; player.gy = GROUND + 8; cam = camTarget = clamp(player.x - W / 2, 0, WW - W); save(); renderPlaces(); renderScene(); preloadFrames(); beep(SND.tap); } }); box.appendChild(b); });
}
function renderScene() { const p = placeOf(); $('placeName').textContent = (S.night && !p.dark ? '밤의 ' : '') + p.name; $('placeHint').textContent = p.hint; $('dayBtn').textContent = S.night ? '🌙 밤' : '☀️ 낮'; $('dayBtn').hidden = !!p.dark; $('btnJ').hidden = !!p.free; }
function renderStrip() {
  const st = $('strip'); st.innerHTML = ''; $('stripEmpty').hidden = S.recent.length > 0;
  S.recent.forEach(id => { const b = BUG[id]; if (!b) return; const d = document.createElement('button'); d.className = 'mini'; const ph = PHOTOS[id]; d.innerHTML = `<div class="b${ph && ph.img ? ' photo' : ''}">${ph && ph.img ? `<img src="${smallPhoto(ph.img)}" width="250" height="250" decoding="async" alt="${b.name}" loading="lazy" onerror="this.src='${bugURL(id)}';this.parentElement.classList.remove('photo')">` : `<img src="${bugURL(id)}" alt="">`}</div>${b.name}`; d.addEventListener('click', () => showCard(b, 'view')); st.appendChild(d); });
}
let filter = 'all';
function renderGrid() {
  const fs = $('filters'); if (!fs.children.length) {
    [['all', '전체'], ['meadow', '풀밭'], ['forest', '숲'], ['pond', '연못'], ['river', '강'], ['valley', '계곡'], ['wetland', '습지'], ['stream', '하천'], ['yard', '마당'], ['home', '집안'], ['sea', '바다'], ['mountain', '산'], ['sky', '하늘'], ['deepsea', '심해'], ['underground', '땅속'], ['rocks', '바위틈'], ['cave', '동굴'], ['desert', '사막'], ['night', '🌙 밤'], ['rare', '⭐ 희귀'], ['not', '곤충 아님'], ['got', '✅ 잡은 것']].forEach(([k, label]) => { const c = document.createElement('button'); c.className = 'chip' + (k === filter ? ' on' : ''); c.dataset.k = k; c.textContent = label; c.addEventListener('click', () => { filter = k; [...fs.children].forEach(x => x.classList.toggle('on', x.dataset.k === k)); renderGrid(); }); fs.appendChild(c); });
  }
  const list = BUGS.filter(b => filter === 'all' || (filter === 'night' ? b.time !== 'day' : filter === 'rare' ? b.rare === 2 : filter === 'not' ? b.notInsect : filter === 'got' ? S.caught[b.id] : b.place.includes(filter)));
  const grid = $('grid'); grid.innerHTML = '';
  list.forEach(b => { const n = S.caught[b.id] || 0, known = n > 0; const c = document.createElement('button'); c.className = 'card' + (known ? '' : ' unknown') + (known && S.recent[0] === b.id && n === 1 ? ' new' : '');
    c.innerHTML = `${b.rare === 2 ? '<span class="rare">⭐</span>' : ''}${known ? `<span class="cnt">${n}</span>` : ''}${known ? photoThumb(b) : `<img src="${bugURL(b.id)}" alt="" loading="lazy">`}<div class="nm">${known ? b.name : '???'}</div>`;
    c.addEventListener('click', () => { if (known) showCard(b, 'view'); else { toast(`${b.place.map(p => PLACES.find(x => x.id === p).name).join('·')}에서 ${b.time === 'night' ? '밤에 ' : b.time === 'day' ? '낮에 ' : ''}찾아보세요!`); beep(SND.tap); } });
    grid.appendChild(c); });
}
function askReset() {
  const n = S.seen.length, t = S.total;
  $('mbox').innerHTML = `<div class="confirm"><div class="big">🗑️</div><h3>잡은 곤충을 모두 지울까요?</h3>
    <p>${n ? `도감에 넣은 <b>${n}종</b>, 지금까지 잡은 <b>${t}마리</b> 기록이 모두 사라져요.<br>지우고 나면 되돌릴 수 없어요.` : '아직 잡은 곤충이 없어요.'}</p>
    <div class="row2"><button class="close ghost" id="rNo">취소</button>${n ? '<button class="close danger" id="rYes">모두 지우기</button>' : ''}</div></div>`;
  modalOpenedAt = performance.now(); $('modal').hidden = false; beep(SND.tap);
  $('rNo').onclick = () => { $('modal').hidden = true; beep(SND.tap); };
  const y = $('rYes'); if (y) y.onclick = () => { if (performance.now() - modalOpenedAt < 300) return; resetProgress(); $('modal').hidden = true; };
}
function resetProgress() {
  S.caught = {}; S.seen = []; S.recent = []; S.total = 0; S.done = false; save();
  renderHud(); renderStrip(); renderGrid(); renderPlaces(); beep(SND.tap); toast('🧹 도감을 깨끗하게 비웠어요. 다시 모아 볼까요?');
}
function showView(v) { document.querySelectorAll('.view').forEach(x => x.hidden = x.id !== 'v-' + v); document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.v === v)); }
const scroller = $('scroller');
function setPH() { document.documentElement.style.setProperty('--ph', $('phone').clientHeight + 'px'); }
new ResizeObserver(setPH).observe($('phone')); setPH();
const landscapeMQ = matchMedia('(orientation: landscape) and (min-width: 560px)');
function onOrient() { if (landscapeMQ.matches) scroller.scrollTo({ top: 0, behavior: 'auto' }); setTimeout(() => { resize(); setPH(); }, 120); }
landscapeMQ.addEventListener ? landscapeMQ.addEventListener('change', onOrient) : landscapeMQ.addListener(onOrient);
window.addEventListener('orientationchange', onOrient);

// ======================= 시작 =======================
load();
$('logo').src = icon('bug'); document.querySelectorAll('[data-ico]').forEach(img => img.src = icon(img.dataset.ico));
BUGS.forEach(b => bugImg(b.id));
function preloadFrames() { BUGS.filter(b => b.place.includes(S.place)).forEach(b => { bugImg(b.id, 1); bugImg(b.id, 3); }); }
preloadFrames();
renderHud(); renderPlaces(); renderScene(); renderStrip(); renderGrid();
$('resetBtn').addEventListener('click', askReset);
$('dayBtn').addEventListener('click', () => { S.night = !S.night; bugs = []; spawnT = .3; save(); renderScene(); beep(SND.tap); toast(S.night ? '🌙 밤이 되었어요. 밤에만 나오는 곤충을 찾아보세요!' : '☀️ 아침이 밝았어요!'); });
$('sndBtn').addEventListener('click', () => { S.sound = !S.sound; save(); renderHud(); beep(SND.tap); });
document.querySelectorAll('.tab').forEach(tb => tb.addEventListener('click', () => { const same = tb.classList.contains('on'); showView(tb.dataset.v); beep(SND.tap); if (tb.dataset.v === 'ex' && same) scroller.scrollTo({ top: 0 }); else if (tb.dataset.v === 'dex') scroller.scrollTo({ top: tb.parentElement.offsetTop }); }));
requestAnimationFrame(tick);
window.__dbg = { bugs: () => bugs, time: () => t, cam: () => cam, player, keys, swing: swingNet };
setTimeout(() => { $('hint').style.opacity = 0; }, 7000);
})();
</script>
