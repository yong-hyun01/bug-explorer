<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>곤충 탐험대</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
:root{
  --sky:#BDE8FF; --grass:#7CC24A; --grass-2:#4E9A2E; --accent:#FF8A3D; --accent-2:#E0661C;
  --ink:#1F3A1A; --dim:#5E7A58; --cream:#FFF8E6; --line:#E5D9B8;
  --green:#4E9A2E; --red:#E53935; --blue:#3B82F6; --purple:#8B5CF6;
  --display:"Jua","Noto Sans KR",sans-serif; --body:"Noto Sans KR",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:#DCEFC7;color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;display:flex;justify-content:center;align-items:center;min-height:100dvh;background-image:radial-gradient(circle at 50% 20%,#F2FBE4 0,#DCEFC7 60%)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
img.px{image-rendering:pixelated}
.disp{font-family:var(--display);font-weight:400}
.phone{width:100%;max-width:430px;height:100dvh;max-height:900px;background:var(--cream);display:flex;flex-direction:column;overflow:hidden;position:relative}
@media(min-width:480px) and (min-height:720px){.phone{height:min(900px,96dvh);border-radius:34px;border:1px solid #CFC2A0;box-shadow:0 40px 80px -30px rgba(40,60,20,.6),0 0 0 8px #F6EEDC}}

.hud{display:flex;justify-content:space-between;align-items:center;padding:12px 16px 8px;background:linear-gradient(180deg,#FFF3D6,var(--cream))}
.hud h1{font-family:var(--display);font-size:24px;margin:0;color:var(--ink);display:flex;align-items:center;gap:8px}
.hud h1 img{width:28px;height:28px}
.hud .prog{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px;color:var(--dim)}
.hud .bar{width:80px;height:10px;border-radius:5px;background:#E8DFC3;overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.15)}
.hud .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--grass),var(--grass-2));transition:width .4s}
.hud .snd{width:34px;height:34px;border-radius:50%;background:#FFF;box-shadow:0 2px 0 #D9CCA6;font-size:16px;display:grid;place-items:center}

.scene{position:relative;margin:0 12px;border-radius:18px;overflow:hidden;background:#000;aspect-ratio:1/1;max-height:50dvh;border:3px solid #FFF;box-shadow:0 8px 24px -8px rgba(0,0,0,.35);flex:none}
.scene canvas{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.scene .label{position:absolute;top:10px;left:12px;font-family:var(--display);font-size:20px;color:#FFF;text-shadow:0 2px 0 rgba(0,0,0,.35),0 0 10px rgba(0,0,0,.3);pointer-events:none}
.scene .label small{display:block;font-family:var(--body);font-size:12px;font-weight:700;opacity:.9}
.scene .daynight{position:absolute;top:10px;right:10px;padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.9);font-weight:900;font-size:13px;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.scene .hint{position:absolute;left:50%;bottom:34px;transform:translateX(-50%);background:rgba(255,255,255,.9);padding:5px 12px;border-radius:999px;font-size:12px;font-weight:700;color:var(--ink);pointer-events:none;white-space:nowrap;transition:opacity 1s}
.scene .map{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);width:140px;height:14px;border-radius:7px;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.5);pointer-events:none}
.scene .map i{position:absolute;top:1px;bottom:1px;border-radius:6px;background:rgba(255,255,255,.65)}
.scene .map b{position:absolute;top:4px;width:5px;height:5px;border-radius:50%;background:#FFD54A;box-shadow:0 0 3px #000}
.scene .pan{position:absolute;top:50%;transform:translateY(-50%);width:34px;height:60px;display:grid;place-items:center;font-size:22px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.5);background:rgba(0,0,0,.18);border-radius:10px;opacity:.75}
.scene .pan.l{left:6px}.scene .pan.r{right:6px}
.scene .pan:disabled{opacity:.15}
.places{display:flex;gap:6px;padding:10px 12px 4px}
.place{flex:1;padding:8px 2px;border-radius:14px;background:#FFF;border:2px solid #E8DFC3;font-weight:900;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 3px 0 #D9CCA6}
.place img{width:28px;height:28px}
.place.on{border-color:var(--accent);background:#FFF1E3;transform:translateY(-2px);box-shadow:0 5px 0 var(--accent-2)}
.place:active{transform:translateY(2px);box-shadow:0 1px 0 #D9CCA6}
.place small{font-size:11px;color:var(--dim);font-weight:700}

.tabs{display:flex;gap:8px;padding:10px 12px 0}
.tab{flex:1;padding:10px 0 8px;border-radius:16px 16px 0 0;background:#EFE6CB;color:var(--dim);font-family:var(--display);font-size:17px;display:flex;align-items:center;justify-content:center;gap:6px;border:2px solid #E5D9B8;border-bottom:0}
.tab img{width:22px;height:22px}
.tab.on{background:#FFF;color:var(--ink);border-color:#D9CCA6;transform:translateY(2px)}
.sheet{flex:1;margin:0 12px 12px;background:#FFF;border:2px solid #D9CCA6;border-top:0;border-radius:0 0 18px 18px;overflow:auto;padding:12px;min-height:0}
.view[hidden]{display:none}
.recent h4,.dex h4{margin:0 0 8px;font-family:var(--display);font-size:16px;color:var(--dim);font-weight:400;display:flex;justify-content:space-between;align-items:center}
.strip{display:flex;flex-wrap:wrap;gap:8px;padding-bottom:4px}
.strip .mini{flex:none;width:calc((100% - 32px) / 5);text-align:center;font-size:11px;font-weight:700}
.strip .mini .b{width:100%;aspect-ratio:1;border-radius:14px;background:var(--cream);border:2px solid var(--line);display:grid;place-items:center}
.strip .mini img{width:80%;height:80%}
.empty{color:var(--dim);font-size:13px;text-align:center;padding:18px 0;font-weight:700}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{padding:5px 11px;border-radius:999px;background:#F2EBD6;font-size:12px;font-weight:900;color:var(--dim);border:2px solid transparent}
.chip.on{background:#FFF1E3;color:var(--accent-2);border-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.card{position:relative;background:var(--cream);border:2px solid var(--line);border-radius:16px;padding:8px 4px 6px;text-align:center;box-shadow:0 3px 0 #E8DFC3;transition:transform .05s}
.card:active{transform:translateY(2px);box-shadow:0 1px 0 #E8DFC3}
.card img{width:64px;height:64px}
.card .nm{font-weight:900;font-size:12px;margin-top:2px;line-height:1.2}
.card.unknown img{filter:brightness(0) opacity(.22)}
.card.unknown .nm{color:#B5AA8E}
.card .cnt{position:absolute;top:6px;right:6px;background:var(--accent);color:#FFF;font-size:10px;font-weight:900;border-radius:999px;padding:2px 6px}
.card .rare{position:absolute;top:6px;left:6px;font-size:12px}
.card.new::after{content:"NEW";position:absolute;bottom:6px;right:6px;background:var(--red);color:#FFF;font-size:9px;font-weight:900;border-radius:6px;padding:1px 5px}

.modal{position:absolute;inset:0;z-index:20;display:grid;place-items:center;background:rgba(31,58,26,.55);padding:12px}
.modal[hidden]{display:none}
.modal .box{width:100%;max-width:360px;max-height:96%;display:flex;flex-direction:column;overflow:hidden;background:#FFF;border-radius:20px;padding:12px 14px 12px;box-shadow:0 30px 60px -20px rgba(0,0,0,.6);animation:pop .35s cubic-bezier(.2,1.4,.4,1);position:relative}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.modal .badge{display:inline-block;align-self:flex-start;background:var(--red);color:#FFF;font-family:var(--display);font-size:14px;padding:3px 12px;border-radius:999px;margin-bottom:4px;animation:wiggle .6s ease-in-out 2}
.modal .badge.again{background:var(--blue)}
@keyframes wiggle{25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
.modal .hero{flex:0 1 auto;min-height:70px;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,#FFF8E6,#F2EBD6);border-radius:16px;padding:6px;margin-bottom:6px;position:relative;overflow:hidden}
.modal .hero img{height:clamp(80px,20dvh,150px);width:auto;max-height:100%;filter:drop-shadow(0 8px 6px rgba(0,0,0,.25));animation:bob 2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.modal h2{font-family:var(--display);font-size:22px;margin:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap;line-height:1.2}
.modal h2 .grp{font-family:var(--body);font-size:12px;font-weight:900;color:#FFF;background:var(--green);padding:3px 9px;border-radius:999px}
.modal h2 .grp.not{background:var(--purple)}
.modal .rows{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin:6px 0}
.modal .r{display:flex;flex-direction:column;gap:1px;font-size:12px;line-height:1.3;background:var(--cream);border-radius:10px;padding:5px 9px}
.modal .r.wide{grid-column:1/-1}
.modal .r b{color:var(--accent-2);font-weight:900;font-size:11px}
.modal .fact{background:#FFF1E3;border:2px dashed var(--accent);border-radius:12px;padding:7px 10px;font-size:12.5px;font-weight:700;line-height:1.4;overflow:auto;min-height:0}
.modal .fact::before{content:"💡 알고 있나요? ";color:var(--accent-2)}
.modal .close{flex:none;width:100%;margin-top:8px;padding:11px;border-radius:12px;background:var(--accent);color:#FFF;font-family:var(--display);font-size:17px;box-shadow:0 4px 0 var(--accent-2)}
.modal .close:active{transform:translateY(3px);box-shadow:0 1px 0 var(--accent-2)}
.modal .cnt{font-size:11px;color:var(--dim);font-weight:700;text-align:right;margin-top:4px}
.toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:#FFF;border:2px solid var(--accent);color:var(--ink);padding:8px 16px;border-radius:999px;font-weight:900;font-size:14px;z-index:9;box-shadow:0 8px 20px -8px rgba(0,0,0,.4);animation:tin .3s;white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis}
.toast[hidden]{display:none}
@keyframes tin{from{transform:translate(-50%,-12px);opacity:0}}
.confetti{position:absolute;inset:0;pointer-events:none;z-index:25}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="phone" id="phone">
  <div class="hud">
    <h1 class="disp"><img class="px" id="logo" alt="">곤충 탐험대</h1>
    <div class="prog"><span id="progText">0/0</span><span class="bar"><i id="progBar" style="width:0%"></i></span><button class="snd" id="sndBtn" title="소리">🔊</button></div>
  </div>
  <div class="scene" id="scene">
    <canvas id="cv"></canvas>
    <div class="label"><span id="placeName">풀밭</span><small id="placeHint"></small></div>
    <button class="daynight" id="dayBtn">☀️ 낮</button>
    <button class="pan l" id="panL">◀</button><button class="pan r" id="panR">▶</button>
    <div class="hint" id="hint">곤충을 톡! 화면을 옆으로 밀면 더 넓은 곳을 볼 수 있어요</div>
    <div class="map" id="map"><i id="mapView"></i></div>
  </div>
  <div class="places" id="places"></div>
  <div class="tabs">
    <button class="tab on" data-v="ex"><img class="px" alt="" data-ico="net">탐험</button>
    <button class="tab" data-v="dex"><img class="px" alt="" data-ico="book">도감</button>
  </div>
  <div class="sheet">
    <div class="view recent" id="v-ex">
      <h4>방금 잡은 곤충 <span id="todayCnt" style="font-family:var(--body);font-size:12px;font-weight:700"></span></h4>
      <div class="strip" id="strip"></div>
      <div class="empty" id="stripEmpty">아직 잡은 곤충이 없어요. 위에서 곤충을 찾아보세요!</div>
    </div>
    <div class="view dex" id="v-dex" hidden>
      <div class="filters" id="filters"></div>
      <div class="grid" id="grid"></div>
    </div>
  </div>
  <div class="modal" id="modal" hidden><div class="box" id="mbox"></div></div>
  <canvas class="confetti" id="confetti"></canvas>
  <div class="toast" id="toast" hidden></div>
</div>

<script>
(function () {
'use strict';
const $ = id => document.getElementById(id);
const SAVE_KEY = 'bug-explorer-v2';
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/*__BUGS_DATA__*/

// ======================= 픽셀 아이콘 =======================
const PAL = { e: '#1A1018', k: '#2E2A33', r: '#E53935', y: '#FFD54A', g: '#7CC24A', G: '#3F8A2A', b: '#8A5A2B', n: '#F3E7C3', t: '#D6EEFF', m: '#8FD3FF', c: '#5ED3F3', o: '#FF8A3D', w: '#FFFFFF' };
const ICO = {
  net: ['................','.........kk.....','........kk......','.......kk.......','......kk........','.....kk.........','....kk..........','...kk...........','..ttttt.........','.t.t.t.t........','.ttttttt........','.t.t.t.t........','.ttttttt........','..ttttt.........','................','................'],
  book: ['................','..bbbbbbbbbbbb..','..bnnnnnnnnnnb..','..bnnnnnnnnnnb..','..bnkkkknnnnnb..','..bnnnnnnnnnnb..','..bnkkkkkknnnb..','..bnnnnnnnnnnb..','..bnkkkkknnnnb..','..bnnnnnnnnnnb..','..bnkkkkkkknnb..','..bnnnnnnnnnnb..','..bbbbbbbbbbbb..','................','................','................'],
  meadow: ['................','................','......y.........','.....yyy........','......y.........','.......G........','.G.....G..G.....','.G..G..G..G..G..','.G..G.GG..G..G..','GG..G.G..GG.GG..','gggggggggggggggg','gggggggggggggggg','gGggGggGggGggGgg','gggggggggggggggg','................','................'],
  forest: ['................','.......G........','......GGG.......','.....GGGGG......','....GGGGGGG.....','...GGGGGGGGG....','.....GGGGG......','....GGGGGGG.....','...GGGGGGGGG....','..GGGGGGGGGGG...','.......bb.......','.......bb.......','gggggggggggggggg','gggggggggggggggg','................','................'],
  pond: ['................','................','...G.......G....','...G..G....G....','...G..G....G....','.mmmmmmmmmmmmmm.','mmmmmcmmmmcmmmmm','mmcmmmmmmmmmmmcm','mmmmmmmmcmmmmmmm','mmmmcmmmmmmmcmmm','.mmmmmmmmmmmmmm.','..bbbbbbbbbbbb..','................','................','................','................'],
  yard: ['................','.......r........','......rrr.......','.....rrrrr......','....rrrrrrr.....','...rrrrrrrrr....','...nnnnnnnnn....','...nnnnnnnnn....','...nnkknnkkn....','...nnkknnkkn....','...nnnnnnnnn....','...nnnnbbnnn....','gggnnnnbbnnnggg.','gggggggggggggggg','gGggGggGggGggGgg','................'],
  bug: ['................','....e......e....','.....e....e.....','......eeee......','.....eeeeee.....','....rrrrrrrr....','...rrerrrrerr...','...rrrrrrrrrr...','...rrrrerrrrr...','..k.rrrrrrrr.k..','...krrerrerrk...','....rrrrrrrr....','.....rrrrrr.....','......rrrr......','................','................'],
};
function icon(name) {
  const rows = ICO[name], c = document.createElement('canvas'); c.width = 16; c.height = 16; const x = c.getContext('2d');
  rows.forEach((r, y) => [...r].forEach((ch, i) => { if (ch !== '.') { x.fillStyle = PAL[ch]; x.fillRect(i, y, 1, 1); } }));
  return c.toDataURL();
}
// 곤충 그림 캐시
const svgCache = new Map(), imgCache = new Map();
const BUG = Object.fromEntries(BUGS.map(b => [b.id, b]));
function bugURL(id) { if (!svgCache.has(id)) { const b = BUG[id]; svgCache.set(id, 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(T[b.tpl](b.opt))); } return svgCache.get(id); }
function bugImg(id) { if (!imgCache.has(id)) { const im = new Image(); im.src = bugURL(id); imgCache.set(id, im); } return imgCache.get(id); }
const BIG = new Set(['rhino', 'rhino_f', 'stag', 'stag_saw', 'stag_king', 'swallowtail', 'swallowtail2', 'black_sw', 'monarch', 'peacock', 'mantis', 'mantis_big', 'mantis_brown', 'stick', 'waterbug', 'emperor', 'luna', 'locust', 'katydid', 'centipede', 'earthworm', 'hornet', 'hawkmoth', 'cicada_black', 'silkworm', 'swallow_cat']);
const SMALL = new Set(['ant', 'ant_red', 'termite', 'ladybug', 'ladybug2', 'ladybug28', 'firefly', 'firefly2', 'strider', 'damselfly', 'mayfly', 'aphid', 'fruitfly', 'mosquito', 'weevil', 'pillbug', 'jumping_spider', 'blue_bf', 'housefly', 'click', 'darkling', 'lacewing']);
const sizeOf = id => BIG.has(id) ? 112 : SMALL.has(id) ? 72 : 94;

const PLACES = [
  { id: 'meadow', name: '풀밭', hint: '꽃과 풀 사이를 잘 봐요', sky: ['#9FDBFF', '#D8F1FF'], nightSky: ['#141B38', '#2B3A66'] },
  { id: 'forest', name: '숲', hint: '나무 위와 아래를 살펴요', sky: ['#8FD3FF', '#CFF0E0'], nightSky: ['#0F1530', '#1E2A52'] },
  { id: 'pond', name: '연못', hint: '물 위와 물속을 봐요', sky: ['#A8E0FF', '#E3F5FF'], nightSky: ['#121A3A', '#223060'] },
  { id: 'yard', name: '마당', hint: '화분 밑과 벽을 살펴요', sky: ['#B5E3FF', '#EAF7FF'], nightSky: ['#171C3A', '#2E3A6A'] },
];

// ======================= 저장 =======================
let S;
function fresh() { return { caught: {}, seen: [], recent: [], sound: true, place: 'meadow', night: false, total: 0 }; }
function load() { try { const r = localStorage.getItem(SAVE_KEY); if (r) { S = Object.assign(fresh(), JSON.parse(r)); return; } } catch (e) {} S = fresh(); }
function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {} }

// ======================= 소리 =======================
let AC = null;
function beep(seq) {
  if (!S.sound) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)(); const t0 = AC.currentTime;
    seq.forEach(([f, d, at, type]) => { const o = AC.createOscillator(), g = AC.createGain(); o.type = type || 'triangle'; o.frequency.value = f; g.gain.setValueAtTime(.0001, t0 + at); g.gain.exponentialRampToValueAtTime(.25, t0 + at + .01); g.gain.exponentialRampToValueAtTime(.0001, t0 + at + d); o.connect(g); g.connect(AC.destination); o.start(t0 + at); o.stop(t0 + at + d + .05); });
  } catch (e) {}
}
const SND = { catch: [[660, .12, 0], [880, .18, .1]], new: [[523, .12, 0], [659, .12, .1], [784, .12, .2], [1047, .3, .3]], miss: [[300, .12, 0, 'sawtooth'], [220, .15, .08, 'sawtooth']], tap: [[440, .05, 0, 'square']] };

// ======================= 넓은 탐험 세계 =======================
const W = 400, H = 400, WW = 1200, GROUND = 300, WATER = 250;
const cv = $('cv'), ctx = cv.getContext('2d');
function resize() { const r = cv.getBoundingClientRect(), d = Math.min(2, devicePixelRatio || 1); cv.width = Math.round(r.width * d); cv.height = Math.round(r.height * d); }
new ResizeObserver(resize).observe(cv); resize();
let bugs = [], spawnT = .5, net = null, t = 0, last = performance.now() / 1000, puffs = [], misses = [], sparkles = [];
let cam = (WW - W) / 2, camTarget = cam;
const placeOf = () => PLACES.find(p => p.id === S.place);
// 장소별 장식물 위치(고정 난수)
function seeded(n) { let x = Math.sin(n * 9301 + 49297) * 233280; return x - Math.floor(x); }
const flowers = Array.from({ length: 44 }, (_, i) => ({ x: seeded(i) * WW, y: GROUND - 40 + seeded(i + 100) * 90, c: ['#FF8FB1', '#FFD54A', '#FFFFFF', '#B48CFF', '#FF8A3D'][i % 5] }));
const grassBlades = Array.from({ length: 120 }, (_, i) => ({ x: seeded(i + 300) * WW, y: GROUND - 50 + seeded(i + 500) * 100, h: 10 + (i % 3) * 5 }));
const trees = Array.from({ length: 16 }, (_, i) => ({ x: i * 80 + 20 }));
const pads = Array.from({ length: 12 }, (_, i) => ({ x: 40 + i * 100, y: WATER + 30 + (i % 2) * 60 }));

function spawnable() { return BUGS.filter(b => b.place.includes(S.place) && (b.time === 'both' || (S.night ? b.time === 'night' : b.time === 'day'))); }
function spawn() {
  const pool = spawnable(); if (!pool.length) return;
  const weighted = []; pool.forEach(b => { for (let i = 0; i < [6, 3, 1][b.rare]; i++) weighted.push(b); });
  const b = pick(weighted);

function renderPlaces() {
  const box = $('places'); box.innerHTML = '';
  PLACES.forEach(p => { const b = document.createElement('button'); b.className = 'place' + (p.id === S.place ? ' on' : ''); const got = BUGS.filter(x => x.place.includes(p.id) && S.caught[x.id]).length, all = BUGS.filter(x => x.place.includes(p.id)).length;
    b.innerHTML = `<img class="px" src="${icon(p.id)}" alt="">${p.name}<small>${got}/${all}</small>`; b.addEventListener('click', () => { if (S.place !== p.id) { S.place = p.id; bugs = []; spawnT = .3; save(); renderPlaces(); renderScene(); beep(SND.tap); } }); box.appendChild(b); });
}
function renderScene() { const p = placeOf(); $('placeName').textContent = (S.night ? '밤의 ' : '') + p.name; $('placeHint').textContent = p.hint; $('dayBtn').textContent = S.night ? '🌙 밤' : '☀️ 낮'; }
function renderStrip() {
  const st = $('strip'); st.innerHTML = ''; $('stripEmpty').hidden = S.recent.length > 0;
  S.recent.forEach(id => { const b = BUG[id]; if (!b) return; const d = document.createElement('button'); d.className = 'mini'; d.innerHTML = `<div class="b"><img src="${bugURL(id)}" alt=""></div>${b.name}`; d.addEventListener('click', () => showCard(b, 'view')); st.appendChild(d); });
}
let filter = 'all';
function renderGrid() {
  const fs = $('filters'); if (!fs.children.length) {
    [['all', '전체'], ['meadow', '풀밭'], ['forest', '숲'], ['pond', '연못'], ['yard', '마당'], ['night', '🌙 밤'], ['rare', '⭐ 희귀'], ['not', '곤충 아님'], ['got', '✅ 잡은 것']].forEach(([k, label]) => { const c = document.createElement('button'); c.className = 'chip' + (k === filter ? ' on' : ''); c.dataset.k = k; c.textContent = label; c.addEventListener('click', () => { filter = k; [...fs.children].forEach(x => x.classList.toggle('on', x.dataset.k === k)); renderGrid(); }); fs.appendChild(c); });
  }
  const list = BUGS.filter(b => filter === 'all' || (filter === 'night' ? b.time !== 'day' : filter === 'rare' ? b.rare === 2 : filter === 'not' ? b.notInsect : filter === 'got' ? S.caught[b.id] : b.place.includes(filter)));
  const grid = $('grid'); grid.innerHTML = '';
  list.forEach(b => { const n = S.caught[b.id] || 0, known = n > 0; const c = document.createElement('button'); c.className = 'card' + (known ? '' : ' unknown') + (known && S.recent[0] === b.id && n === 1 ? ' new' : '');
    c.innerHTML = `${b.rare === 2 ? '<span class="rare">⭐</span>' : ''}${known ? `<span class="cnt">${n}</span>` : ''}<img src="${bugURL(b.id)}" alt="" loading="lazy"><div class="nm">${known ? b.name : '???'}</div>`;
    c.addEventListener('click', () => { if (known) showCard(b, 'view'); else { toast(`${b.place.map(p => PLACES.find(x => x.id === p).name).join('·')}에서 ${b.time === 'night' ? '밤에 ' : b.time === 'day' ? '낮에 ' : ''}찾아보세요!`); beep(SND.tap); } });
    grid.appendChild(c); });
}
function showView(v) { document.querySelectorAll('.view').forEach(x => x.hidden = x.id !== 'v-' + v); document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.v === v)); }

// ======================= 시작 =======================
load();
$('logo').src = icon('bug'); document.querySelectorAll('[data-ico]').forEach(img => img.src = icon(img.dataset.ico));
BUGS.forEach(b => bugImg(b.id));
renderHud(); renderPlaces(); renderScene(); renderStrip(); renderGrid();
$('dayBtn').addEventListener('click', () => { S.night = !S.night; bugs = []; spawnT = .3; save(); renderScene(); beep(SND.tap); toast(S.night ? '🌙 밤이 되었어요. 밤에만 나오는 곤충을 찾아보세요!' : '☀️ 아침이 밝았어요!'); });
$('sndBtn').addEventListener('click', () => { S.sound = !S.sound; save(); renderHud(); beep(SND.tap); });
document.querySelectorAll('.tab').forEach(tb => tb.addEventListener('click', () => { showView(tb.dataset.v); beep(SND.tap); }));
requestAnimationFrame(tick);
window.__dbg = { bugs: () => bugs, tap: tapAt, time: () => t, cam: () => cam };
setTimeout(() => { $('hint').style.opacity = 0; }, 7000);
})();
</script>
