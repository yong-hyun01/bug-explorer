<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>곤충 탐험대</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
:root{
  --sky:#BDE8FF; --grass:#7CC24A; --grass-2:#4E9A2E; --accent:#FF8A3D; --accent-2:#E0661C;
  --ink:#1F3A1A; --dim:#5E7A58; --cream:#FFF8E6; --line:#E5D9B8;
  --green:#4E9A2E; --red:#E53935; --blue:#3B82F6; --purple:#8B5CF6;
  --display:"Jua","Noto Sans KR",sans-serif; --body:"Noto Sans KR",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:#DCEFC7;color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;display:flex;justify-content:center;align-items:center;min-height:100dvh;background-image:radial-gradient(circle at 50% 20%,#F2FBE4 0,#DCEFC7 60%)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
img.px{image-rendering:pixelated}
.disp{font-family:var(--display);font-weight:400}
.phone{width:100%;max-width:430px;height:100dvh;max-height:900px;background:var(--cream);overflow:hidden;position:relative}
.scroller{height:100%;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;display:flex;flex-direction:column;scroll-behavior:smooth}
@media(min-width:480px) and (min-height:720px){.phone{height:min(900px,96dvh);border-radius:34px;border:1px solid #CFC2A0;box-shadow:0 40px 80px -30px rgba(40,60,20,.6),0 0 0 8px #F6EEDC}}

.hud{display:flex;justify-content:space-between;align-items:center;padding:12px 16px 8px;background:linear-gradient(180deg,#FFF3D6,var(--cream))}
.hud h1{font-family:var(--display);font-size:24px;margin:0;color:var(--ink);display:flex;align-items:center;gap:8px}
.hud h1 img{width:28px;height:28px}
.hud .prog{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px;color:var(--dim)}
.hud .bar{width:80px;height:10px;border-radius:5px;background:#E8DFC3;overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.15)}
.hud .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--grass),var(--grass-2));transition:width .4s}
.hud .snd{width:34px;height:34px;border-radius:50%;background:#FFF;box-shadow:0 2px 0 #D9CCA6;font-size:16px;display:grid;place-items:center}

.scene{position:relative;margin:0 12px;border-radius:18px;overflow:hidden;background:#000;aspect-ratio:1/1;max-height:50dvh;border:3px solid #FFF;box-shadow:0 8px 24px -8px rgba(0,0,0,.35);flex:none}
.scene canvas{width:100%;height:100%;display:block;touch-action:pan-y;cursor:grab}
.scene .label{position:absolute;top:10px;left:12px;font-family:var(--display);font-size:20px;color:#FFF;text-shadow:0 2px 0 rgba(0,0,0,.35),0 0 10px rgba(0,0,0,.3);pointer-events:none}
.scene .label small{display:block;font-family:var(--body);font-size:12px;font-weight:700;opacity:.9}
.scene .daynight{position:absolute;top:10px;right:10px;padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.9);font-weight:900;font-size:13px;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.scene .hint{position:absolute;left:50%;bottom:34px;width:max-content;max-width:92%;white-space:normal;text-align:center;line-height:1.35;transform:translateX(-50%);background:rgba(255,255,255,.9);padding:5px 12px;border-radius:999px;font-size:12px;font-weight:700;color:var(--ink);pointer-events:none;transition:opacity 1s}
.scene .map{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);width:140px;height:14px;border-radius:7px;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.5);pointer-events:none}
.scene .map i{position:absolute;top:1px;bottom:1px;border-radius:6px;background:rgba(255,255,255,.65)}
.scene .map b{position:absolute;top:4px;width:5px;height:5px;border-radius:50%;background:#FFD54A;box-shadow:0 0 3px #000}
.pad{display:flex;justify-content:space-between;align-items:center;padding:8px 14px 0;gap:10px;user-select:none;-webkit-user-select:none}
.dpad{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(2,44px);gap:4px}
.dpad button{background:#FFF;border:2px solid #E8DFC3;border-radius:12px;font-size:20px;font-weight:900;color:var(--ink);box-shadow:0 4px 0 #D9CCA6;touch-action:none}
.dpad button:active,.dpad button.on{transform:translateY(3px);box-shadow:0 1px 0 #D9CCA6;background:#FFF1E3;border-color:var(--accent)}
.dpad .l{grid-column:1;grid-row:1/3}.dpad .r{grid-column:3;grid-row:1/3}.dpad .u{grid-column:2;grid-row:1}.dpad .d{grid-column:2;grid-row:2}
.acts{display:flex;align-items:flex-end;gap:8px}
.jumpb{width:62px;height:62px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#9FE07A,#4E9A2E);color:#FFF;font-family:var(--display);font-size:15px;box-shadow:0 5px 0 #2E6B1E,0 8px 16px rgba(0,0,0,.2);border:3px solid #FFF;touch-action:none;display:grid;place-items:center;line-height:1}
.jumpb:active,.jumpb.on{transform:translateY(4px);box-shadow:0 1px 0 #2E6B1E}
.jumpb[hidden]{display:none}
.catch{width:92px;height:92px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#FFB070,var(--accent));color:#FFF;font-family:var(--display);font-size:20px;box-shadow:0 6px 0 var(--accent-2),0 10px 20px rgba(0,0,0,.25);border:3px solid #FFF;touch-action:none;display:grid;place-items:center;line-height:1}
.catch small{font-family:var(--body);font-size:10px;font-weight:700;opacity:.9}
.catch:active,.catch.on{transform:translateY(5px);box-shadow:0 1px 0 var(--accent-2)}
.places{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;padding:8px 12px 4px}
.place{padding:5px 1px;font-size:12px;border-radius:14px;background:#FFF;border:2px solid #E8DFC3;font-weight:900;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 3px 0 #D9CCA6}
.place img{width:26px;height:26px}
.place.on{border-color:var(--accent);background:#FFF1E3;transform:translateY(-2px);box-shadow:0 5px 0 var(--accent-2)}
.place:active{transform:translateY(2px);box-shadow:0 1px 0 #D9CCA6}
.place small{font-size:11px;color:var(--dim);font-weight:700}

.tabs{display:flex;gap:8px;padding:10px 12px 0;position:sticky;top:0;z-index:5;background:var(--cream)}
.tabs::before{content:"";position:absolute;left:50%;top:3px;width:40px;height:4px;border-radius:2px;background:#D9CCA6;transform:translateX(-50%)}
.tab{flex:1;padding:10px 0 8px;border-radius:16px 16px 0 0;background:#EFE6CB;color:var(--dim);font-family:var(--display);font-size:17px;display:flex;align-items:center;justify-content:center;gap:6px;border:2px solid #E5D9B8;border-bottom:0}
.tab img{width:22px;height:22px}
.tab.on{background:#FFF;color:var(--ink);border-color:#D9CCA6;transform:translateY(2px)}
.sheet{flex:none;min-height:calc(var(--ph,100dvh) - 64px);margin:0 12px 12px;background:#FFF;border:2px solid #D9CCA6;border-top:0;border-radius:0 0 18px 18px;padding:12px}
.view[hidden]{display:none}
.recent h4,.dex h4{margin:0 0 8px;font-family:var(--display);font-size:16px;color:var(--dim);font-weight:400;display:flex;justify-content:space-between;align-items:center}
.strip{display:flex;flex-wrap:wrap;gap:8px;padding-bottom:4px}
.strip .mini{flex:none;width:calc((100% - 32px) / 5);text-align:center;font-size:11px;font-weight:700}
.strip .mini .b{width:100%;aspect-ratio:1;border-radius:14px;background:var(--cream);border:2px solid var(--line);display:grid;place-items:center}
.strip .mini img{width:80%;height:80%}
.strip .mini .b.photo{overflow:hidden}
.strip .mini .b.photo img{width:100%;height:100%;object-fit:cover;border-radius:12px}
.empty{color:var(--dim);font-size:13px;text-align:center;padding:18px 0;font-weight:700}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{padding:5px 11px;border-radius:999px;background:#F2EBD6;font-size:12px;font-weight:900;color:var(--dim);border:2px solid transparent}
.chip.on{background:#FFF1E3;color:var(--accent-2);border-color:var(--accent)}
.dexHead{display:flex;justify-content:space-between;align-items:center;gap:8px;position:sticky;top:50px;z-index:4;background:#FFF;margin:-12px -12px 6px;padding:10px 12px 8px;border-bottom:1px solid #EFE6CB}
.dexHead h4{margin:0}
.dexHead h4 span{font-family:var(--body);font-size:12px;font-weight:700;margin-left:6px}
.resetBtn{flex:none;padding:6px 12px;border-radius:999px;background:#FFF;border:2px solid #E6DCC0;color:var(--dim);font-size:12px;font-weight:900}
.resetBtn:active{background:#FFF1E3}
.modal .confirm{text-align:center;padding:6px 2px}
.modal .confirm .big{font-size:44px;line-height:1;margin-bottom:6px}
.modal .confirm h3{margin:0 0 6px;font-family:var(--display);font-size:20px;color:var(--ink);font-weight:400}
.modal .confirm p{margin:0 0 10px;font-size:13px;color:var(--dim);font-weight:700;line-height:1.5}
.modal .row2{display:flex;gap:8px}
.modal .row2 .close{margin-top:0;width:auto;flex:1 1 0;min-width:0}
.modal .close.ghost{background:#F2EBD6;color:var(--dim);box-shadow:0 4px 0 #D8CEB0}
.modal .close.danger{background:var(--red);box-shadow:0 4px 0 #9A2A26}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.card{position:relative;background:var(--cream);border:2px solid var(--line);border-radius:16px;padding:8px 4px 6px;text-align:center;box-shadow:0 3px 0 #E8DFC3;transition:transform .05s}
.card:active{transform:translateY(2px);box-shadow:0 1px 0 #E8DFC3}
.card img{width:64px;height:64px}
.card .pw{position:relative;width:100%;aspect-ratio:1;border-radius:12px;overflow:hidden;background:#EFE6CB}
.card .pw img.ph{width:100%;height:100%;object-fit:cover;display:block}
.card .pw .mini{position:absolute;right:3px;bottom:3px;width:26px;height:26px;border-radius:7px;background:rgba(255,248,230,.92);border:1.5px solid #fff;display:grid;place-items:center}
.card .pw .mini img{width:22px;height:22px}
.card .nm{font-weight:900;font-size:12px;margin-top:2px;line-height:1.2}
.card.unknown img{filter:brightness(0) opacity(.22)}
.card.unknown .nm{color:#B5AA8E}
.card .cnt{position:absolute;top:4px;right:4px;z-index:3;background:var(--accent);color:#FFF;font-size:11px;font-weight:900;border-radius:999px;padding:2px 7px;border:2px solid #FFF;box-shadow:0 2px 4px rgba(0,0,0,.35);line-height:1.2}
.card .rare{position:absolute;top:4px;left:5px;z-index:3;font-size:13px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5))}
.card.new::after{content:"NEW";position:absolute;bottom:6px;right:6px;z-index:3;background:var(--red);color:#FFF;font-size:9px;font-weight:900;border-radius:6px;padding:1px 5px}

.modal{position:absolute;inset:0;z-index:20;display:grid;place-items:center;background:rgba(31,58,26,.55);padding:12px}
.modal[hidden]{display:none}
.modal .box{width:100%;max-width:360px;max-height:96%;display:flex;flex-direction:column;overflow:hidden;background:#FFF;border-radius:20px;padding:12px 14px 12px;box-shadow:0 30px 60px -20px rgba(0,0,0,.6);animation:pop .35s cubic-bezier(.2,1.4,.4,1);position:relative}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.modal .badge{display:inline-block;align-self:flex-start;background:var(--red);color:#FFF;font-family:var(--display);font-size:14px;padding:3px 12px;border-radius:999px;margin-bottom:4px;animation:wiggle .6s ease-in-out 2}
.modal .badge.again{background:var(--blue)}
@keyframes wiggle{25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
.modal .mbody{flex:1 1 auto;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch}
.modal .hero{display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,#FFF8E6,#F2EBD6);border-radius:16px;padding:6px;margin-bottom:6px;position:relative;overflow:hidden;min-height:90px}
.modal .hero.photo{padding:0;background:#1F3A1A}
.modal .hero.photo img.ph{width:100%;height:clamp(140px,28dvh,220px);object-fit:cover;display:block;animation:none;filter:none}
.modal .hero .inset{position:absolute;right:8px;bottom:8px;width:56px;height:56px;border-radius:12px;background:rgba(255,248,230,.92);border:2px solid #fff;display:grid;place-items:center;box-shadow:0 4px 10px rgba(0,0,0,.3)}
.modal .hero .inset img{width:46px;height:46px;animation:none;filter:none}
.modal .credit{font-size:10px;color:var(--dim);text-align:right;margin:-2px 0 4px}
.modal .credit a{color:var(--dim)}
.modal .sci{font-family:var(--body);font-size:12px;font-weight:500;color:var(--dim);font-style:italic}
.modal details{margin-top:6px;background:var(--cream);border-radius:12px;padding:6px 10px}
.modal details summary{font-weight:900;font-size:13px;color:var(--accent-2);cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center}
.modal details summary::after{content:"▼";font-size:10px}
.modal details[open] summary::after{content:"▲"}
.modal details p{margin:6px 0 2px;font-size:12.5px;line-height:1.5;color:var(--ink)}
.modal details .more{font-size:11px;font-weight:700}
.modal .hero img{height:clamp(90px,20dvh,150px);width:auto;max-height:100%;filter:drop-shadow(0 8px 6px rgba(0,0,0,.25));animation:bob 2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.modal h2{font-family:var(--display);font-size:22px;margin:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap;line-height:1.2}
.modal h2 .grp{font-family:var(--body);font-size:12px;font-weight:900;color:#FFF;background:var(--green);padding:3px 9px;border-radius:999px}
.modal h2 .grp.not{background:var(--purple)}
.modal .rows{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin:6px 0}
.modal .r{display:flex;flex-direction:column;gap:1px;font-size:12px;line-height:1.3;background:var(--cream);border-radius:10px;padding:5px 9px}
.modal .r.wide{grid-column:1/-1}
.modal .r b{color:var(--accent-2);font-weight:900;font-size:11px}
.modal .fact{background:#FFF1E3;border:2px dashed var(--accent);border-radius:12px;padding:7px 10px;font-size:12.5px;font-weight:700;line-height:1.4;overflow:auto;min-height:0}
.modal .fact::before{content:"💡 알고 있나요? ";color:var(--accent-2)}
.modal .close{flex:none;width:100%;margin-top:8px;padding:11px;border-radius:12px;background:var(--accent);color:#FFF;font-family:var(--display);font-size:17px;box-shadow:0 4px 0 var(--accent-2)}
.modal .close:active{transform:translateY(3px);box-shadow:0 1px 0 var(--accent-2)}
.modal .cnt{font-size:11px;color:var(--dim);font-weight:700;text-align:right;margin-top:4px}
.toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:#FFF;border:2px solid var(--accent);color:var(--ink);padding:8px 16px;border-radius:999px;font-weight:900;font-size:14px;z-index:9;box-shadow:0 8px 20px -8px rgba(0,0,0,.4);animation:tin .3s;white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis}
.toast[hidden]{display:none}
@keyframes tin{from{transform:translate(-50%,-12px);opacity:0}}
.confetti{position:absolute;inset:0;pointer-events:none;z-index:25}
/* ---- 가로 모드 (태블릿·스마트폰 눕혔을 때): 왼쪽 탐험+키패드, 오른쪽 맵·도감 ---- */
.side{display:contents}
@media (orientation: landscape) and (min-width: 560px) {
  body{align-items:stretch}
  .phone{max-width:none;max-height:none;height:100dvh;border-radius:0;border:0;box-shadow:none}
  .scroller{--sc:min(calc(100dvh - 176px),calc(100vw - 340px),760px);display:grid;grid-template-columns:calc(var(--sc) + 12px) minmax(280px,520px);grid-template-rows:auto 1fr auto;grid-template-areas:"hud hud" "scene side" "pad side";column-gap:12px;justify-content:center;overflow:hidden;scroll-behavior:auto}
  .hud{grid-area:hud;padding:8px 16px 4px;max-width:1120px;width:100%;justify-self:center}
  .scene{grid-area:scene;width:var(--sc);height:var(--sc);aspect-ratio:auto;max-height:none;margin:0 0 0 12px;justify-self:start}
  .pad{grid-area:pad;align-self:start;padding:8px 12px 10px;margin-left:12px;justify-content:space-between}
  .side{display:flex;flex-direction:column;grid-area:side;min-height:0;overflow:auto;padding-right:12px;overscroll-behavior:contain}
  .places{padding:0 0 4px;grid-template-columns:repeat(5,1fr)}
  .place{padding:4px 2px;font-size:12px}.place img{width:22px;height:22px}.place small{font-size:10px}
  .tabs{padding:8px 0 0}
  .sheet{min-height:0;flex:1 1 auto;margin:0 0 10px}
  .scene .map{width:110px}
  .modal .box{max-width:560px}
  .modal .hero.photo img.ph{height:clamp(120px,32dvh,220px)}
}
@media (orientation: landscape) and (min-width: 560px) and (max-height: 520px) {
  /* 스마트폰 가로: 탐험 화면을 세로로 꽉 채우고 키패드는 오른쪽 아래에 */
  .scroller{--sc:min(calc(100dvh - 62px),calc(100vw - 340px));grid-template-rows:auto 1fr;grid-template-areas:"hud hud" "scene side"}
  .pad{grid-area:side;align-self:end;z-index:3;margin:0;padding:6px 10px 8px;background:linear-gradient(180deg,rgba(255,248,230,0),var(--cream) 30%)}
  .side{padding-bottom:96px}
  .dpad{grid-template-columns:repeat(3,44px);grid-template-rows:repeat(2,36px)}
  .catch{width:70px;height:70px;font-size:16px}.jumpb{width:50px;height:50px;font-size:13px}
  .hud{padding:6px 14px 2px}.hud h1{font-size:18px}
  .scene .hint{font-size:11px;line-height:1.3}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="phone" id="phone">
 <div class="scroller" id="scroller">
  <div class="hud">
    <h1 class="disp"><img class="px" id="logo" alt="">곤충 탐험대</h1>
    <div class="prog"><span id="progText">0/0</span><span class="bar"><i id="progBar" style="width:0%"></i></span><button class="snd" id="sndBtn" title="소리">🔊</button></div>
  </div>
  <div class="scene" id="scene">
    <canvas id="cv"></canvas>
    <div class="label"><span id="placeName">풀밭</span><small id="placeHint"></small></div>
    <button class="daynight" id="dayBtn">☀️ 낮</button>
    <div class="hint" id="hint">키패드를 짧게 톡톡 눌러 살금살금 다가간 뒤 잡기 버튼! 오래 달리면 도망가요</div>
    <div class="map" id="map"><i id="mapView"></i></div>
  </div>
  <div class="pad" id="pad">
    <div class="dpad"><button class="l" data-k="l">◀</button><button class="u" data-k="u" id="btnU">▲</button><button class="d" data-k="d" id="btnD">▼</button><button class="r" data-k="r">▶</button></div>
    <div class="acts"><button class="jumpb" data-k="j" id="btnJ">점프</button><button class="catch" data-k="a" id="btnA">잡기<small>휘두르기</small></button></div>
  </div>
  <div class="side" id="side">
  <div class="places" id="places"></div>
  <div class="tabs">
    <button class="tab on" data-v="ex"><img class="px" alt="" data-ico="net">탐험</button>
    <button class="tab" data-v="dex"><img class="px" alt="" data-ico="book">도감</button>
  </div>
  <div class="sheet">
    <div class="view recent" id="v-ex">
      <h4>방금 잡은 곤충 <span id="todayCnt" style="font-family:var(--body);font-size:12px;font-weight:700"></span></h4>
      <div class="strip" id="strip"></div>
      <div class="empty" id="stripEmpty">아직 잡은 곤충이 없어요. 키패드로 다가가서 잡아 보세요!</div>
    </div>
    <div class="view dex" id="v-dex" hidden>
      <div class="dexHead"><h4>곤충 도감 <span id="dexCnt"></span></h4><button class="resetBtn" id="resetBtn">🗑️ 초기화</button></div>
      <div class="filters" id="filters"></div>
      <div class="grid" id="grid"></div>
    </div>
  </div>
  </div>
 </div>
  <div class="modal" id="modal" hidden><div class="box" id="mbox"></div></div>
  <canvas class="confetti" id="confetti"></canvas>
  <div class="toast" id="toast" hidden></div>
</div>

<script>
(function () {
'use strict';

// 입력: 키패드(터치) + 키보드
function swingNet() {
  player.swing = .32; player.cd = .5; const [nx, ny] = netCenter(); net = { x: nx, y: ny + 20, t: 0 };
  let best = null, bd = 1e9;
  for (const u of bugs) { const dx = (u.x - nx) / NET_RX, dy = (u.y + u.hop - ny) / NET_RY, d = dx * dx + dy * dy; if (d <= 1 && d < bd) { bd = d; best = u; } }
  if (!best) { player.oops = .7; misses.push({ x: nx, y: ny, t: 0 }); beep(SND.miss); for (const u of bugs) if (!u.leave && u.b.move !== 'still' && Math.hypot(u.x - nx, u.y + u.hop - ny) < 110 && Math.random() < .5) flee(u); return; }
  bugs.splice(bugs.indexOf(best), 1); player.happy = 1.2; keys.a = false;
  for (let i = 0; i < 16; i++) puffs.push({ x: best.x, y: best.y, vx: rnd(-120, 120), vy: rnd(-200, -40), t: 0, life: rnd(.4, .8), s: rnd(3, 6), c: pick(['#FFD54A', '#FF8A3D', '#FF8FB1', '#7CC24A', '#5ED3F3', '#FFF']) });
  caught(best.b);
}
const KEYMAP = { ArrowLeft: 'l', ArrowRight: 'r', ArrowUp: 'u', ArrowDown: 'd', KeyA: 'l', KeyD: 'r', KeyW: 'u', KeyS: 'd', Space: 'j', KeyX: 'j', Enter: 'a', KeyZ: 'a', KeyJ: 'a', KeyK: 'j', NumpadEnter: 'a' };
const keyOf = e => KEYMAP[e.code] || ({ ' ': 'j', Enter: 'a', z: 'a', Z: 'a', x: 'j', X: 'j', a: 'l', d: 'r', w: 'u', s: 'd', A: 'l', D: 'r', W: 'u', S: 'd', 'ㅁ': 'l', 'ㅇ': 'r', 'ㅈ': 'u', 'ㄴ': 'd', 'ㅋ': 'a', 'ㅌ': 'j' })[e.key];
window.addEventListener('keydown', e => { const k = keyOf(e); if (!k || !$('modal').hidden) return; e.preventDefault(); keys[k] = true; document.querySelector(`[data-k="${k}"]`)?.classList.add('on'); });
window.addEventListener('keyup', e => { const k = keyOf(e); if (!k) return; keys[k] = false; document.querySelector(`[data-k="${k}"]`)?.classList.remove('on'); });
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
document.querySelectorAll('#pad [data-k]').forEach(btn => {
  const k = btn.dataset.k, on = e => { e.preventDefault(); keys[k] = true; btn.classList.add('on'); try { btn.setPointerCapture(e.pointerId); } catch (_) {} }, off = () => { keys[k] = false; btn.classList.remove('on'); };
  btn.addEventListener('pointerdown', on); btn.addEventListener('pointerup', off); btn.addEventListener('pointercancel', off); btn.addEventListener('lostpointercapture', off); btn.addEventListener('contextmenu', e => e.preventDefault());
});
cv.addEventListener('pointerdown', e => { e.preventDefault(); toast('아래 키패드로 움직이고 잡기 버튼으로 휘둘러요!'); });

// ======================= 잡았을 때 =======================
function caught(b) {
  const first = !S.caught[b.id];
  S.caught[b.id] = (S.caught[b.id] || 0) + 1; S.total++;
  S.recent = [b.id, ...S.recent.filter(x => x !== b.id)].slice(0, 30);
  if (first) S.seen.push(b.id);
  save(); renderHud(); renderStrip(); renderGrid(); renderPlaces();
  beep(first ? SND.new : SND.catch);
  if (first) { confetti(); setTimeout(() => showCard(b, 'new'), 380); }
  else toast(`${b.name} ${S.caught[b.id]}마리째! 도감에서 다시 볼 수 있어요`);
}
function photoThumb(b, cls) {
  const ph = PHOTOS[b.id];
  if (!ph || !ph.img) return `<img src="${bugURL(b.id)}" alt="">`;
  return `<div class="pw ${cls || ''}"><img class="ph" src="${ph.img}" alt="${b.name}" loading="lazy" onerror="this.parentElement.outerHTML='<img src=&quot;${bugURL(b.id)}&quot; alt=&quot;&quot;>'"><span class="mini"><img src="${bugURL(b.id)}" alt=""></span></div>`;
}
window.photoFail = img => { const hero = img.parentElement, ins = hero.querySelector('.inset'); hero.className = 'hero'; if (ins) { const il = ins.querySelector('img'); ins.remove(); img.replaceWith(il); } else img.remove(); const cr = hero.nextElementSibling; if (cr && cr.classList.contains('credit')) cr.remove(); };
function showCard(b, mode) {
  const box = $('mbox'); const n = S.caught[b.id] || 0, ph = PHOTOS[b.id];
  box.innerHTML = `
    ${mode === 'new' ? '<span class="badge">🎉 새로운 곤충 발견!</span>' : mode === 'again' ? '<span class="badge again">또 잡았어요!</span>' : ''}
    <div class="mbody">
    ${ph && ph.img ? `<div class="hero photo"><img class="ph" src="${ph.img}" alt="${b.name} 사진" onerror="photoFail(this)"><div class="inset"><img src="${bugURL(b.id)}" alt=""></div></div><div class="credit">사진·설명 출처: <a href="${ph.url || '#'}" target="_blank" rel="noopener">위키백과</a></div>` : `<div class="hero"><img src="${bugURL(b.id)}" alt="${b.name}"></div>`}
    <h2 class="disp">${b.name} <span class="grp${b.notInsect ? ' not' : ''}">${b.grp}</span>${b.rare === 2 ? ' <span title="아주 드물어요">⭐</span>' : ''}</h2>
    ${ph && ph.sci && ph.lang === 'ko' ? `<div class="sci">${ph.sci}</div>` : ''}
    <div class="rows">
      <div class="r wide"><b>크기</b><span>${b.size}</span></div>
      <div class="r"><b>먹이</b><span>${b.food}</span></div>
      <div class="r"><b>사는 곳</b><span>${b.home}</span></div>
      <div class="r wide"><b>언제 · 어디서</b><span>${b.time === 'night' ? '🌙 밤에 나와요' : b.time === 'day' ? '☀️ 낮에 나와요' : '☀️🌙 낮과 밤 모두'} · ${b.place.map(p => PLACES.find(x => x.id === p).name).join('·')}</span></div>
      <div class="r wide"><b>한살이</b><span>${lifecycle(b)}</span></div>
    </div>
    <div class="fact">${b.fact}</div>
    ${ph && ph.extract && ph.lang === 'ko' ? `<details><summary>📖 더 알아보기</summary><p>${ph.extract.replace(/</g, '&lt;')}</p>${ph.url ? `<a class="more" href="${ph.url}" target="_blank" rel="noopener">위키백과에서 더 읽기 →</a>` : ''}</details>` : ''}
    <div class="cnt">지금까지 ${n}마리 잡았어요</div>
    </div>
    <button class="close" id="mClose">${mode === 'new' ? '도감에 넣기!' : '좋아요!'}</button>`;
  modalOpenedAt = performance.now(); for (const k in keys) keys[k] = false; document.querySelectorAll('#pad .on').forEach(b => b.classList.remove('on'));
  $('modal').hidden = false; $('mClose').onclick = () => { if (performance.now() - modalOpenedAt < 300) return; $('modal').hidden = true; beep(SND.tap); };
}
let modalOpenedAt = 0;
$('modal').addEventListener('click', e => { if (e.target === $('modal') && performance.now() - modalOpenedAt > 600) $('modal').hidden = true; });
function confetti() {
  const c = $('confetti'), x = c.getContext('2d'); const r = c.getBoundingClientRect(); c.width = r.width; c.height = r.height;
  const ps = Array.from({ length: 90 }, () => ({ x: rnd(0, c.width), y: rnd(-c.height * .3, 0), vx: rnd(-40, 40), vy: rnd(80, 220), s: rnd(5, 10), c: pick(['#FFD54A', '#FF8A3D', '#FF8FB1', '#7CC24A', '#5ED3F3', '#B48CFF']), rot: rnd(0, 6.3), vr: rnd(-4, 4) }));
  let t0 = performance.now();
  (function step(now) { const dt = Math.min(.05, (now - t0) / 1000); t0 = now; x.clearRect(0, 0, c.width, c.height); let alive = false;
    for (const p of ps) { p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt; if (p.y < c.height) alive = true; x.save(); x.translate(p.x, p.y); x.rotate(p.rot); x.fillStyle = p.c; x.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); x.restore(); }
    if (alive) requestAnimationFrame(step); else x.clearRect(0, 0, c.width, c.height); })(t0);
}

// ======================= UI =======================
let toastT;
function toast(msg) { const el = $('toast'); el.textContent = msg; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => el.hidden = true, 2500); }
function renderHud() {
  const n = S.seen.length; $('progText').textContent = `${n}/${BUGS.length}`; $('progBar').style.width = (n / BUGS.length * 100) + '%';
  $('sndBtn').textContent = S.sound ? '🔊' : '🔇'; $('todayCnt').textContent = S.total ? `모두 ${S.total}마리` : ''; $('dexCnt').textContent = `${n}/${BUGS.length}종`;
  if (n === BUGS.length && !S.done) { S.done = true; save(); setTimeout(() => { confetti(); toast('🏆 도감을 모두 채웠어요! 곤충 박사님!'); }, 600); }
}
function renderPlaces() {
  const box = $('places'); box.innerHTML = '';
  PLACES.forEach(p => { const b = document.createElement('button'); b.className = 'place' + (p.id === S.place ? ' on' : ''); const got = BUGS.filter(x => x.place.includes(p.id) && S.caught[x.id]).length, all = BUGS.filter(x => x.place.includes(p.id)).length;
    b.innerHTML = `<img class="px" src="${icon(p.id)}" alt="">${p.name}<small>${got}/${all}</small>`; b.addEventListener('click', () => { if (S.place !== p.id) { S.place = p.id; bugs = []; spawnT = .3; player.x = WW / 2; player.y = 0; player.vy = 0; player.py = 220; player.gy = GROUND + 8; cam = camTarget = clamp(player.x - W / 2, 0, WW - W); save(); renderPlaces(); renderScene(); preloadFrames(); beep(SND.tap); } }); box.appendChild(b); });
}
function renderScene() { const p = placeOf(); $('placeName').textContent = (S.night && !p.dark ? '밤의 ' : '') + p.name; $('placeHint').textContent = p.hint; $('dayBtn').textContent = S.night ? '🌙 밤' : '☀️ 낮'; $('dayBtn').hidden = !!p.dark; $('btnJ').hidden = !!p.free; }
function renderStrip() {
  const st = $('strip'); st.innerHTML = ''; $('stripEmpty').hidden = S.recent.length > 0;
  S.recent.forEach(id => { const b = BUG[id]; if (!b) return; const d = document.createElement('button'); d.className = 'mini'; const ph = PHOTOS[id]; d.innerHTML = `<div class="b${ph && ph.img ? ' photo' : ''}">${ph && ph.img ? `<img src="${ph.img}" alt="${b.name}" loading="lazy" onerror="this.src='${bugURL(id)}';this.parentElement.classList.remove('photo')">` : `<img src="${bugURL(id)}" alt="">`}</div>${b.name}`; d.addEventListener('click', () => showCard(b, 'view')); st.appendChild(d); });
}
let filter = 'all';
function renderGrid() {
  const fs = $('filters'); if (!fs.children.length) {
    [['all', '전체'], ['meadow', '풀밭'], ['forest', '숲'], ['pond', '연못'], ['yard', '마당'], ['sea', '바다'], ['mountain', '산'], ['deepsea', '심해'], ['underground', '땅속'], ['rocks', '바위틈'], ['night', '🌙 밤'], ['rare', '⭐ 희귀'], ['not', '곤충 아님'], ['got', '✅ 잡은 것']].forEach(([k, label]) => { const c = document.createElement('button'); c.className = 'chip' + (k === filter ? ' on' : ''); c.dataset.k = k; c.textContent = label; c.addEventListener('click', () => { filter = k; [...fs.children].forEach(x => x.classList.toggle('on', x.dataset.k === k)); renderGrid(); }); fs.appendChild(c); });
  }
  const list = BUGS.filter(b => filter === 'all' || (filter === 'night' ? b.time !== 'day' : filter === 'rare' ? b.rare === 2 : filter === 'not' ? b.notInsect : filter === 'got' ? S.caught[b.id] : b.place.includes(filter)));
  const grid = $('grid'); grid.innerHTML = '';
  list.forEach(b => { const n = S.caught[b.id] || 0, known = n > 0; const c = document.createElement('button'); c.className = 'card' + (known ? '' : ' unknown') + (known && S.recent[0] === b.id && n === 1 ? ' new' : '');
    c.innerHTML = `${b.rare === 2 ? '<span class="rare">⭐</span>' : ''}${known ? `<span class="cnt">${n}</span>` : ''}${known ? photoThumb(b) : `<img src="${bugURL(b.id)}" alt="" loading="lazy">`}<div class="nm">${known ? b.name : '???'}</div>`;
    c.addEventListener('click', () => { if (known) showCard(b, 'view'); else { toast(`${b.place.map(p => PLACES.find(x => x.id === p).name).join('·')}에서 ${b.time === 'night' ? '밤에 ' : b.time === 'day' ? '낮에 ' : ''}찾아보세요!`); beep(SND.tap); } });
    grid.appendChild(c); });
}
function askReset() {
  const n = S.seen.length, t = S.total;
  $('mbox').innerHTML = `<div class="confirm"><div class="big">🗑️</div><h3>잡은 곤충을 모두 지울까요?</h3>
    <p>${n ? `도감에 넣은 <b>${n}종</b>, 지금까지 잡은 <b>${t}마리</b> 기록이 모두 사라져요.<br>지우고 나면 되돌릴 수 없어요.` : '아직 잡은 곤충이 없어요.'}</p>
    <div class="row2"><button class="close ghost" id="rNo">취소</button>${n ? '<button class="close danger" id="rYes">모두 지우기</button>' : ''}</div></div>`;
  modalOpenedAt = performance.now(); $('modal').hidden = false; beep(SND.tap);
  $('rNo').onclick = () => { $('modal').hidden = true; beep(SND.tap); };
  const y = $('rYes'); if (y) y.onclick = () => { if (performance.now() - modalOpenedAt < 300) return; resetProgress(); $('modal').hidden = true; };
}
function resetProgress() {
  S.caught = {}; S.seen = []; S.recent = []; S.total = 0; S.done = false; save();
  renderHud(); renderStrip(); renderGrid(); renderPlaces(); beep(SND.tap); toast('🧹 도감을 깨끗하게 비웠어요. 다시 모아 볼까요?');
}
function showView(v) { document.querySelectorAll('.view').forEach(x => x.hidden = x.id !== 'v-' + v); document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.v === v)); }
const scroller = $('scroller');

$('sndBtn').addEventListener('click', () => { S.sound = !S.sound; save(); renderHud(); beep(SND.tap); });
document.querySelectorAll('.tab').forEach(tb => tb.addEventListener('click', () => { const same = tb.classList.contains('on'); showView(tb.dataset.v); beep(SND.tap); if (tb.dataset.v === 'ex' && same) scroller.scrollTo({ top: 0 }); else if (tb.dataset.v === 'dex') scroller.scrollTo({ top: tb.parentElement.offsetTop }); }));
